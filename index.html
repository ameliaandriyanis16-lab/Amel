<script>

/* =====================================================
   14 OBAT EMERGENCY
===================================================== */

const drugs = [

    "Epinephrine",
    "Norepinephrine",
    "Dopamine",
    "Dobutamine",
    "Midazolam",
    "Fentanyl",
    "Ketamine",
    "Lidocaine",

    "Meylon",
    "Atropine sulfate",
    "Amiodarone",
    "Dexamethasone",
    "Calcium gluconate"

];


/* =====================================================
   STORAGE
===================================================== */

let stock =
    JSON.parse(
        localStorage.getItem(
            "smartTrolleyStock"
        )
    ) || {};

let usageHistory =
    JSON.parse(
        localStorage.getItem(
            "smartTrolleyUsageHistory"
        )
    ) || [];


/*
   Hapus alkohol lama kalau sebelumnya
   pernah tersimpan.
*/

delete stock["Alkohol 70%"];


/*
   Pastikan semua obat mempunyai stok.
*/

drugs.forEach(drug => {

    if(
        typeof stock[drug] !== "number"
    ){

        stock[drug] = 0;

    }

});


saveStock();


function saveStock(){

    localStorage.setItem(
        "smartTrolleyStock",
        JSON.stringify(stock)
    );

}


function saveHistory(){

    localStorage.setItem(
        "smartTrolleyUsageHistory",
        JSON.stringify(usageHistory)
    );

}


/* =====================================================
   CAMERA
===================================================== */

let cameraStream = null;

let currentZoom = 2;

let detectedDrug = "";

let ocrWorker = null;

let isScanning = false;


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

    const video =
        document.getElementById(
            "video"
        );

    try{

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video:{

                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    },

                    frameRate:{
                        ideal:30
                    }

                },

                audio:false

            });


        video.srcObject =
            cameraStream;


        document.getElementById(
            "scanStatus"
        ).innerText =
            "Kamera siap digunakan";

    }

    catch(error){

        document.getElementById(
            "scanStatus"
        ).innerText =
            "Kamera tidak dapat digunakan: " +
            error.message;

    }

}


/* =====================================================
   ZOOM
===================================================== */

function setZoom(value){

    currentZoom = value;


    document
        .getElementById("zoom2")
        .classList.toggle(
            "active",
            value === 2
        );


    document
        .getElementById("zoom25")
        .classList.toggle(
            "active",
            value === 2.5
        );


    document.getElementById(
        "scanStatus"
    ).innerText =
        "Zoom " +
        value +
        "× dipilih";

}


/* =====================================================
   CAPTURE FOTO
   TIDAK MEMAKAI CROP SEMPIT
===================================================== */

function captureFrame(){

    const video =
        document.getElementById(
            "video"
        );

    const canvas =
        document.getElementById(
            "canvas"
        );


    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        return null;

    }


    const width =
        video.videoWidth;

    const height =
        video.videoHeight;


    /*
       Seluruh frame digunakan.
       Tidak ada crop sempit.
    */

    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    /*
       Zoom hanya dilakukan secara visual
       terhadap bagian tengah, tetapi
       foto utama tetap full frame.
    */

    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );


    return canvas;

}


/* =====================================================
   BUAT GAMBAR ZOOM
   TETAP AREA LUAS
===================================================== */

function createZoomCanvas(
    sourceCanvas,
    zoom
){

    const output =
        document.createElement(
            "canvas"
        );


    const width =
        sourceCanvas.width;

    const height =
        sourceCanvas.height;


    /*
       Kita hanya sedikit memperbesar
       area tengah, bukan crop sempit.
    */

    const cropWidth =
        Math.floor(
            width / zoom
        );

    const cropHeight =
        Math.floor(
            height / zoom
        );


    const sx =
        Math.floor(
            (width - cropWidth) / 2
        );

    const sy =
        Math.floor(
            (height - cropHeight) / 2
        );


    output.width =
        width;

    output.height =
        height;


    const ctx =
        output.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    ctx.imageSmoothingEnabled =
        true;


    ctx.drawImage(

        sourceCanvas,

        sx,
        sy,
        cropWidth,
        cropHeight,

        0,
        0,
        width,
        height

    );


    return output;

}


/* =====================================================
   IMAGE ENHANCEMENT
===================================================== */

function enhanceCanvas(
    sourceCanvas,
    mode = "normal"
){

    const output =
        document.createElement(
            "canvas"
        );


    /*
       Jangan memperbesar terlalu besar
       karena membuat OCR lambat.
    */

    const maxWidth = 1600;


    let scale = 1;


    if(
        sourceCanvas.width <
        maxWidth
    ){

        scale =
            Math.min(
                1.5,
                maxWidth /
                sourceCanvas.width
            );

    }


    output.width =
        Math.floor(
            sourceCanvas.width *
            scale
        );

    output.height =
        Math.floor(
            sourceCanvas.height *
            scale
        );


    const ctx =
        output.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    ctx.drawImage(
        sourceCanvas,
        0,
        0,
        output.width,
        output.height
    );


    const image =
        ctx.getImageData(
            0,
            0,
            output.width,
            output.height
        );


    const data =
        image.data;


    for(
        let i = 0;
        i < data.length;
        i += 4
    ){

        let r =
            data[i];

        let g =
            data[i + 1];

        let b =
            data[i + 2];


        /*
           Grayscale.
        */

        let gray =
            (
                0.299 * r +
                0.587 * g +
                0.114 * b
            );


        if(
            mode === "contrast"
        ){

            gray =
                (
                    (gray - 128) *
                    1.45
                ) + 128;


            gray =
                Math.max(
                    0,
                    Math.min(
                        255,
                        gray
                    )
                );

        }


        if(
            mode === "threshold"
        ){

            gray =
                gray > 150
                    ? 255
                    : 0;

        }


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        image,
        0,
        0
    );


    return output;

}


/* =====================================================
   NORMALISASI OCR
   ANGKA TIDAK DIUBAH
===================================================== */

function normalizeText(text){

    return String(
        text || ""
    )

    .toUpperCase()

    /*
       Hanya membersihkan simbol.
       ANGKA TETAP ANGKA.
    */

    .replace(/[^A-Z0-9]+/g," ")

    .replace(/\s+/g," ")

    .trim();

}


function compactText(text){

    return normalizeText(text)
        .replace(/\s/g,"");

}

/* =====================================================
   LEVENSHTEIN
===================================================== */

function levenshtein(a,b){

    a = String(a);
    b = String(b);


    const matrix = [];


    for(
        let i = 0;
        i <= b.length;
        i++
    ){

        matrix[i] = [i];

    }


    for(
        let j = 0;
        j <= a.length;
        j++
    ){

        matrix[0][j] = j;

    }


    for(
        let i = 1;
        i <= b.length;
        i++
    ){

        for(
            let j = 1;
            j <= a.length;
            j++
        ){

            if(
                b.charAt(i - 1) ===
                a.charAt(j - 1)
            ){

                matrix[i][j] =
                    matrix[i - 1][j - 1];

            }

            else{

                matrix[i][j] =
                    Math.min(

                        matrix[i - 1][j - 1] + 1,

                        matrix[i][j - 1] + 1,

                        matrix[i - 1][j] + 1

                    );

            }

        }

    }


    return matrix[
        b.length
    ][
        a.length
    ];

}


/* =====================================================
   SIMILARITY
===================================================== */

function similarity(a,b){

    a =
        compactText(a);

    b =
        compactText(b);


    if(
        !a ||
        !b
    ){

        return 0;

    }


    const distance =
        levenshtein(
            a,
            b
        );


    const maxLength =
        Math.max(
            a.length,
            b.length
        );


    return 1 -
        (
            distance /
            maxLength
        );

}


/* =====================================================
   IDENTIFIKASI OBAT
===================================================== */

function identifyDrug(
    rawText
){

    const text =
        normalizeText(
            rawText
        );


    const compact =
        compactText(
            rawText
        );


    if(!text){

        return null;

    }


    /*
       1. Nama lengkap.
    */

    for(
        const drug of drugs
    ){

        const full =
            compactText(
                drug
            );


        if(
            compact.includes(
                full
            )
        ){

            return {

                drug:drug,

                score:1

            };

        }

    }


    /*
       2. Alias langsung.
    */

    let bestDrug = null;

    let bestScore = 0;


    for(
        const drug of drugs
    ){

        const aliases =
            drugAliases[
                drug
            ] || [];


        for(
            const alias of aliases
        ){

            const aliasCompact =
                compactText(
                    alias
                );


            if(
                aliasCompact.length < 3
            ){

                continue;

            }


            if(
                compact.includes(
                    aliasCompact
                )
            ){

                let score =
                    0.90;


                if(
                    aliasCompact.length >= 6
                ){

                    score =
                        0.95;

                }


                if(
                    aliasCompact.length >= 8
                ){

                    score =
                        0.98;

                }


                if(
                    score > bestScore
                ){

                    bestScore =
                        score;

                    bestDrug =
                        drug;

                }

            }

        }

    }


    /*
       3. Cocokkan setiap kata OCR.
    */

    const words =
        text
            .split(/\s+/)
            .filter(
                word =>
                    word.length >= 4
            );


    for(
        const word of words
    ){

        for(
            const drug of drugs
        ){

            const aliases =
                drugAliases[
                    drug
                ] || [];


            for(
                const alias of aliases
            ){

                if(
                    alias.length < 4
                ){

                    continue;

                }


                const score =
                    similarity(
                        word,
                        alias
                    );


                if(
                    score >= 0.76 &&
                    score > bestScore
                ){

                    bestScore =
                        score;

                    bestDrug =
                        drug;

                }

            }

        }

    }


    if(bestDrug){

        return {

            drug:bestDrug,

            score:bestScore

        };

    }


    return null;

}


/* =====================================================
   OCR WORKER
===================================================== */

async function getOCRWorker(){

    if(ocrWorker){

        return ocrWorker;

    }


    ocrWorker =
        await Tesseract.createWorker(
            "eng",
            1,
            {

                logger:function(message){

                    if(
                        message.status ===
                        "recognizing text"
                    ){

                        const percent =
                            Math.round(
                                (
                                    message.progress ||
                                    0
                                ) * 100
                            );


                        document.getElementById(
                            "ocrStatus"
                        ).innerText =
                            "Membaca label... " +
                            percent +
                            "%";

                    }

                }

            }
        );


    await ocrWorker.setParameters({

        tessedit_pageseg_mode:
            Tesseract.PSM.SPARSE_TEXT,

        preserve_interword_spaces:
            "0",

        user_defined_dpi:
            "300"

    });


    return ocrWorker;

}


/* =====================================================
   BACA OCR
===================================================== */

async function readOCR(
    canvas
){

    const worker =
        await getOCRWorker();


    const result =
        await worker.recognize(
            canvas
        );


    return (
        result.data.text ||
        ""
    );

}


/* =====================================================
   SCAN
===================================================== */

async function scanMedicine(){

    if(isScanning){

        return;

    }


    isScanning = true;


    const status =
        document.getElementById(
            "ocrStatus"
        );


    const resultBox =
        document.getElementById(
            "scanResult"
        );


    const approveBtn =
        document.getElementById(
            "approveBtn"
        );


    const retryBtn =
        document.getElementById(
            "retryBtn"
        );


    approveBtn.classList.add(
        "hidden"
    );


    retryBtn.classList.add(
        "hidden"
    );


    resultBox.innerText =
        "🔍 Membaca label...";


    status.className =
        "status loading";


    status.innerText =
        "Mengambil foto...";


    try{

        const frame =
            captureFrame();


        if(!frame){

            throw new Error(
                "Kamera belum siap."
            );

        }


        /*
           OCR dimulai dari gambar penuh.
        */

        const candidates = [];


        /*
           Kandidat 1:
           gambar asli.
        */

        candidates.push(
            frame
        );


        /*
           Kandidat 2:
           grayscale.
        */

        candidates.push(
            enhanceCanvas(
                frame,
                "normal"
            )
        );


        /*
           Kandidat 3:
           contrast.
        */

        candidates.push(
            enhanceCanvas(
                frame,
                "contrast"
            )
        );


        /*
           Kandidat 4:
           zoom 2x dengan area
           yang masih cukup luas.
        */

        const zoom2 =
            createZoomCanvas(
                frame,
                2
            );


        candidates.push(
            enhanceCanvas(
                zoom2,
                "contrast"
            )
        );


        /*
           Kandidat 5 hanya untuk
           tulisan sangat kontras.
        */

        candidates.push(
            enhanceCanvas(
                frame,
                "threshold"
            )
        );


        let finalDrug = null;

        let finalScore = 0;

        let allText = "";


        for(
            let i = 0;
            i < candidates.length;
            i++
        ){

            status.innerText =
                "Scan label " +
                (i + 1) +
                "/" +
                candidates.length +
                "...";


            const text =
                await readOCR(
                    candidates[i]
                );


            console.log(
                "OCR " +
                (i + 1) +
                ":",
                text
            );


            allText +=
                " " +
                text;


            const identified =
                identifyDrug(
                    text
                );


            if(
                identified &&
                identified.score >
                finalScore
            ){

                finalDrug =
                    identified.drug;

                finalScore =
                    identified.score;

            }


            /*
               Kalau sudah menemukan
               nama lengkap / kecocokan kuat,
               tidak perlu lanjut semua OCR.
            */

            if(
                finalDrug &&
                finalScore >= 0.98
            ){

                break;

            }

        }


        /*
           Kalau belum ditemukan,
           cek seluruh hasil OCR.
        */

        if(!finalDrug){

            const combined =
                identifyDrug(
                    allText
                );


            if(combined){

                finalDrug =
                    combined.drug;

                finalScore =
                    combined.score;

            }

        }


        if(finalDrug){

            detectedDrug =
                finalDrug;


            resultBox.innerText =
                "💊 " +
                finalDrug;


            status.className =
                "status";


            status.innerText =
                "Nama obat berhasil dikenali. " +
                "Silakan APPROVE jika benar.";


            approveBtn.classList.remove(
                "hidden"
            );


            retryBtn.classList.remove(
                "hidden"
            );

        }

        else{

            detectedDrug = "";


            resultBox.innerText =
                "❌ Nama obat belum dikenali";


            status.className =
                "status";


            status.innerText =
                "Nama obat belum terbaca. " +
                "Pastikan label terlihat jelas " +
                "dan coba SCAN ULANG.";


            retryBtn.classList.remove(
                "hidden"
            );

        }

    }

    catch(error){

        console.error(error);


        resultBox.innerText =
            "❌ Scan gagal";


        status.className =
            "status";


        status.innerText =
            error.message ||
            "Terjadi kesalahan saat OCR.";


        retryBtn.classList.remove(
            "hidden"
        );

    }

    finally{

        isScanning = false;

    }

}


/* =====================================================
   APPROVE
===================================================== */

function approveMedicine(){

    if(!detectedDrug){

        return;

    }


    stock[detectedDrug] =
        (
            stock[detectedDrug] ||
            0
        ) + 1;


    saveStock();

    renderStock();


    document.getElementById(
        "scanResult"
    ).innerText =
        "✅ " +
        detectedDrug +
        " ditambahkan ke stok";


    document.getElementById(
        "ocrStatus"
    ).innerText =
        "Stok berhasil bertambah +1.";


    document.getElementById(
        "approveBtn"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "retryBtn"
    ).classList.remove(
        "hidden"
    );


    detectedDrug = "";

}

/* =====================================================
   STOCK
===================================================== */

function changeStock(
    drug,
    amount
){

    stock[drug] =
        Math.max(
            0,
            (
                stock[drug] ||
                0
            ) + amount
        );


    saveStock();

    renderStock();

}


function renderStock(){

    const container =
        document.getElementById(
            "stockList"
        );


    container.innerHTML = "";


    drugs.forEach(
        drug => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =

            row.innerHTML = `

                <div class="drug-name">
                    ${drug}
                </div>

                <div class="stock-control">

                    <button
                        onclick="changeStock('${drug}',-1)">
                        −
                    </button>

                    <div class="stock-number">

                    </div>

                    <button
                        onclick="changeStock('${drug}',1)">
                        +
                    </button>

                </div>

            `;


            container.appendChild(
                row
            );

        }
    );

}

/* =====================================================
   TANGGAL
===================================================== */

function formatDate(
    timestamp
){

    const date =
        new Date(
            timestamp
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const year =
        date.getFullYear();


    return (
        day +
        "/" +
        month +
        "/" +
        year
    );

}


/* =====================================================
   JAM
===================================================== */

function formatTime(
    timestamp
){

    const date =
        new Date(
            timestamp
        );


    const hours =
        String(
            date.getHours()
        ).padStart(
            2,
            "0"
        );


    const minutes =
        String(
            date.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            date.getSeconds()
        ).padStart(
            2,
            "0"
        );


    return (
        hours +
        ":" +
        minutes +
        ":" +
        seconds
    );

}


/* =====================================================
   PEMAKAIAN
===================================================== */

function addUsage(){

    const drug =
        document.getElementById(
            "usageDrug"
        ).value;


    const patient =
        document.getElementById(
            "patientName"
        ).value.trim();


    const dose =
        document.getElementById(
            "usageDose"
        ).value.trim();


    const qty =
        parseInt(
            document.getElementById(
                "usageQty"
            ).value
        );


    if(!patient){

        alert(
            "Nama pasien wajib diisi."
        );

        return;

    }


    if(!dose){

        alert(
            "Dosis wajib diisi."
        );

        return;

    }


    if(
        !qty ||
        qty < 1
    ){

        alert(
            "Jumlah obat tidak valid."
        );

        return;

    }


    if(
        (
            stock[drug] ||
            0
        ) < qty
    ){

        alert(
            "Stok " +
            drug +
            " tidak mencukupi."
        );

        return;

    }


    const timestamp =
        Date.now();


    const date =
        formatDate(
            timestamp
        );


    const time =
        formatTime(
            timestamp
        );


    stock[drug] -= qty;


    usageHistory.unshift({

        id:
            timestamp +
            "-" +
            Math.random()
                .toString(36)
                .substring(
                    2,
                    8
                ),

        timestamp:
            timestamp,

        drug:
            drug,

        patient:
            patient,

        dose:
            dose,

        qty:
            qty,

        date:
            date,

        time:
            time

    });


    saveStock();

    saveHistory();


    renderStock();

    renderHistory();


    document.getElementById(
        "patientName"
    ).value = "";


    document.getElementById(
        "usageDose"
    ).value = "";


    document.getElementById(
        "usageQty"
    ).value = 1;


    alert(

        "Pemakaian " +
        drug +
        " berhasil dicatat.\n\n" +

        "Tanggal: " +
        date +
        "\n" +

        "Jam: " +
        time

    );

}


/* =====================================================
   RIWAYAT
===================================================== */

function renderHistory(){

    const container =
        document.getElementById(
            "historyList"
        );


    if(
        !usageHistory ||
        usageHistory.length === 0
    ){

        container.innerHTML =
            "Belum ada riwayat pemakaian.";

        return;

    }


    container.innerHTML = "";


    usageHistory.forEach(
        item => {

            const timestamp =
                item.timestamp ||
                Date.now();


            const date =
                item.date ||
                formatDate(
                    timestamp
                );


            const time =
                item.time ||
                formatTime(
                    timestamp
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "history-item";


            div.innerHTML = `

                <div class="history-drug">
                    💊 ${item.drug}
                </div>

                <div class="history-info">
                    👤 Pasien:
                    ${item.patient}
                </div>

                <div class="history-info">
                    💉 Dosis:
                    ${item.dose || "-"}
                </div>

                <div class="history-info">
                    🔢 Jumlah:
                    ${item.qty}
                </div>

                <div class="history-date">

                    📅 Tanggal:
                    ${date}

                    <br>

                    🕐 Jam:
                    ${time}

                </div>

                <button
                    class="delete-btn"
                    onclick="deleteHistory('${item.id}')">
                    🗑️ Hapus
                </button>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   DELETE HISTORY
   TIDAK MENGEMBALIKAN STOK
===================================================== */

function deleteHistory(
    id
){

    const confirmed =
        confirm(

            "Hapus riwayat ini?\n\n" +
            "Stok tidak akan dikembalikan."

        );


    if(!confirmed){

        return;

    }


    usageHistory =
        usageHistory.filter(
            item =>
                String(
                    item.id
                ) !==
                String(
                    id
                )
        );


    saveHistory();

    renderHistory();

}


/* =====================================================
   DELETE ALL
===================================================== */

function deleteAllHistory(){

    if(
        usageHistory.length === 0
    ){

        alert(
            "Tidak ada riwayat."
        );

        return;

    }


    const confirmed =
        confirm(

            "Hapus SEMUA riwayat?\n\n" +
            "Stok tidak akan dikembalikan."

        );


    if(!confirmed){

        return;

    }


    usageHistory = [];


    saveHistory();

    renderHistory();

}

/* =====================================================
   LOAD LAST PRINT
===================================================== */

function loadLastPrint(){

    const saved =
        localStorage.getItem(
            "smartTrolleyLastPrint"
        );


    if(!saved){

        return;

    }


    try{

        const data =
            JSON.parse(
                saved
            );


        if(data.drug){

            document.getElementById(
                "printDrug"
            ).value =
                data.drug;

        }


        if(data.dose){

            document.getElementById(
                "printDose"
            ).value =
                data.dose;

        }


        if(data.patient){

            document.getElementById(
                "printPatient"
            ).value =
                data.patient;

        }

    }

    catch(error){

        console.log(
            "Data print sebelumnya tidak dapat dibaca."
        );

    }

}
