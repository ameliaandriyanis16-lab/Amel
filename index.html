<script>

/* =====================================================
   DAFTAR OBAT EMERGENCY TROLLEY
===================================================== */

const drugs = [
    "Epinephrine",
    "Norepinephrine",
    "Dopamine",
    "Dobutamine",
    "Midazolam",
    "Fentanyl",
    "Ketamine",
    "Lidocaine",
    "D40",
    "Meylon",
    "Atropine sulfate",
    "Amiodarone",
    "Dexamethasone",
    "Calcium gluconate"
];


/* =====================================================
   STORAGE
===================================================== */

let stock =
    JSON.parse(
        localStorage.getItem("smartTrolleyStock")
    ) || {};

let usageHistory =
    JSON.parse(
        localStorage.getItem("smartTrolleyUsageHistory")
    ) || [];

delete stock["Alkohol 70%"];

drugs.forEach(drug => {

    if(typeof stock[drug] !== "number"){
        stock[drug] = 0;
    }

});

saveStock();


function saveStock(){

    localStorage.setItem(
        "smartTrolleyStock",
        JSON.stringify(stock)
    );

}


function saveHistory(){

    localStorage.setItem(
        "smartTrolleyUsageHistory",
        JSON.stringify(usageHistory)
    );

}


/* =====================================================
   CAMERA
===================================================== */

let cameraStream = null;
let currentZoom = 2;
let detectedDrug = "";
let ocrWorker = null;
let isScanning = false;


async function startCamera(){

    const video =
        document.getElementById("video");

    try{

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    },

                    frameRate:{
                        ideal:30
                    }
                },

                audio:false

            });

        video.srcObject = cameraStream;

        document.getElementById("scanStatus")
            .innerText =
            "Kamera siap digunakan";

    }

    catch(error){

        document.getElementById("scanStatus")
            .innerText =
            "Kamera tidak dapat digunakan: " +
            error.message;

    }

}


/* =====================================================
   ZOOM
===================================================== */

function setZoom(value){

    currentZoom = value;

    document
        .getElementById("zoom2")
        .classList.toggle(
            "active",
            value === 2
        );

    document
        .getElementById("zoom25")
        .classList.toggle(
            "active",
            value === 2.5
        );

    document.getElementById("scanStatus")
        .innerText =
        "Zoom " + value + "× dipilih";

}


/* =====================================================
   CAPTURE FOTO
===================================================== */

function captureFrame(){

    const video =
        document.getElementById("video");

    const canvas =
        document.getElementById("canvas");

    if(!video.videoWidth || !video.videoHeight){
        return null;
    }

    const width =
        video.videoWidth;

    const height =
        video.videoHeight;

    /*
       Fokus utama ke bagian tengah gambar.
       Ini membantu OCR agar tidak membaca
       seluruh background trolley.
    */

    const cropWidth =
        Math.floor(width * 0.78);

    const cropHeight =
        Math.floor(height * 0.42);

    const sx =
        Math.floor((width - cropWidth) / 2);

    const sy =
        Math.floor((height - cropHeight) / 2);

    canvas.width =
        cropWidth;

    canvas.height =
        cropHeight;

    const ctx =
        canvas.getContext("2d", {
            willReadFrequently:true
        });

    ctx.drawImage(
        video,
        sx,
        sy,
        cropWidth,
        cropHeight,
        0,
        0,
        cropWidth,
        cropHeight
    );

    return canvas;
}


/* =====================================================
   IMAGE ENHANCEMENT
===================================================== */

function enhanceCanvas(
    sourceCanvas,
    mode = "normal",
    scale = 2
){

    const output =
        document.createElement("canvas");

    output.width =
        sourceCanvas.width * scale;

    output.height =
        sourceCanvas.height * scale;

    const ctx =
        output.getContext("2d", {
            willReadFrequently:true
        });

    ctx.imageSmoothingEnabled = false;

    ctx.drawImage(
        sourceCanvas,
        0,
        0,
        output.width,
        output.height
    );

    const image =
        ctx.getImageData(
            0,
            0,
            output.width,
            output.height
        );

    const data =
        image.data;

    for(let i = 0; i < data.length; i += 4){

        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];

        /*
           Grayscale
        */

        let gray =
            (0.299 * r) +
            (0.587 * g) +
            (0.114 * b);


        if(mode === "contrast"){

            gray =
                ((gray - 128) * 1.65) + 128;

            gray =
                Math.max(
                    0,
                    Math.min(255, gray)
                );

        }


        if(mode === "threshold"){

            gray =
                gray > 145
                    ? 255
                    : 0;

        }


        data[i] =
        data[i + 1] =
        data[i + 2] =
            gray;

    }

    ctx.putImageData(
        image,
        0,
        0
    );

    return output;

}


/* =====================================================
   NORMALISASI OCR
===================================================== */

function normalizeText(text){

    return String(text || "")
        .toUpperCase()

        .replace(/0/g,"O")
        .replace(/1/g,"I")
        .replace(/5/g,"S")
        .replace(/8/g,"B")

        .replace(/[^A-Z0-9]+/g," ")

        .replace(/\s+/g," ")

        .trim();

}


function compactText(text){

    return normalizeText(text)
        .replace(/\s/g,"");

}


/* =====================================================
   ALIAS KHUSUS 14 OBAT
===================================================== */

const drugAliases = {

    "Epinephrine":[
        "EPINE",
        "EPINEP",
        "EPINEPH",
        "ADRENA",
        "ADRENAL"
    ],

    "Norepinephrine":[
        "NOREP",
        "NOREPI",
        "NOREPIN",
        "NOREPINE",
        "NOREPINEP",
        "NOREPINEPH"
    ],

    "Dopamine":[
        "DOPA",
        "DOPAM",
        "DOPAMI",
        "DOPAMIN",
        "DOPAMINE"
    ],

    "Dobutamine":[
        "DOBUT",
        "DOBUTA",
        "DOBUTAM",
        "DOBUTAMI",
        "DOBUTAMINE"
    ],

    "Midazolam":[
        "MIDA",
        "MIDAZ",
        "MIDAZO",
        "MIDAZOL",
        "MIDAZOLA",
        "MIDAZOLAM"
    ],

    "Fentanyl":[
        "FENT",
        "FENTA",
        "FENTAN",
        "FENTANY",
        "FENTANYL"
    ],

    "Ketamine":[
        "KETA",
        "KETAM",
        "KETAMI",
        "KETAMIN",
        "KETAMINE"
    ],

    "Lidocaine":[
        "LIDO",
        "LIDOC",
        "LIDOCA",
        "LIDOCAI",
        "LIDOCAINE"
    ],

    "D40":[
        "D40",
        "DEX40",
        "DEXTROSE40",
        "DEXTROSE"
    ],

    "Meylon":[
        "MEYL",
        "MEYLO",
        "MEYLON"
    ],

    "Atropine sulfate":[
        "ATROP",
        "ATROPI",
        "ATROPIN",
        "ATROPINE",
        "SULFATE"
    ],

    "Amiodarone":[
        "AMIOD",
        "AMIODA",
        "AMIODAR",
        "AMIODARO",
        "AMIODARON",
        "AMIODARONE",
        "AMIDAR"
    ],

    "Dexamethasone":[
        "DEXA",
        "DEXAM",
        "DEXAME",
        "DEXAMET",
        "DEXAMETH",
        "DEXAMETHA",
        "DEXAMETHASONE"
    ],

    "Calcium gluconate":[
        "CALCI",
        "CALCIUM",
        "GLUCON",
        "GLUCONA",
        "GLUCONATE"
    ]

};


/* =====================================================
   LEVENSHTEIN
===================================================== */

function levenshtein(a,b){

    a = String(a);
    b = String(b);

    const matrix = [];

    for(let i=0;i<=b.length;i++){
        matrix[i] = [i];
    }

    for(let j=0;j<=a.length;j++){
        matrix[0][j] = j;
    }

    for(let i=1;i<=b.length;i++){

        for(let j=1;j<=a.length;j++){

            if(
                b.charAt(i-1) ===
                a.charAt(j-1)
            ){

                matrix[i][j] =
                    matrix[i-1][j-1];

            }

            else{

                matrix[i][j] =
                    Math.min(

                        matrix[i-1][j-1] + 1,

                        matrix[i][j-1] + 1,

                        matrix[i-1][j] + 1

                    );

            }

        }

    }

    return matrix[b.length][a.length];

}


/* =====================================================
   SIMILARITY
===================================================== */

function similarity(a,b){

    a = compactText(a);
    b = compactText(b);

    if(!a || !b){
        return 0;
    }

    const distance =
        levenshtein(a,b);

    const maxLength =
        Math.max(
            a.length,
            b.length
        );

    return 1 -
        (distance / maxLength);

}


/* =====================================================
   TARGETED DRUG IDENTIFICATION
===================================================== */

function identifyDrug(rawText){

    const text =
        normalizeText(rawText);

    const compact =
        compactText(rawText);

    if(!text){
        return null;
    }


    /*
       PRIORITAS 1:
       Cari nama lengkap langsung.
    */

    for(const drug of drugs){

        const drugCompact =
            compactText(drug);

        if(
            compact.includes(
                drugCompact
            )
        ){

            return {
                drug:drug,
                score:1
            };

        }

    }


    /*
       PRIORITAS 2:
       Cari alias kuat.
    */

    let bestDrug = null;
    let bestScore = 0;

    for(const drug of drugs){

        const aliases =
            drugAliases[drug] || [];

        for(const alias of aliases){

            const aliasCompact =
                compactText(alias);

            if(!aliasCompact){
                continue;
            }

            /*
               Prefix match sangat membantu
               jika OCR hanya membaca sebagian
               nama obat.
            */

            if(
                compact.includes(
                    aliasCompact
                )
            ){

                let score = 0.92;

                if(
                    aliasCompact.length >= 7
                ){
                    score = 0.97;
                }

                if(score > bestScore){

                    bestScore = score;
                    bestDrug = drug;

                }

            }

        }

    }


    /*
       PRIORITAS 3:
       Pecah OCR menjadi kata.
       Hanya dibandingkan dengan alias.
    */

    const words =
        text.split(/\s+/)
        .filter(word => word.length >= 4);


    for(const word of words){

        for(const drug of drugs){

            const aliases =
                drugAliases[drug] || [];

            for(const alias of aliases){

                if(alias.length < 4){
                    continue;
                }

                const score =
                    similarity(
                        word,
                        alias
                    );

                if(
                    score >= 0.78 &&
                    score > bestScore
                ){

                    bestScore = score;
                    bestDrug = drug;

                }

            }

        }

    }


    if(bestDrug){

        return {
            drug:bestDrug,
            score:bestScore
        };

    }

    return null;

}


/* =====================================================
   OCR WORKER
===================================================== */

async function getOCRWorker(){

    if(ocrWorker){
        return ocrWorker;
    }

    ocrWorker =
        await Tesseract.createWorker(
            "eng",
            1,
            {
                logger:function(message){

                    if(
                        message.status ===
                        "recognizing text"
                    ){

                        const percent =
                            Math.round(
                                (message.progress || 0)
                                * 100
                            );

                        document.getElementById(
                            "ocrStatus"
                        ).innerText =
                            "Membaca label... " +
                            percent +
                            "%";

                    }

                }
            }
        );

    /*
       Hanya nama pendek/line.
       Ini lebih cepat daripada OCR
       satu halaman penuh.
    */

    await ocrWorker.setParameters({

        tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE,

        preserve_interword_spaces:"0",

        user_defined_dpi:"300"

    });

    return ocrWorker;

}


/* =====================================================
   OCR
===================================================== */

async function readOCR(canvas){

    const worker =
        await getOCRWorker();

    const result =
        await worker.recognize(
            canvas
        );

    return result.data.text || "";

}


/* =====================================================
   SCAN MEDICINE
===================================================== */

async function scanMedicine(){

    if(isScanning){
        return;
    }

    isScanning = true;

    const status =
        document.getElementById(
            "ocrStatus"
        );

    const resultBox =
        document.getElementById(
            "scanResult"
        );

    const approveBtn =
        document.getElementById(
            "approveBtn"
        );

    const retryBtn =
        document.getElementById(
            "retryBtn"
        );

    approveBtn.classList.add("hidden");
    retryBtn.classList.add("hidden");

    resultBox.innerText =
        "🔍 Membaca label...";

    status.className =
        "status loading";

    status.innerText =
        "Mengambil foto...";


    try{

        const frame =
            captureFrame();

        if(!frame){

            throw new Error(
                "Kamera belum siap."
            );

        }


        /*
           Kandidat dibuat sedikit saja
           supaya scanning lebih cepat.
        */

        const candidates = [

            enhanceCanvas(
                frame,
                "normal",
                currentZoom
            ),

            enhanceCanvas(
                frame,
                "contrast",
                currentZoom
            ),

            enhanceCanvas(
                frame,
                "threshold",
                2
            )

        ];


        let finalDrug = null;
        let finalScore = 0;
        let allText = "";


        for(
            let i = 0;
            i < candidates.length;
            i++
        ){

            status.innerText =
                "Scan label " +
                (i + 1) +
                "/" +
                candidates.length +
                "...";


            const text =
                await readOCR(
                    candidates[i]
                );

            allText +=
                " " +
                text;


            const identified =
                identifyDrug(text);


            if(
                identified &&
                identified.score > finalScore
            ){

                finalDrug =
                    identified.drug;

                finalScore =
                    identified.score;

            }


            /*
               Jika sudah menemukan
               kecocokan kuat, langsung berhenti.
               Ini membuat OCR jauh lebih cepat.
            */

            if(
                finalDrug &&
                finalScore >= 0.92
            ){

                break;

            }

        }


        /*
           Coba gabungan semua teks
           jika belum ditemukan.
        */

        if(!finalDrug){

            const combined =
                identifyDrug(allText);

            if(combined){

                finalDrug =
                    combined.drug;

                finalScore =
                    combined.score;

            }

        }


        if(finalDrug){

            detectedDrug =
                finalDrug;

            resultBox.innerText =
                "💊 " +
                finalDrug;

            status.className =
                "status";

            status.innerText =
                "Nama obat berhasil dikenali. " +
                "Silakan APPROVE jika benar.";

            approveBtn.classList.remove(
                "hidden"
            );

            retryBtn.classList.remove(
                "hidden"
            );

        }

        else{

            detectedDrug = "";

            resultBox.innerText =
                "❌ Nama obat belum dikenali";

            status.className =
                "status";

            status.innerText =
                "Pastikan nama obat terlihat jelas, " +
                "lalu coba SCAN ULANG.";

            retryBtn.classList.remove(
                "hidden"
            );

        }

    }

    catch(error){

        console.error(error);

        resultBox.innerText =
            "❌ Scan gagal";

        status.className =
            "status";

        status.innerText =
            error.message ||
            "Terjadi kesalahan saat OCR.";

        retryBtn.classList.remove(
            "hidden"
        );

    }

    finally{

        isScanning = false;

    }

}


/* =====================================================
   APPROVE HASIL SCAN
   SATU-SATUNYA CARA OCR MENAMBAH STOK
===================================================== */

function approveMedicine(){

    if(!detectedDrug){
        return;
    }

    stock[detectedDrug] =
        (stock[detectedDrug] || 0) + 1;

    saveStock();
    renderStock();

    document.getElementById(
        "scanResult"
    ).innerText =
        "✅ " +
        detectedDrug +
        " ditambahkan ke stok";

    document.getElementById(
        "ocrStatus"
    ).innerText =
        "Stok berhasil bertambah +1.";

    document.getElementById(
        "approveBtn"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "retryBtn"
    ).classList.remove(
        "hidden"
    );

    detectedDrug = "";

}

/* =====================================================

===================================================== */

function changeStock(
    drug,
    amount
){

    stock[drug] =
        Math.max(
            0,
            (stock[drug] || 0) + amount
        );

    saveStock();
    renderStock();

}


function renderStock(){

    const container =

    container.innerHTML = "";

    drugs.forEach(drug => {

/* =====================================================
   DATE & TIME
===================================================== */

function formatDate(timestamp){

    const date =
        new Date(timestamp);

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");

    const year =
        date.getFullYear();

    return (
        day +
        "/" +
        month +
        "/" +
        year
    );

}


function formatTime(timestamp){

    const date =
        new Date(timestamp);

    const hours =
        String(
            date.getHours()
        ).padStart(2,"0");

    const minutes =
        String(
            date.getMinutes()
        ).padStart(2,"0");

    const seconds =
        String(
            date.getSeconds()
        ).padStart(2,"0");

    return (
        hours +
        ":" +
        minutes +
        ":" +
        seconds
    );

}


/* =====================================================
   PEMAKAIAN OBAT
===================================================== */

function addUsage(){

    const drug =
        document.getElementById(
            "usageDrug"
        ).value;

    const patient =
        document.getElementById(
            "patientName"
        ).value.trim();

    const dose =
        document.getElementById(
            "usageDose"
        ).value.trim();

    const qty =
        parseInt(
            document.getElementById(
                "usageQty"
            ).value
        );


    if(!patient){

        alert(
            "Nama pasien wajib diisi."
        );

        return;

    }


    if(!dose){

        alert(
            "Dosis wajib diisi."
        );

        return;

    }


    if(
        !qty ||
        qty < 1
    ){

        alert(
            "Jumlah obat tidak valid."
        );

        return;

    }


    if(
        (stock[drug] || 0) < qty
    ){

        alert(
            "Stok " +
            drug +
            " tidak mencukupi."
        );

        return;

    }


    const timestamp =
        Date.now();

    const date =
        formatDate(
            timestamp
        );

    const time =
        formatTime(
            timestamp
        );


    stock[drug] -= qty;


    usageHistory.unshift({

        id:
            timestamp +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,8),

        timestamp:
            timestamp,

        drug:
            drug,

        patient:
            patient,

        dose:
            dose,

        qty:
            qty,

        date:
            date,

        time:
            time

    });


    saveStock();
    saveHistory();

    renderStock();
    renderHistory();


    document.getElementById(
        "patientName"
    ).value = "";

    document.getElementById(
        "usageDose"
    ).value = "";

    document.getElementById(
        "usageQty"
    ).value = 1;


    alert(
        "Pemakaian " +
        drug +
        " berhasil dicatat.\n\n" +
        "Tanggal: " +
        date +
        "\n" +
        "Jam: " +
        time
    );

}


/* =====================================================
   RIWAYAT
===================================================== */

function renderHistory(){

    const container =
        document.getElementById(
            "historyList"
        );

    if(
        !usageHistory ||
        usageHistory.length === 0
    ){

        container.innerHTML =
            "Belum ada riwayat pemakaian.";

        return;

    }


    container.innerHTML = "";


    usageHistory.forEach(item => {

        const timestamp =
            item.timestamp ||
            Date.now();


        const date =
            item.date ||
            formatDate(timestamp);

        const time =
            item.time ||
            formatTime(timestamp);


        const div =
            document.createElement(
                "div"
            );

        div.className =
            "history-item";


        div.innerHTML = `

            <div class="history-drug">
                💊 ${item.drug}
            </div>

            <div class="history-info">
                👤 Pasien:
                ${item.patient}
            </div>

            <div class="history-info">
                💉 Dosis:
                ${item.dose || "-"}
            </div>

            <div class="history-info">
                🔢 Jumlah:
                ${item.qty}
            </div>

            <div class="history-date">
                📅 Tanggal:
                ${date}
                <br>
                🕐 Jam:
                ${time}
            </div>

            <button
                class="delete-btn"
                onclick="deleteHistory('${item.id}')">
                🗑️ Hapus
            </button>

        `;


        container.appendChild(div);

    });

}


/* =====================================================
   HAPUS SATU RIWAYAT
   TIDAK MENGEMBALIKAN STOK
===================================================== */

function deleteHistory(id){

    const confirmed =
        confirm(
            "Hapus riwayat ini?\n\n" +
            "Stok tidak akan dikembalikan."
        );

    if(!confirmed){
        return;
    }


    usageHistory =
        usageHistory.filter(
            item =>
                String(item.id) !==
                String(id)
        );


    saveHistory();
    renderHistory();

}


/* =====================================================
   HAPUS SEMUA RIWAYAT
   TIDAK MENGEMBALIKAN STOK
===================================================== */

function deleteAllHistory(){

    if(
        usageHistory.length === 0
    ){

        alert(
            "Tidak ada riwayat."
        );

        return;

    }


    const confirmed =
        confirm(
            "Hapus SEMUA riwayat?\n\n" +
            "Stok tidak akan dikembalikan."
        );

    if(!confirmed){
        return;
    }


    usageHistory = [];

    saveHistory();
    renderHistory();

}

/* =====================================================
   LOAD LAST PRINT
===================================================== */

function loadLastPrint(){

    const saved =
        localStorage.getItem(
            "smartTrolleyLastPrint"
        );

    if(!saved){
        return;
    }


    try{

        const data =
            JSON.parse(saved);


        if(data.drug){

            document.getElementById(
                "printDrug"
            ).value =
                data.drug;

        }


        if(data.dose){

            document.getElementById(
                "printDose"
            ).value =
                data.dose;

        }


        if(data.patient){

            document.getElementById(
                "printPatient"
            ).value =
                data.patient;

        }

    }

    catch(error){

        console.log(
            "Data print sebelumnya tidak dapat dibaca."
        );

    }

}
