<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Smart Nursing Trolley System</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    font-family: Arial, sans-serif;
    background: #f4f7f9;
    color: #222;
}

.container {
    max-width: 700px;
    margin: auto;
}

.header,
.card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.header {
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    color: #666;
    margin-bottom: 0;
}

.card {
    padding: 18px;
    margin-bottom: 16px;
}

h2 {
    margin-top: 0;
}

button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 14px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.btn-camera {
    background: #1976d2;
    color: white;
}

.btn-stop {
    background: #d32f2f;
    color: white;
}

.btn-scan {
    background: #388e3c;
    color: white;
}

.btn-approve {
    background: #00897b;
    color: white;
}

.btn-cancel {
    background: #777;
    color: white;
}

.btn-print {
    background: #333;
    color: white;
}

video {
    width: 100%;
    min-height: 260px;
    margin-top: 12px;
    background: black;
    border-radius: 12px;
    object-fit: cover;
    display: block;
}

#status {
    margin-top: 10px;
    padding: 12px;
    text-align: center;
    border-radius: 8px;
    background: #eef2f5;
    font-size: 14px;
}

#ocrResult {
    background: #f1f1f1;
    padding: 12px;
    min-height: 60px;
    border-radius: 8px;
    white-space: pre-wrap;
}

.hidden {
    display: none;
}

.detected {
    background: #e8f5e9;
    padding: 15px;
    border-radius: 10px;
}

.success {
    background: #e8f5e9;
    color: #1b5e20;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
    font-weight: bold;
}

.stock-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid #ddd;
    gap: 10px;
}

.stock-name {
    font-weight: bold;
}

.low {
    color: #d32f2f;
    font-size: 13px;
    margin-top: 4px;
}

.stock-control {
    display: flex;
    align-items: center;
    gap: 7px;
}

.stock-control button {
    width: 42px;
    margin: 0;
    padding: 8px;
}

.qty {
    min-width: 30px;
    text-align: center;
    font-weight: bold;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-top: 5px;
}

#printArea {
    display: none;
}

@media print {

    body * {
        visibility: hidden;
    }

    #printArea,
    #printArea * {
        visibility: visible;
    }

    #printArea {
        display: block;
        position: absolute;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: Arial, sans-serif;
        font-size: 12px;
    }

    @page {
        size: 58mm auto;
        margin: 0;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>
            SMART NURSING TROLLEY SYSTEM
        </h1>

        <p>
            Emergency Drug Inventory System
        </p>

    </div>


    <!-- CAMERA -->

    <div class="card">

        <h2>
            📷 Scan Obat
        </h2>

        <button
            class="btn-camera"
            id="openCamera"
        >
            📷 Buka Kamera Belakang
        </button>

        <button
            class="btn-stop"
            id="stopCamera"
        >
            ⏹️ Matikan Kamera
        </button>

        <video
            id="camera"
            autoplay
            playsinline
            muted
        ></video>

        <div id="status">
            Kamera belum digunakan
        </div>

        <button
            class="btn-scan"
            id="scanButton"
        >
            🔍 Scan Obat
        </button>

    </div>


    <!-- OCR -->

    <div class="card">

        <h2>
            📝 Hasil Scan
        </h2>

        <div id="ocrResult">
            Belum ada hasil scan.
        </div>

    </div>


    <!-- DETECTED MEDICINE -->

    <div
        class="card hidden"
        id="detectedCard"
    >

        <h2>
            💊 Obat Terdeteksi
        </h2>

        <div
            class="detected"
            id="detectedMedicine"
        ></div>

        <button
            class="btn-approve"
            id="approveButton"
        >
            ✅ Approve & Tambahkan ke Stok
        </button>

        <button
            class="btn-cancel"
            id="cancelButton"
        >
            ❌ Batal
        </button>

    </div>


    <!-- STOCK -->

    <div class="card">

        <h2>
            📦 Stok Obat
        </h2>

        <div id="stockList">
            Belum ada obat.
        </div>

    </div>


    <!-- PRINT -->

    <div
        class="card"
        id="printCard"
    >

        <h2>
            🖨️ Print Label
        </h2>

        <label>
            Nama Pasien
        </label>

        <input
            id="patientName"
            type="text"
            placeholder="Nama pasien"
        >

        <label>
            Nama Obat
        </label>

        <input
            id="labelMedicine"
            type="text"
            placeholder="Nama obat"
        >

        <button
            class="btn-print"
            id="printButton"
        >
            🖨️ Print Label 58 mm
        </button>

    </div>

</div>


<!-- PRINT AREA -->

<div id="printArea">

    <strong>
        SMART NURSING TROLLEY
    </strong>

    <hr>

    <div>
        Pasien:
        <span id="printPatient"></span>
    </div>

    <br>

    <div>
        Obat:
        <span id="printMedicine"></span>
    </div>

    <br>

    <div>
        Waktu:
        <span id="printTime"></span>
    </div>

</div>


<script>

/* =====================================================
   FORMULARIUM INTERNAL
   TIDAK DITAMPILKAN DI LAYAR
===================================================== */

const formulary = {

    "Epinephrine": [
        "EPINEPHRINE",
        "EPINEPHRIN",
        "ADRENALINE",
        "ADRENALIN"
    ],

    "Norepinephrine": [
        "NOREPINEPHRINE",
        "NOREPINEPHRIN",
        "NORADRENALINE",
        "NORADRENALIN"
    ],

    "Dopamine": [
        "DOPAMINE",
        "DOPAMIN",
        "DOPAMINE HCL",
        "DOPAMINEHYDROCHLORIDE",
        "DOPAMINEHYDROCHLORID"
    ],

    "Dobutamine": [
        "DOBUTAMINE",
        "DOBUTAMIN"
    ],

    "Midazolam": [
        "MIDAZOLAM",
        "MIDAZOLAN",
        "MIDAZOLAM HCL",
        "MIDAZOLAMHYDROCHLORIDE"
    ],

    "Fentanyl": [
        "FENTANYL",
        "FENTANIL",
        "FENTANYL CITRATE",
        "FENTANYL CITRAT",
        "FENTANYLUM"
    ],

    "Ketamine": [
        "KETAMINE",
        "KETAMIN",
        "KETAMINE HCL",
        "KETAMINEHYDROCHLORIDE"
    ],

    "Lidocaine": [
        "LIDOCAINE",
        "LIDOCAIN",
        "LIGNOCAINE"
    ],

    "D40": [
        "D40",
        "D 40",
        "DEXTROSE 40",
        "DEXTROSE40"
    ],

    "Meylon": [
        "MEYLON",
        "SODIUM BICARBONATE",
        "BICARBONATE"
    ],

    "Dexamethasone": [
        "DEXAMETHASONE",
        "DEXAMETASON",
        "DEXAMETHASON"
    ],

    "Alkohol 70%": [
        "ALKOHOL",
        "ALCOHOL",
        "ETHANOL",
        "70%",
        "70"
    ]

};


/* =====================================================
   VARIABLES
===================================================== */

let stock =
    JSON.parse(
        localStorage.getItem(
            "smartTrolleyStock"
        )
    ) || {};

let detectedDrug = null;

let cameraStream = null;


/* =====================================================
   ELEMENT
===================================================== */

const camera =
    document.getElementById("camera");

const status =
    document.getElementById("status");

const ocrResult =
    document.getElementById("ocrResult");

const detectedCard =
    document.getElementById("detectedCard");

const detectedMedicine =
    document.getElementById("detectedMedicine");

const stockList =
    document.getElementById("stockList");

const printCard =
    document.getElementById("printCard");

const labelMedicine =
    document.getElementById("labelMedicine");


/* =====================================================
   SAVE STOCK
===================================================== */

function saveStock() {

    localStorage.setItem(
        "smartTrolleyStock",
        JSON.stringify(stock)
    );

}


/* =====================================================
   DISPLAY STOCK
===================================================== */

function renderStock() {

    const medicines =
        Object.keys(stock);

    if (medicines.length === 0) {

        stockList.innerHTML =
            "Belum ada obat.";

        return;
    }

    stockList.innerHTML = "";

    medicines.forEach(function(name) {

        const qty = stock[name];

        const row =
            document.createElement("div");

        row.className =
            "stock-row";

        row.innerHTML = `

            <div>

                <div class="stock-name">
                    ${name}
                </div>

                ${
                    qty <= 2
                    ?
                    `<div class="low">
                        ⚠️ Stok rendah
                    </div>`
                    :
                    ""
                }

            </div>

            <div class="stock-control">

                <button
                    onclick="decreaseStock('${name}')"
                >
                    −
                </button>

                <span class="qty">
                    ${qty}
                </span>

                <button
                    onclick="increaseStock('${name}')"
                >
                    +
                </button>

            </div>

        `;

        stockList.appendChild(row);

    });

}


/* =====================================================
   ADD STOCK
===================================================== */

function increaseStock(name) {

    stock[name] =
        (stock[name] || 0) + 1;

    saveStock();

    renderStock();

}


/* =====================================================
   REDUCE STOCK
===================================================== */

function decreaseStock(name) {

    if (!stock[name]) {
        return;
    }

    stock[name]--;

    if (stock[name] < 0) {
        stock[name] = 0;
    }

    saveStock();

    renderStock();

}


/* =====================================================
   FIND MEDICINE
===================================================== */

function findMedicine(text) {

    const upperText =
        text
        .toUpperCase()
        .replace(/\s+/g, " ");

    for (const medicine in formulary) {

        const keywords =
            formulary[medicine];

        for (const keyword of keywords) {

            if (
                upperText.includes(
                    keyword
                )
            ) {

                return medicine;

            }

        }

    }

    return null;

}


/* =====================================================
   OPEN BACK CAMERA
===================================================== */

async function openBackCamera() {

    try {

        status.innerText =
            "📷 Meminta izin kamera...";


        /* STOP CAMERA LAMA */

        if (cameraStream) {

            cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

            cameraStream = null;

        }


        /* CEK SUPPORT */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            status.innerText =
                "❌ Browser tidak mendukung kamera.";

            return;

        }


        /* =================================================
           COBA KAMERA BELAKANG LANGSUNG
        ================================================= */

        try {

            cameraStream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            exact: "environment"
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        }

                    },

                    audio: false

                });

        }

        catch (firstError) {

            console.log(
                "Exact environment gagal:",
                firstError
            );


            /* =================================================
               COBA IDEAL ENVIRONMENT
            ================================================= */

            cameraStream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        }

                    },

                    audio: false

                });

        }


        /* TAMPILKAN CAMERA */

        camera.srcObject =
            cameraStream;

        await camera.play();


        /* CEK CAMERA */

        const tracks =
            cameraStream.getVideoTracks();

        if (tracks.length > 0) {

            const settings =
                tracks[0].getSettings();

            console.log(
                "Camera settings:",
                settings
            );

        }


        status.innerText =
            "✅ Kamera belakang aktif";


    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );

        status.innerText =
            "❌ Kamera gagal: "
            + error.name;

    }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

    if (cameraStream) {

        cameraStream
        .getTracks()
        .forEach(
            track => track.stop()
        );

        cameraStream = null;

    }

    camera.srcObject = null;

    status.innerText =
        "Kamera dimatikan";

}


/* =====================================================
   SCAN MEDICINE
===================================================== */

async function scanMedicine() {

    if (!cameraStream) {

        alert(
            "Buka kamera terlebih dahulu."
        );

        return;

    }


    if (
        !camera.videoWidth ||
        !camera.videoHeight
    ) {

        alert(
            "Kamera belum siap. Tunggu sebentar lalu scan lagi."
        );

        return;

    }


    status.innerText =
        "⏳ Menyiapkan gambar...";


    try {

        /* =================================================
           CANVAS
        ================================================= */

        const canvas =
            document.createElement("canvas");


        canvas.width =
            camera.videoWidth;

        canvas.height =
            camera.videoHeight;


        const ctx =
            canvas.getContext("2d");


        /* =================================================
           GAMBAR CAMERA
        ================================================= */

        ctx.drawImage(

            camera,

            0,
            0,

            canvas.width,
            canvas.height

        );


        /* =================================================
           OCR
        ================================================= */

        status.innerText =
            "🔍 Membaca nama obat...";


        const result =
            await Tesseract.recognize(

                canvas,

                "eng",

                {

                    logger:
                    function(info) {

                        if (
                            info.status ===
                            "recognizing text"
                        ) {

                            const percent =
                                Math.round(
                                    info.progress * 100
                                );

                            status.innerText =
                                "🔍 Membaca "
                                + percent
                                + "%";

                        }

                    }

                }

            );


        /* =================================================
           OCR RESULT
        ================================================= */

        const text =
            result.data.text.trim();


        ocrResult.innerText =
            text ||
            "Tulisan tidak terbaca.";


        /* =================================================
           FIND MEDICINE
        ================================================= */

        const medicine =
            findMedicine(text);


        if (medicine) {

            detectedDrug =
                medicine;


            /* =================================================
               HASIL OBAT
            ================================================= */

            detectedMedicine.innerHTML = `

                <strong>
                    💊 ${medicine}
                </strong>

                <br><br>

                Nama obat berhasil dikenali.

            `;


            detectedCard
            .classList
            .remove("hidden");


            /* =================================================
               OTOMATIS MASUK PRINT LABEL
            ================================================= */

            labelMedicine.value =
                medicine;


            status.innerText =
                "✅ "
                + medicine
                + " berhasil dikenali";


            /* =================================================
               SCROLL KE PRINT LABEL
            ================================================= */

            setTimeout(function() {

                printCard.scrollIntoView({

                    behavior: "smooth",

                    block: "start"

                });

            }, 300);


        }

        else {

            detectedDrug =
                null;


            detectedCard
            .classList
            .add("hidden");


            status.innerText =
                "⚠️ Obat belum dikenali";

        }

    }

    catch (error) {

        console.error(
            "OCR error:",
            error
        );

        status.innerText =
            "❌ OCR gagal";

        ocrResult.innerText =
            error.message;

    }

}


/* =====================================================
   APPROVE
===================================================== */

function approveMedicine() {

    if (!detectedDrug) {
        return;
    }


    if (
        !stock[detectedDrug]
    ) {

        stock[detectedDrug] =
            0;

    }


    stock[detectedDrug]++;


    saveStock();

    renderStock();


    /* =================================================
       KEEP MEDICINE IN PRINT LABEL
    ================================================= */

    labelMedicine.value =
        detectedDrug;


    detectedCard
    .classList
    .add("hidden");


    status.innerText =
        "✅ "
        + detectedDrug
        + " ditambahkan ke stok";


    /* =================================================
       SCROLL PRINT LABEL
    ================================================= */

    setTimeout(function() {

        printCard.scrollIntoView({

            behavior: "smooth",

            block: "start"

        });

    }, 300);


    detectedDrug =
        null;

}


/* =====================================================
   CANCEL
===================================================== */

function cancelMedicine() {

    detectedDrug =
        null;

    detectedCard
    .classList
    .add("hidden");

}


/* =====================================================
   PRINT LABEL
===================================================== */

function printLabel() {

    const patient =
        document
        .getElementById(
            "patientName"
        )
        .value;


    const medicine =
        labelMedicine.value;


    document
    .getElementById(
        "printPatient"
    )
    .innerText =
        patient || "-";


    document
    .getElementById(
        "printMedicine"
    )
    .innerText =
        medicine || "-";


    document
    .getElementById(
        "printTime"
    )
    .innerText =
        new Date()
        .toLocaleString(
            "id-ID"
        );


    window.print();

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

document
.getElementById(
    "openCamera"
)
.addEventListener(
    "click",
    openBackCamera
);


document
.getElementById(
    "stopCamera"
)
.addEventListener(
    "click",
    stopCamera
);


document
.getElementById(
    "scanButton"
)
.addEventListener(
    "click",
    scanMedicine
);


document
.getElementById(
    "approveButton"
)
.addEventListener(
    "click",
    approveMedicine
);


document
.getElementById(
    "cancelButton"
)
.addEventListener(
    "click",
    cancelMedicine
);


document
.getElementById(
    "printButton"
)
.addEventListener(
    "click",
    printLabel
);


/* =====================================================
   INITIALIZE
===================================================== */

renderStock();

</script>

</body>
</html>
