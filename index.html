/* ======================================================
   CAPTURE
====================================================== */

function captureFrame(zoom=2){

const video=
document.getElementById("camera");

if(
!video.videoWidth ||
!video.videoHeight
){
return null;
}

const w=
video.videoWidth;

const h=
video.videoHeight;


/*
   Crop lebih fokus ke area
   tempat nama obat biasanya berada.
*/

const cropW=
w*0.82;

const cropH=
h*0.48;

const sx=
(w-cropW)/2;

const sy=
(h-cropH)/2;


const canvas=
document.createElement("canvas");

canvas.width=
Math.round(cropW*zoom);

canvas.height=
Math.round(cropH*zoom);


const ctx=
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);

ctx.imageSmoothingEnabled=true;

ctx.imageSmoothingQuality="high";

ctx.drawImage(
video,
sx,
sy,
cropW,
cropH,
0,
0,
canvas.width,
canvas.height
);

return canvas;

}


/* ======================================================
   ENHANCE
====================================================== */

function enhanceCanvas(
source,
mode
){

const canvas=
document.createElement("canvas");

canvas.width=
source.width;

canvas.height=
source.height;

const ctx=
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);

ctx.drawImage(
source,
0,
0
);

const image=
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const d=image.data;


for(
let i=0;
i<d.length;
i+=4
){

let r=d[i];

let g=d[i+1];

let b=d[i+2];

let gray=
0.299*r+
0.587*g+
0.114*b;


if(mode==="contrast"){

gray=
(gray-128)*1.8+128;

gray=
Math.max(
0,
Math.min(255,gray)
);

d[i]=gray;
d[i+1]=gray;
d[i+2]=gray;

}


if(mode==="threshold"){

const value=
gray>150?255:0;

d[i]=value;
d[i+1]=value;
d[i+2]=value;

}

}


ctx.putImageData(
image,
0,
0
);

return canvas;

}


/* ======================================================
   ROTATE
====================================================== */

function rotateCanvas(
source,
degrees
){

const rad=
degrees*Math.PI/180;

const sin=
Math.abs(Math.sin(rad));

const cos=
Math.abs(Math.cos(rad));

const canvas=
document.createElement("canvas");

canvas.width=
Math.round(
source.width*cos+
source.height*sin
);

canvas.height=
Math.round(
source.width*sin+
source.height*cos
);

const ctx=
canvas.getContext("2d");

ctx.translate(
canvas.width/2,
canvas.height/2
);

ctx.rotate(rad);

ctx.drawImage(
source,
-source.width/2,
-source.height/2
);

return canvas;

}

/* ======================================================
   NORMALIZE
====================================================== */

function normalize(text){

return text
.toUpperCase()
.replace(/[^A-Z0-9]/g,"");

}


/* ======================================================
   CHARACTER CORRECTION
====================================================== */

function correctOCR(text){

let t=
normalize(text);


/*
   Kesalahan OCR yang umum.
*/

t=t
.replace(/0/g,"O")
.replace(/1/g,"I")
.replace(/5/g,"S")
.replace(/8/g,"B");


/*
   Beberapa pola spesifik.
*/

t=t
.replace(/NOREPINEPHRIN[E3]/g,"NOREPINEPHRINE")
.replace(/AMIODARON[E3]/g,"AMIODARONE")
.replace(/DEXAMETHAS0N[E3]/g,"DEXAMETHASONE")
.replace(/MIDAZ0LAM/g,"MIDAZOLAM")
.replace(/DOPAM1NE/g,"DOPAMINE")
.replace(/FENTAN1L/g,"FENTANYL")
.replace(/ATROP1NE/g,"ATROPINE")
.replace(/MEYL0N/g,"MEYLON");

return t;

}


/* ======================================================
   LEVENSHTEIN
====================================================== */

function levenshtein(a,b){

const matrix=[];

for(
let i=0;
i<=b.length;
i++
){
matrix[i]=[i];
}

for(
let j=0;
j<=a.length;
j++
){
matrix[0][j]=j;
}

for(
let i=1;
i<=b.length;
i++
){

for(
let j=1;
j<=a.length;
j++
){

if(
b[i-1]===a[j-1]
){

matrix[i][j]=
matrix[i-1][j-1];

}else{

matrix[i][j]=
Math.min(

matrix[i-1][j-1]+1,

matrix[i][j-1]+1,

matrix[i-1][j]+1

);

}

}

}

return matrix[b.length][a.length];

}


/* ======================================================
   MATCH SCORE
====================================================== */

function scoreText(
text,
alias
){

if(
!text ||
!alias
){
return 0;
}

if(
text.includes(alias)
){
return 1;
}

if(
alias.includes(text) &&
text.length>=4
){
return text.length/alias.length;
}


/*
   Prefix.
*/

let prefix=0;

for(
let i=0;
i<Math.min(
text.length,
alias.length
);
i++
){

if(
text[i]===alias[i]
){
prefix++;
}else{
break;
}

}

const prefixScore=
prefix/alias.length;


/*
   Character overlap.
*/

const set=
new Set(alias.split(""));

let overlap=0;

for(
const char of text
){

if(set.has(char)){
overlap++;
}

}

const overlapScore=
overlap/text.length;


/*
   Edit similarity.
*/

const edit=
1-
(
levenshtein(
text,
alias
)/
Math.max(
text.length,
alias.length
)
);


return Math.max(
prefixScore,
overlapScore*0.78,
edit
);

}


/* ======================================================
   FIND DRUG
====================================================== */

function findDrug(
rawText
){

const text=
correctOCR(rawText);

if(!text){
return null;
}


let best=null;

let bestScore=0;


for(
const drug of formulary
){

for(
const aliasRaw of drug.aliases
){

const alias=
normalize(aliasRaw);


/*
   Full result.
*/

let s=
scoreText(
text,
alias
);

if(s>bestScore){

bestScore=s;

best=drug;

}


/*
   Test fragment dari hasil OCR.
   Ini penting untuk tulisan yang
   hanya terbaca sebagian.
*/

for(
let len=4;
len<=Math.min(
12,
text.length
);
len++
){

const fragment=
text.substring(0,len);

const fs=
scoreText(
fragment,
alias
);

if(fs>bestScore){

bestScore=fs;

best=drug;

}

}

}

}


/*
   Threshold.
*/

if(
best &&
bestScore>=0.60
){

return{
drug:best,
score:bestScore
};

}

return null;

}

/* ======================================================
   SCAN
====================================================== */

async function scanMedicine(){

if(isScanning){
return;
}

if(!cameraStream){

alert(
"Buka kamera terlebih dahulu."
);

return;

}

if(!ocrReady){

alert(
"OCR belum siap."
);

return;

}


isScanning=true;

detectedDrug=null;


const btn=
document.getElementById(
"scanBtn"
);

btn.disabled=true;

btn.innerText=
"⏳ SCANNING...";


const status=
document.getElementById(
"scanStatus"
);

status.innerText=
"🔍 Membaca nama obat...";


try{


/*
========================================================
PASS 1
2× normal
========================================================
*/

let image=
captureFrame(2);

let text=
await readOCR(
image,
7
);

let found=
targetedMatch(text) ||
findDrug(text);

if(found){

finishScan(found);

return;

}


/*
========================================================
PASS 2
2.5× contrast
========================================================
*/

image=
captureFrame(2.5);

let contrast=
enhanceCanvas(
image,
"contrast"
);

text=
await readOCR(
contrast,
7
);

found=
targetedMatch(text) ||
findDrug(text);

if(found){

finishScan(found);

return;

}


/*
========================================================
PASS 3
SINGLE WORD
========================================================
*/

text=
await readOCR(
contrast,
8
);

found=
targetedMatch(text) ||
findDrug(text);

if(found){

finishScan(found);

return;

}


/*
========================================================
PASS 4
THRESHOLD
========================================================
*/

let threshold=
enhanceCanvas(
image,
"threshold"
);

text=
await readOCR(
threshold,
7
);

found=
targetedMatch(text) ||
findDrug(text);

if(found){

finishScan(found);

return;

}


/*
========================================================
PASS 5
ROTASI -10
========================================================
*/

let rotated=
rotateCanvas(
contrast,
-10
);

text=
await readOCR(
rotated,
7
);

found=
targetedMatch(text) ||
findDrug(text);

if(found){

finishScan(found);

return;

}


/*
========================================================
PASS 6
ROTASI +10
========================================================
*/

rotated=
rotateCanvas(
contrast,
10
);

text=
await readOCR(
rotated,
7
);

found=
targetedMatch(text) ||
findDrug(text);

if(found){

finishScan(found);

return;

}


status.innerText=
"❌ Obat belum dikenali. Coba dekatkan tulisan nama obat ke tengah kamera.";


document.getElementById(
"scanResult"
).innerHTML=`

<div class="empty">

❌ Obat belum dikenali.

<br><br>

Pastikan nama obat terlihat jelas,
cukup terang, dan berada di tengah kamera.

</div>

`;

}

catch(error){

console.error(error);

status.innerText=
"❌ Terjadi kesalahan saat scanning.";

}

finally{

isScanning=false;

btn.disabled=false;

btn.innerText=
"🔍 SCAN OBAT";

}

}


/* ======================================================
   SCAN RESULT
====================================================== */

function finishScan(
found
){

detectedDrug=
found.drug;


document.getElementById(
"scanStatus"
).innerText=
"✅ Obat dikenali: "+
found.drug.name;


document.getElementById(
"scanResult"
).innerHTML=`

<div class="result">

<div
class="result-name"
>
💊 ${found.drug.name}
</div>

<p>
Kecocokan OCR:
<strong>
${Math.round(found.score*100)}%
</strong>
</p>

<button
class="success"
onclick="approveScan()"
>
✅ APPROVE — Tambah Stok +1
</button>

<button
class="secondary"
onclick="rejectScan()"
>
❌ Batal
</button>

</div>

`;

isScanning=false;

const btn=
document.getElementById(
"scanBtn"
);

btn.disabled=false;

btn.innerText=
"🔍 SCAN OBAT";

}


/* ======================================================
   APPROVE
====================================================== */

function approveScan(){

if(!detectedDrug){

return;

}


stock[detectedDrug.id]=
(stock[detectedDrug.id]||0)+1;

saveStock();

renderStock();


document.getElementById(
"scanResult"
).innerHTML=`

<div
class="result"
style="border-color:#2e7d32"
>

<div class="result-name">
✅ ${detectedDrug.name}
</div>

<p>
Stok berhasil ditambah <strong>+1</strong>.
</p>

<p>
Stok sekarang:
<strong>
${stock[detectedDrug.id]}
</strong>
</p>

</div>

`;

detectedDrug=null;

}


/* ======================================================
   REJECT
====================================================== */

function rejectScan(){

detectedDrug=null;

document.getElementById(
"scanResult"
).innerHTML=`

<div class="empty">
Scan dibatalkan.
</div>

`;

}


/* ======================================================
   STOCK
====================================================== */

function renderStock(){

const container=
document.getElementById(
"stockList"
);

container.innerHTML="";


formulary.forEach(
drug=>{

const div=
document.createElement(
"div"
);

div.className=
"drug-card";

div.innerHTML=`

${drug.name}
</div>

${stock[drug.id]||0}
</div>

class="success"
onclick="changeStock('${drug.id}',1)"

>

</button>

`;

}

);

}


/* ======================================================
   CHANGE STOCK
====================================================== */

function changeStock(
id,
amount
){

stock[id]=stock[id]||0;

if(
stock[id]+amount<0
){

alert(
"Stok tidak boleh kurang dari 0."
);

return;

}

stock[id]+=amount;

saveStock();

renderStock();

}

/* ======================================================
   SAVE USAGE
====================================================== */

function saveUsage(){

const drugId=
document.getElementById(
"usageDrug"
).value;

const qty=
parseInt(
document.getElementById(
"usageQty"
).value
);

const date=
document.getElementById(
"usageDate"
).value;

const time=
document.getElementById(
"usageTime"
).value;

const patientName=
document.getElementById(
"patientName"
).value.trim();

const patientId=
document.getElementById(
"patientId"
).value.trim();

const room=
document.getElementById(
"patientRoom"
).value.trim();

const note=
document.getElementById(
"usageNote"
).value.trim();


const drug=
formulary.find(
d=>d.id===drugId
);


if(!drug){

alert("Pilih obat.");

return;

}


if(
!qty ||
qty<1
){

alert(
"Jumlah tidak valid."
);

return;

}


if(
(stock[drugId]||0)<qty
){

alert(
"Stok tidak mencukupi."
);

return;

}


if(
!date ||
!time
){

alert(
"Tanggal dan waktu harus diisi."
);

return;

}


stock[drugId]-=qty;

saveStock();


usageHistory.unshift({

id:Date.now(),

drugId:drug.id,

drugName:drug.name,

quantity:qty,

date:date,

time:time,

patientName:patientName,

patientId:patientId,

room:room,

note:note

});


saveHistory();

renderStock();

renderHistory();


alert(
`Pemakaian ${drug.name} berhasil disimpan.`
);


/*
   Isi nama pasien, tanggal,
   waktu dikosongkan kembali.
*/

document.getElementById(
"patientName"
).value="";

document.getElementById(
"patientId"
).value="";

document.getElementById(
"patientRoom"
).value="";

document.getElementById(
"usageNote"
).value="";

}

   HISTORY
====================================================== */

function renderHistory(){

document.getElementById(
"historyList"
);

container.innerHTML="";

usageHistory.length===0
){

container.innerHTML=`

<div class="empty">

</div>

}

record=>{

);

${record.drugName}

Dipakai:
<strong>
${record.quantity}
</strong>

<br>

📅 ${record.date}

<br>

🕐 ${record.time}

<br>

👤 ${
record.patientName||"-"
}

<br>

}

}

${

<button

);

}


/* ======================================================
   DELETE HISTORY
====================================================== */

function deleteHistory(id){

if(
!confirm(
"Hapus riwayat ini?"
)
){

return;

}


/*
   Hapus riwayat TIDAK
   mengembalikan stok.
*/

usageHistory=
usageHistory.filter(
r=>r.id!==id
);

saveHistory();

renderHistory();

}


/* ======================================================
   DELETE ALL
====================================================== */

function deleteAllHistory(){

if(
usageHistory.length===0
){

alert(
"Belum ada riwayat."
);

return;

}


if(
!confirm(
"Hapus semua riwayat?\n\nStok tidak dikembalikan."
)
){

return;

}


usageHistory=[];

saveHistory();

renderHistory();

}
