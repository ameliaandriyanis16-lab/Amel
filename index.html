<style>

/* =====================================================
   DASAR
===================================================== */

* {
    box-sizing: border-box;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    margin: 0;

    background: #f4f6f8;

    color: #222;

}


/* =====================================================
   HEADER
===================================================== */

header {

    background: #263238;

    color: white;

    padding: 18px;

    text-align: center;

}

header h1 {

    margin: 0;

    font-size: 22px;

}

header p {

    margin: 6px 0 0;

    font-size: 13px;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 100%;

    max-width: 700px;

    margin: auto;

    padding: 15px;

}


/* =====================================================
   CARD
===================================================== */

.card {

    background: white;

    border-radius: 12px;

    padding: 15px;

    margin-bottom: 15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

}

.card h2 {

    margin-top: 0;

    font-size: 18px;

}


/* =====================================================
   CAMERA
===================================================== */

.camera-wrapper {

    position: relative;

    width: 100%;

    background: black;

    border-radius: 10px;

    overflow: hidden;

}

video {

    width: 100%;

    height: 280px;

    display: block;

    object-fit: cover;

    background: black;

}

.camera-guide {

    position: absolute;

    left: 10%;

    right: 10%;

    top: 25%;

    bottom: 25%;

    border:
        2px solid rgba(255,255,255,0.8);

    border-radius: 10px;

    pointer-events: none;

}

.camera-guide-text {

    position: absolute;

    bottom: 10px;

    left: 0;

    right: 0;

    text-align: center;

    color: white;

    font-size: 12px;

    background:
        rgba(0,0,0,0.45);

    padding: 5px;

}


/* =====================================================
   BUTTON
===================================================== */

button {

    border: none;

    border-radius: 8px;

    padding: 11px 14px;

    font-size: 15px;

    cursor: pointer;

    margin: 4px;

}

button:active {

    transform: scale(0.97);

}

.btn-camera {

    background: #37474f;

    color: white;

}

.btn-stop {

    background: #455a64;

    color: white;

}

.btn-scan {

    background: #1565c0;

    color: white;

}

.btn-approve {

    background: #2e7d32;

    color: white;

}

.btn-cancel {

    background: #757575;

    color: white;

}

.btn-print {

    background: #6a1b9a;

    color: white;

}

.btn-plus {

    background: #2e7d32;

    color: white;

    min-width: 42px;

}

.btn-minus {

    background: #c62828;

    color: white;

    min-width: 42px;

}

.btn-close {

    background: #757575;

    color: white;

}


/* =====================================================
   STATUS
===================================================== */

.status {

    margin-top: 10px;

    padding: 10px;

    background: #eceff1;

    border-radius: 8px;

    font-size: 14px;

    line-height: 1.4;

}


/* =====================================================
   OCR RAW RESULT
===================================================== */

.ocr-box {

    margin-top: 10px;

    padding: 10px;

    background: #fafafa;

    border: 1px solid #ddd;

    border-radius: 8px;

    font-size: 12px;

    display: none;

    word-break: break-word;

}


/* =====================================================
   SCAN RESULT
===================================================== */

.scan-result {

    display: none;

    margin-top: 15px;

    padding: 15px;

    border:
        2px solid #2e7d32;

    border-radius: 10px;

    background: #e8f5e9;

}

.scan-result h3 {

    margin-top: 0;

    color: #1b5e20;

}

.medicine-name {

    font-size: 22px;

    font-weight: bold;

    margin: 10px 0;

}


/* =====================================================
   STOCK
===================================================== */

.stock-item {

    border:
        1px solid #ddd;

    border-radius: 10px;

    padding: 13px;

    margin-bottom: 10px;

    background: white;

}

.stock-name {

    font-size: 18px;

    font-weight: bold;

}

.stock-number {

    font-size: 25px;

    font-weight: bold;

    margin: 8px 0;

}

.low-stock {

    color: #c62828;

    font-weight: bold;

}

.normal-stock {

    color: #2e7d32;

    font-weight: bold;

}

.empty {

    text-align: center;

    color: #777;

    padding: 20px;

}


/* =====================================================
   PRINT FORM
===================================================== */

.print-form {

    display: none;

    margin-top: 15px;

    padding: 15px;

    border:
        2px solid #6a1b9a;

    border-radius: 10px;

    background: #f3e5f5;

}

.print-form h3 {

    margin-top: 0;

    color: #4a148c;

}

.form-group {

    margin-bottom: 12px;

}

.form-group label {

    display: block;

    font-weight: bold;

    margin-bottom: 5px;

}

.form-group input {

    width: 100%;

    padding: 11px;

    border:
        1px solid #bbb;

    border-radius: 8px;

    font-size: 15px;

}

.auto-medicine {

    background: #eeeeee;

    padding: 11px;

    border-radius: 8px;

    font-weight: bold;

}


/* =====================================================
   PRINT AREA
===================================================== */

#printArea {

    display: none;

}


/* =====================================================
   PRINT 58 MM
===================================================== */

@media print {

    @page {

        size: 58mm auto;

        margin: 0;

    }

    html,
    body {

        width: 58mm;

        margin: 0;

        padding: 0;

        background: white;

    }

    body * {

        visibility: hidden;

    }

    #printArea,
    #printArea * {

        visibility: visible;

    }

    #printArea {

        display: block;

        position: absolute;

        left: 0;

        top: 0;

        width: 58mm;

        margin: 0;

        padding: 0;

    }

    .label {

        width: 58mm;

        min-height: 38mm;

        padding:
            4mm 3mm;

        border:
            1px solid black;

        text-align: center;

        font-family:
            Arial,
            sans-serif;

        page-break-after: always;

    }

    .label-title {

        font-size: 13px;

        font-weight: bold;

        margin-bottom: 4px;

    }

    .label-line {

        border-top:
            1px solid black;

        margin: 3px 0;

    }

    .label-patient {

        font-size: 12px;

        font-weight: bold;

        margin: 4px 0;

    }

    .label-medicine {

        font-size: 15px;

        font-weight: bold;

        margin: 5px 0;

    }

    .label-dose {

        font-size: 13px;

        font-weight: bold;

        margin: 4px 0;

    }

    .label-date {

        font-size: 9px;

        margin-top: 5px;

    }

}

</style>

</head>
