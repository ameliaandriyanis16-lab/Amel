<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Nursing Trolley V4</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

header{
    background:#1769aa;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:6px 0 0;
    font-size:14px;
}

.container{
    max-width:800px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    color:#1769aa;
    font-size:19px;
}

video{
    width:100%;
    border-radius:12px;
    background:#111;
    max-height:450px;
    object-fit:cover;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 14px;
    margin:4px;
    font-size:14px;
    cursor:pointer;
}

.primary{background:#1769aa;color:white}
.success{background:#2e9d57;color:white}
.danger{background:#d9534f;color:white}
.warning{background:#f0ad4e;color:white}
.secondary{background:#e8edf2;color:#222}

button:disabled{
    opacity:.5;
}

.scan-result{
    background:#f1f7ff;
    border:1px solid #cfe3f7;
    border-radius:10px;
    padding:15px;
}

.detected{
    font-size:23px;
    font-weight:bold;
    color:#1769aa;
    margin-top:5px;
}

.ocr-text{
    white-space:pre-wrap;
    background:#f7f7f7;
    padding:10px;
    border-radius:8px;
    font-size:12px;
    margin-top:10px;
    max-height:180px;
    overflow:auto;
}

.progress{
    margin-top:10px;
    background:#eee;
    border-radius:8px;
    overflow:hidden;
    display:none;
}

.progress-bar{
    height:8px;
    width:0%;
    background:#1769aa;
    transition:.2s;
}

.stock-item,
.formulary-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:1px solid #eee;
    gap:8px;
}

.stock-item:last-child,
.formulary-item:last-child{
    border-bottom:0;
}

.stock-name,
.formulary-name{
    flex:1;
    font-weight:bold;
}

.stock-number{
    min-width:42px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.small-btn{
    padding:7px 11px;
}

.formulary-stock{
    font-size:12px;
    color:#666;
    margin-top:3px;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-weight:bold;
    font-size:14px;
}

input,select,textarea{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

textarea{
    resize:vertical;
    min-height:70px;
}

.selected-drug{
    background:#eaf5ff;
    padding:12px;
    border-radius:8px;
    color:#1769aa;
    font-weight:bold;
}

.history-item{
    border:1px solid #ddd;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
}

.history-item strong{
    color:#1769aa;
}

.empty{
    color:#777;
    text-align:center;
    padding:15px;
}

.print-area{
    border:1px dashed #aaa;
    padding:12px;
    border-radius:8px;
}
</style>
</head>

<body>

<header>
    <h1>💊 Smart Nursing Trolley</h1>
    <p>Emergency Drug Inventory System — V4 OCR</p>
</header>

<div class="container">

<!-- CAMERA -->
<div class="card">

<h2>📷 Kamera & Scan Obat</h2>

<video id="camera" autoplay playsinline></video>

<div style="margin-top:10px">

<button class="primary" onclick="openBackCamera()">
📷 Buka Kamera
</button>

<button class="danger" onclick="stopCamera()">
⛔ Tutup
</button>

<button class="success" onclick="scanMedicine()">
🔎 Scan Obat
</button>

</div>

<p id="cameraStatus"></p>

<div id="progress" class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

</div>


<!-- HASIL SCAN -->
<div class="card">

<h2>🔎 Hasil Scan</h2>

<div id="scanResult" class="scan-result">
Belum ada hasil scan.
</div>

<div id="ocrText"
class="ocr-text"
style="display:none"></div>

<div id="scanButtons"
style="display:none;margin-top:10px">

<button class="success" onclick="approveMedicine()">
✅ APPROVE +1 STOK
</button>

<button class="danger" onclick="cancelScan()">
❌ BATAL
</button>

</div>

</div>


<!-- STOK -->
<div class="card">

<h2>💊 Stok Obat</h2>

<div id="stockList"></div>

</div>


<!-- FORMULARIUM -->
<div class="card">

<h2>📋 Formularium</h2>

<p style="font-size:13px;color:#666">
Pilih obat secara manual untuk mencatat pemakaian.
</p>

<div id="formularyList"></div>

</div>


<!-- PEMAKAIAN -->
<div class="card">

<h2>📝 Pemakaian Obat Manual</h2>

<div id="selectedDrug" class="selected-drug">
Belum memilih obat
</div>

<label>Jumlah yang digunakan</label>
<input type="number" id="usageQuantity" min="1" value="1">

<label>Tanggal</label>
<input type="date" id="usageDate">

<label>Jam</label>
<input type="time" id="usageTime">

<label>Nama Pasien</label>
<input type="text" id="patientName">

<label>No. RM / ID Pasien</label>
<input type="text" id="patientId">

<label>Ruangan / Bed</label>
<input type="text" id="patientRoom">

<label>Keterangan</label>
<textarea id="usageNote"></textarea>

<div style="margin-top:10px">

<button class="success" onclick="saveUsage()">
💾 Simpan Pemakaian
</button>

<button class="secondary" onclick="cancelUsage()">
Batal
</button>

</div>

</div>


<!-- RIWAYAT -->
<div class="card">

<h2>📜 Riwayat Pemakaian</h2>

<label>Filter tanggal</label>

<input
type="date"
id="historyFilter"
onchange="renderHistory()"
>

<div style="margin-top:8px">

<button class="secondary" onclick="clearHistoryFilter()">
Tampilkan Semua
</button>

<button class="danger" onclick="deleteAllHistory()">
🗑️ Hapus Semua
</button>

</div>

<div id="historyList" style="margin-top:12px"></div>

</div>


<!-- PRINT -->
<div class="card">

<h2>🖨️ Print Label</h2>

<div class="print-area">

<label>Nama Obat</label>
<input id="labelMedicine">

<label>Jumlah</label>
<input id="labelQuantity">

<label>Tanggal</label>
<input type="date" id="labelDate">

<button class="primary" onclick="printLabel()">
🖨️ Print Label
</button>

</div>

</div>

</div>


<script>

/* ==========================================
FORMULARIUM
========================================== */

const formulary = {

"Epinephrine":[
"EPINEPHRINE",
"EPINEPHRIN",
"ADRENALINE",
"ADRENALIN"
],

"Norepinephrine":[
"NOREPINEPHRINE",
"NOREPINEPHRIN",
"NORADRENALINE",
"NORADRENALIN"
],

"Dopamine":[
"DOPAMINE",
"DOPAMIN",
"DOPAMINE HCL",
"DOPAMINE HCI",
"DOPAMINEHCL",
"DOPAMINEHCI",
"DOPAMINE HYDROCHLORIDE",
"DOPAMINEHYDROCHLORIDE",
"DOPAMINEHYDROCHLORID",
"DOPAMINHCL"
],

"Dobutamine":[
"DOBUTAMINE",
"DOBUTAMIN"
],

"Midazolam":[
"MIDAZOLAM",
"MIDAZOLAN",
"MIDAZOLAM HCL",
"MIDAZOLAM HCI",
"MIDAZOLAMHCL",
"MIDAZOLAMHCI",
"MIDAZOLAM HYDROCHLORIDE",
"MIDAZOLAMHYDROCHLORIDE"
],

"Fentanyl":[
"FENTANYL",
"FENTANIL",
"FENTANYL CITRATE",
"FENTANYL CITRAT",
"FENTANYLUM",
"FENTANYLCITRATE"
],

"Ketamine":[
"KETAMINE",
"KETAMIN",
"KETAMINE HCL",
"KETAMINE HCI",
"KETAMINEHCL",
"KETAMINEHCI",
"KETAMINE HYDROCHLORIDE",
"KETAMINEHYDROCHLORIDE"
],

"Lidocaine":[
"LIDOCAINE",
"LIDOCAIN",
"LIGNOCAINE",
"LIGNOCAIN",
"LIDOKAIN"
],

"D40":[
"D40",
"D 40",
"DEXTROSE 40",
"DEXTROSE40"
],

"Meylon":[
"MEYLON",
"MEYL0N",
"MEYLN",
"MEYL0",
"SODIUM BICARBONATE",
"SODIUMBICARBONATE",
"BICARBONATE"
],

"Atropine sulfate":[
"ATROPINE",
"ATROPIN",
"ATROPINE SULFATE",
"ATROPINESULFATE",
"ATROPINESULPHATE",
"ATROPINESULFAT"
],

"Amiodarone":[
"AMIODARONE",
"AMIODARON",
"AMIDARONE",
"AMIDARON",
"AMIODARONE HCL",
"AMIODARONEHCL",
"AMIDARONE HCL",
"AMIDARONEHCL"
],

"Dexamethasone":[
"DEXAMETHASONE",
"DEXAMETASON",
"DEXAMETHASON",
"DEXAMETHAS0NE",
"DEXAMETHAS0N"
],

"Calcium gluconate":[
"CALCIUM GLUCONATE",
"CALCIUMGLUCONATE",
"CALCIUM GLUCONAT",
"CALCIUMGLUCONAT",
"CALCIUMGLUC0NATE",
"CALCIUM GLUKONAT",
"CALCIUMGLUKONAT",
"CALCIUM GLUKONATE",
"CALCIUMGLUKONATE"
]

};


/* ==========================================
DATA
========================================== */

let stock =
JSON.parse(
localStorage.getItem("smartTrolleyStock") || "{}"
);

let usageHistory =
JSON.parse(
localStorage.getItem("smartTrolleyUsageHistory") || "[]"
);

let cameraStream=null;
let detectedDrug=null;
let selectedUsageDrug=null;

let ocrWorker=null;
let ocrReady=false;

let isScanning=false;


/* ==========================================
INITIAL
========================================== */

Object.keys(formulary).forEach(drug=>{

if(typeof stock[drug] !== "number"){
stock[drug]=0;
}

});

delete stock["Alkohol 70%"];

saveStock();

renderStock();
renderFormulary();
renderHistory();
setCurrentDateTime();


/* ==========================================
STOCK
========================================== */

function saveStock(){

localStorage.setItem(
"smartTrolleyStock",
JSON.stringify(stock)
);

}


function renderStock(){

const box=document.getElementById("stockList");

box.innerHTML="";

Object.keys(formulary).forEach(drug=>{

const row=document.createElement("div");

row.className="stock-item";

row.innerHTML=`

<div class="stock-name">
${drug}
</div>

<button class="danger small-btn"
onclick="changeStock('${drug}',-1)">
−
</button>

<div class="stock-number">
${stock[drug] || 0}
</div>

<button class="success small-btn"
onclick="changeStock('${drug}',1)">
+
</button>

`;

box.appendChild(row);

});

}


function changeStock(drug,amount){

stock[drug]=Math.max(
0,
(stock[drug]||0)+amount
);

saveStock();

renderStock();
renderFormulary();

}


/* ==========================================
FORMULARIUM
========================================== */

function renderFormulary(){

const box=document.getElementById(
"formularyList"
);

box.innerHTML="";

Object.keys(formulary).forEach(drug=>{

const row=document.createElement("div");

row.className="formulary-item";

row.innerHTML=`

<div class="formulary-name">

${drug}

<div class="formulary-stock">
Stok: ${stock[drug] || 0}
</div>

</div>

<button class="primary"
onclick="selectMedicineForUsage('${drug}')">

Pakai

</button>

`;

box.appendChild(row);

});

}


function selectMedicineForUsage(drug){

selectedUsageDrug=drug;

document.getElementById(
"selectedDrug"
).innerHTML=
"💊 Obat dipilih: "+drug;

}


/* ==========================================
DATE
========================================== */

function setCurrentDateTime(){

const now=new Date();

document.getElementById(
"usageDate"
).value=
now.toISOString().split("T")[0];

document.getElementById(
"usageTime"
).value=
now.toTimeString().slice(0,5);

document.getElementById(
"labelDate"
).value=
now.toISOString().split("T")[0];

}


/* ==========================================
USAGE
========================================== */

function saveUsage(){

if(!selectedUsageDrug){

alert(
"Pilih obat terlebih dahulu dari Formularium."
);

return;
}

const quantity=parseInt(
document.getElementById(
"usageQuantity"
).value
);

const date=document.getElementById(
"usageDate"
).value;

const time=document.getElementById(
"usageTime"
).value;

const patient=document.getElementById(
"patientName"
).value.trim();

const patientId=document.getElementById(
"patientId"
).value.trim();

const room=document.getElementById(
"patientRoom"
).value.trim();

const note=document.getElementById(
"usageNote"
).value.trim();


if(!quantity || quantity<1){

alert("Jumlah tidak valid.");
return;

}

if(!date || !time){

alert("Tanggal dan jam harus diisi.");
return;

}

if(!patient){

alert("Nama pasien harus diisi.");
return;

}

if(quantity > (stock[selectedUsageDrug]||0)){

alert(
"Stok "+selectedUsageDrug+
" tidak mencukupi."
);

return;

}

stock[selectedUsageDrug]-=quantity;

usageHistory.unshift({

id:Date.now(),

date,

time,

medicine:selectedUsageDrug,

quantity,

patient,

patientId,

room,

note

});

saveStock();

localStorage.setItem(
"smartTrolleyUsageHistory",
JSON.stringify(usageHistory)
);

renderStock();
renderFormulary();
renderHistory();

alert("Pemakaian berhasil disimpan.");

cancelUsage();

}


function cancelUsage(){

selectedUsageDrug=null;

document.getElementById(
"selectedDrug"
).innerHTML=
"Belum memilih obat";

document.getElementById(
"usageQuantity"
).value=1;

document.getElementById(
"patientName"
).value="";

document.getElementById(
"patientId"
).value="";

document.getElementById(
"patientRoom"
).value="";

document.getElementById(
"usageNote"
).value="";

setCurrentDateTime();

}


/* ==========================================
HISTORY
========================================== */

function renderHistory(){

const box=document.getElementById(
"historyList"
);

const filter=document.getElementById(
"historyFilter"
).value;

box.innerHTML="";

let data=[...usageHistory];

if(filter){

data=data.filter(
item=>item.date===filter
);

}

if(!data.length){

box.innerHTML=
`<div class="empty">
Belum ada riwayat pemakaian.
</div>`;

return;

}

data.forEach(item=>{

const div=document.createElement("div");

div.className="history-item";

div.innerHTML=`

<strong>
${escapeHTML(item.medicine)}
</strong>

<br>

Jumlah: ${item.quantity}

<br>

Tanggal:
${formatDate(item.date)}
${item.time}

<br>

Pasien:
${escapeHTML(item.patient)}

${item.patientId
? `<br>No. RM/ID:
${escapeHTML(item.patientId)}`
:""}

${item.room
? `<br>Ruangan/Bed:
${escapeHTML(item.room)}`
:""}

${item.note
? `<br>Keterangan:
${escapeHTML(item.note)}`
:""}

<br>

<button class="danger small-btn"
onclick="deleteHistory(${item.id})">

🗑️ Hapus

</button>

`;

box.appendChild(div);

});

}


function deleteHistory(id){

if(!confirm(
"Hapus riwayat ini?\nStok tidak dikembalikan."
)) return;

usageHistory=
usageHistory.filter(
item=>item.id!==id
);

localStorage.setItem(
"smartTrolleyUsageHistory",
JSON.stringify(usageHistory)
);

renderHistory();

}


function deleteAllHistory(){

if(!usageHistory.length){

alert("Belum ada riwayat.");

return;

}

if(!confirm(
"Hapus semua riwayat?\nStok tidak dikembalikan."
)) return;

usageHistory=[];

localStorage.setItem(
"smartTrolleyUsageHistory",
JSON.stringify(usageHistory)
);

renderHistory();

}


function clearHistoryFilter(){

document.getElementById(
"historyFilter"
).value="";

renderHistory();

}


function formatDate(date){

if(!date) return "";

const p=date.split("-");

return p[2]+"-"+p[1]+"-"+p[0];

}


function escapeHTML(text){

if(!text)return "";

return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ==========================================
CAMERA
========================================== */

async function openBackCamera(){

try{

stopCamera();

cameraStream=
await navigator.mediaDevices.getUserMedia({

video:{

facingMode:{
ideal:"environment"
},

width:{
ideal:1920
},

height:{
ideal:1080
},

frameRate:{
ideal:30
}

},

audio:false

});

const video=
document.getElementById("camera");

video.srcObject=cameraStream;

document.getElementById(
"cameraStatus"
).innerText=
"✅ Kamera belakang aktif.";

}

catch(error){

console.error(error);

document.getElementById(
"cameraStatus"
).innerText=
"❌ Kamera gagal dibuka. Izinkan akses kamera.";

}

}


function stopCamera(){

if(cameraStream){

cameraStream
.getTracks()
.forEach(track=>track.stop());

cameraStream=null;

}

document.getElementById(
"camera"
).srcObject=null;

}


/* ==========================================
OCR ENGINE
========================================== */

async function prepareOCR(){

if(ocrReady)return;

ocrWorker=
await Tesseract.createWorker("eng");

await ocrWorker.setParameters({

preserve_interword_spaces:"1",

user_defined_dpi:"300"

});

ocrReady=true;

}


/* ==========================================
IMAGE PROCESSING
========================================== */

function captureCamera(){

const video=
document.getElementById("camera");

const canvas=
document.createElement("canvas");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext("2d");

ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);

return canvas;

}


/* AUTO CROP BAGIAN TENGAH */

function centerCrop(canvas){

const cropWidth=
Math.floor(canvas.width*.82);

const cropHeight=
Math.floor(canvas.height*.60);

const x=
Math.floor(
(canvas.width-cropWidth)/2
);

const y=
Math.floor(
(canvas.height-cropHeight)/2
);

const output=
document.createElement("canvas");

output.width=cropWidth;
output.height=cropHeight;

const ctx=output.getContext("2d");

ctx.drawImage(
canvas,
x,
y,
cropWidth,
cropHeight,
0,
0,
cropWidth,
cropHeight
);

return output;

}


/* ZOOM */

function zoomCanvas(canvas,scale){

const output=
document.createElement("canvas");

output.width=
canvas.width*scale;

output.height=
canvas.height*scale;

const ctx=
output.getContext("2d");

ctx.imageSmoothingEnabled=true;

ctx.imageSmoothingQuality="high";

ctx.drawImage(
canvas,
0,
0,
output.width,
output.height
);

return output;

}


/* ROTASI */

function rotateCanvas(canvas,angle){

const rad=
angle*Math.PI/180;

const sin=Math.abs(Math.sin(rad));
const cos=Math.abs(Math.cos(rad));

const w=canvas.width;
const h=canvas.height;

const output=
document.createElement("canvas");

output.width=
Math.ceil(w*cos+h*sin);

output.height=
Math.ceil(w*sin+h*cos);

const ctx=
output.getContext("2d");

ctx.translate(
output.width/2,
output.height/2
);

ctx.rotate(rad);

ctx.drawImage(
canvas,
-w/2,
-h/2
);

return output;

}


/* SHARPEN + CONTRAST */

function enhanceCanvas(canvas){

const ctx=
canvas.getContext("2d");

const image=
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data=image.data;

for(let i=0;i<data.length;i+=4){

let r=data[i];
let g=data[i+1];
let b=data[i+2];

let gray=
0.299*r+
0.587*g+
0.114*b;

/* contrast */

gray=
((gray-128)*1.9)+128;

/* sedikit brightness */

gray+=8;

gray=Math.max(
0,
Math.min(255,gray)
);

data[i]=gray;
data[i+1]=gray;
data[i+2]=gray;

}

ctx.putImageData(
image,
0,
0
);

return canvas;

}


/* THRESHOLD */

function thresholdCanvas(canvas){

const ctx=
canvas.getContext("2d");

const image=
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data=image.data;

for(let i=0;i<data.length;i+=4){

const gray=
0.299*data[i]+
0.587*data[i+1]+
0.114*data[i+2];

const value=
gray>145?255:0;

data[i]=value;
data[i+1]=value;
data[i+2]=value;

}

ctx.putImageData(
image,
0,
0
);

return canvas;

}


/* ==========================================
OCR
========================================== */

async function recognizeCanvas(canvas){

await prepareOCR();

const result=
await ocrWorker.recognize(canvas);

return result.data.text || "";

}


/* ==========================================
NORMALIZATION
========================================== */

function normalizeText(text){

return text
.toUpperCase()
.replace(/[^A-Z0-9\s]/g," ")
.replace(/\s+/g," ")
.trim();

}


function normalizeOCRWord(text){

return normalizeText(text)
.replace(/0/g,"O")
.replace(/1/g,"I");

}


function levenshtein(a,b){

const matrix=[];

for(let i=0;i<=b.length;i++){

matrix[i]=[i];

}

for(let j=0;j<=a.length;j++){

matrix[0][j]=j;

}

for(let i=1;i<=b.length;i++){

for(let j=1;j<=a.length;j++){

if(
b.charAt(i-1)===
a.charAt(j-1)
){

matrix[i][j]=
matrix[i-1][j-1];

}
else{

matrix[i][j]=
Math.min(

matrix[i-1][j-1]+1,

matrix[i][j-1]+1,

matrix[i-1][j-1]+1

);

}

}

}

return matrix[b.length][a.length];

}


/* ==========================================
SMART MATCH
========================================== */

function fuzzyMatch(text,alias){

const a=
normalizeOCRWord(text);

const b=
normalizeOCRWord(alias);

if(!a||!b)return false;

if(
a.includes(b)||
b.includes(a)
){

return true;

}

const distance=
levenshtein(a,b);

const max=
Math.max(a.length,b.length);

return distance<=
Math.max(
2,
Math.floor(max*.28)
);

}


/* ==========================================
MEDICINE DETECTION
========================================== */

function specialMedicineMatch(text){

const t=
normalizeOCRWord(text);

if(
t.includes("MEYLON")||
t.includes("MEYL0N")||
t.includes("BICARBONATE")
){

return "Meylon";

}

if(t.includes("ATROPINE"))
return "Atropine sulfate";

if(
t.includes("AMIODARONE")||
t.includes("AMIDARONE")
)
return "Amiodarone";

if(
t.includes("DEXAMETHASONE")||
t.includes("DEXAMETASON")
)
return "Dexamethasone";

if(
t.includes("KETAMINE")||
t.includes("KETAMIN")
)
return "Ketamine";

if(
t.includes("LIDOCAINE")||
t.includes("LIGNOCAINE")||
t.includes("LIDOKAIN")
)
return "Lidocaine";

if(
t.includes("CALCIUMGLUCONATE")||
t.includes("CALCIUMGLUCONAT")||
t.includes("CALCIUMGLUKONAT")
)
return "Calcium gluconate";

return null;

}


function findMedicine(text){

const normalized=
normalizeText(text);

const special=
specialMedicineMatch(normalized);

if(special)return special;


/* PRIORITAS OBAT YANG SULIT */

const priority=[

"Dopamine",
"Midazolam",
"Fentanyl",
"Ketamine",
"Lidocaine",
"Meylon",
"Atropine sulfate",
"Amiodarone",
"Dexamethasone",
"Calcium gluconate"

];


for(const drug of priority){

for(const alias of formulary[drug]){

if(
fuzzyMatch(
normalized,
alias
)
){

return drug;

}

}

}


/* SEMUA OBAT */

for(const drug of Object.keys(formulary)){

for(const alias of formulary[drug]){

if(
fuzzyMatch(
normalized,
alias
)
){

return drug;

}

}

}

return null;

}

"progress"
).style.display="block";

"progressBar"
).style.width=
percent+"%";

"cameraStatus"

/* ==========================================
SCAN V4
========================================== */

async function scanMedicine(){

if(isScanning)return;

if(!cameraStream){

alert(
"Buka kamera terlebih dahulu."
);

return;

}

const video=
document.getElementById("camera");

if(
!video.videoWidth||
!video.videoHeight
){

alert(
"Kamera belum siap."
);

return;

}

isScanning=true;

detectedDrug=null;

document.getElementById(
"scanButtons"
).style.display="none";

document.getElementById(
"scanResult"
).innerHTML=
"⏳ Mencari tulisan obat...";

document.getElementById(
"ocrText"
).style.display="block";

document.getElementById(
"ocrText"
).innerText=
"Memproses beberapa sudut dan pembesaran...";


try{

updateProgress(
5,
"📸 Mengambil gambar..."
);

const original=
captureCamera();


/*
==============================
AREA TENGAH
==============================
*/

updateProgress(
12,
"🔍 Memotong area label..."
);

const cropped=
centerCrop(original);


/*
==============================
VARIASI GAMBAR
==============================
*/

const variants=[];


/* normal */

variants.push({
name:"Normal",
canvas:enhanceCanvas(
zoomCanvas(cropped,2.5)
)
});


/* sharpen lebih besar */

variants.push({
name:"Zoom 3x",
canvas:enhanceCanvas(
zoomCanvas(cropped,3)
)
});


/* threshold */

variants.push({
name:"Threshold",
canvas:thresholdCanvas(
zoomCanvas(cropped,3)
)
});


/*
==============================
ROTASI
==============================
*/

const angles=[
-45,
-30,
-20,
-10,
10,
20,
30,
45,
90,
-90
];

angles.forEach(angle=>{

const rotated=
rotateCanvas(cropped,angle);

const zoomed=
zoomCanvas(rotated,2.5);

variants.push({

name:"Rotasi "+angle+"°",

canvas:enhanceCanvas(zoomed)

});

});


/*
==============================
OCR SATU PER SATU
==============================
*/

let allText="";

for(
let i=0;
i<variants.length;
i++
){

const variant=
variants[i];

const percent=
15+
Math.floor(
(i/variants.length)*75
);

updateProgress(
percent,
"🔎 Membaca "+variant.name+
" ("+(i+1)+"/"+variants.length+")..."
);

try{

const text=
await recognizeCanvas(
variant.canvas
);

if(text){

allText+=
"\n["+variant.name+"]\n"+
text;

const drug=
findMedicine(text);

if(drug){

updateProgress(
100,
"✅ Obat berhasil dikenali!"
);

document.getElementById(
"ocrText"
).innerText=
"Hasil OCR:\n"+
allText.trim();

detectedDrug=drug;

document.getElementById(
"scanResult"
).innerHTML=`

<div>Obat terdeteksi:</div>

<div class="detected">
${drug}
</div>

<div style="margin-top:6px">
Klik <b>APPROVE +1 STOK</b>
untuk menambahkan stok.
</div>

`;

document.getElementById(
"scanButtons"
).style.display="block";

document.getElementById(
"labelMedicine"
).value=drug;

isScanning=false;

return;

}

}

}
catch(error){

console.log(
"OCR variant error:",
variant.name,
error
);

}

}


/*
==============================
COBA GAMBAR ASLI
==============================
*/

updateProgress(
94,
"🔎 Pemeriksaan terakhir..."
);

try{

const originalZoom=
enhanceCanvas(
zoomCanvas(original,2)
);

const text=
await recognizeCanvas(
originalZoom
);

allText+=
"\n[Original]\n"+
text;

const drug=
findMedicine(allText);

document.getElementById(
"ocrText"
).innerText=
"Hasil OCR:\n"+
allText.trim();

if(drug){

detectedDrug=drug;

document.getElementById(
"scanResult"
).innerHTML=`

<div>Obat terdeteksi:</div>

<div class="detected">
${drug}
</div>

`;

document.getElementById(
"scanButtons"
).style.display="block";

document.getElementById(
"labelMedicine"
).value=drug;

updateProgress(
100,
"✅ Obat berhasil dikenali!"
);

isScanning=false;

return;

}

}
catch(error){

console.log(error);

}


/*
==============================
TIDAK DITEMUKAN
==============================
*/

updateProgress(
100,
"❌ Nama obat belum dikenali."
);

document.getElementById(
"scanResult"
).innerHTML=`

❌ Nama obat belum dikenali.

<br><br>

<strong>Coba:</strong>

<br>
• Dekatkan label ke kamera
<br>
• Pastikan tulisan memenuhi layar
<br>
• Hindari pantulan cahaya
<br>
• Putar ampul/vial sedikit
<br>
• Pastikan tulisan tidak terlalu blur

`;

isScanning=false;

}
catch(error){

console.error(error);

document.getElementById(
"scanResult"
).innerHTML=
"❌ Terjadi kesalahan saat scan.";

isScanning=false;

}

}


/* ==========================================
APPROVE
========================================== */

function approveMedicine(){

if(!detectedDrug)return;

stock[detectedDrug]=
(stock[detectedDrug]||0)+1;

saveStock();

renderStock();
renderFormulary();

document.getElementById(
"scanResult"
).innerHTML=`

<div>✅ Stok berhasil ditambahkan:</div>

<div class="detected">
${detectedDrug}
</div>

<div style="margin-top:5px">
Stok sekarang:
<strong>
${stock[detectedDrug]}
</strong>
</div>

`;

document.getElementById(
"scanButtons"
).style.display="none";

detectedDrug=null;

}
