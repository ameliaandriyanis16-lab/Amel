<script>

/* =====================================================
   DAFTAR 14 OBAT EMERGENCY
===================================================== */

const drugs = [

    "Epinephrine",
    "Norepinephrine",
    "Dopamine",
    "Dobutamine",
    "Midazolam",
    "Fentanyl",
    "Ketamine",
    "Lidocaine",
    "D40",
    "Meylon",
    "Atropine sulfate",
    "Amiodarone",
    "Dexamethasone",
    "Calcium gluconate"

];


/* =====================================================
   LOAD DATA STORAGE
===================================================== */

let stock =
    JSON.parse(
        localStorage.getItem(
            "smartTrolleyStock"
        )
    ) || {};


let usageHistory =
    JSON.parse(
        localStorage.getItem(
            "smartTrolleyUsageHistory"
        )
    ) || [];


/* =====================================================
   HAPUS ALKOHOL DARI DATA LAMA
===================================================== */

delete stock["Alkohol 70%"];


/* Pastikan semua obat ada */

drugs.forEach(drug => {

    if(
        typeof stock[drug] !== "number"
    ){

        stock[drug] = 0;

    }

});

saveStock();


/* =====================================================
   CAMERA VARIABLES
===================================================== */

let cameraStream = null;

let currentZoom = 2;

let detectedDrug = null;

let isScanning = false;

let ocrWorker = null;


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

    try{

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video:{

                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    },

                    frameRate:{
                        ideal:30
                    }

                },

                audio:false

            });


        document.getElementById(
            "video"
        ).srcObject =
            cameraStream;


        document.getElementById(
            "scanStatus"
        ).innerText =
            "Kamera siap digunakan";

    }

    catch(error){

        console.error(error);

        document.getElementById(
            "scanStatus"
        ).innerText =
            "❌ Kamera tidak dapat dibuka. Cek izin kamera.";

    }

}


/* =====================================================
   ZOOM
===================================================== */

function setZoom(value){

    currentZoom = value;

    document
        .getElementById("zoom2")
        .classList
        .toggle(
            "active",
            value === 2
        );

    document
        .getElementById("zoom25")
        .classList
        .toggle(
            "active",
            value === 2.5
        );

    document.getElementById(
        "scanStatus"
    ).innerText =
        "Zoom " + value + "× dipilih";

}


/* =====================================================
   CAPTURE
===================================================== */

function captureFrame(){

    const video =
        document.getElementById(
            "video"
        );

    const canvas =
        document.getElementById(
            "canvas"
        );

    if(!video.videoWidth){

        throw new Error(
            "Kamera belum siap."
        );

    }

    const ctx =
        canvas.getContext("2d");

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas;

}


/* =====================================================
   IMAGE ENHANCEMENT
===================================================== */

function enhanceCanvas(
    sourceCanvas,
    mode = "normal",
    scale = 1
){

    const output =
        document.createElement(
            "canvas"
        );

    output.width =
        sourceCanvas.width * scale;

    output.height =
        sourceCanvas.height * scale;

    const ctx =
        output.getContext("2d");

    ctx.drawImage(
        sourceCanvas,
        0,
        0,
        output.width,
        output.height
    );

    const image =
        ctx.getImageData(
            0,
            0,
            output.width,
            output.height
        );

    const data =
        image.data;

    for(
        let i = 0;
        i < data.length;
        i += 4
    ){

        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];

        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        if(mode === "contrast"){

            gray =
                ((gray - 128) * 1.8) + 128;

        }


        if(mode === "threshold"){

            gray =
                gray > 145
                    ? 255
                    : 0;

        }


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        image,
        0,
        0
    );


    return output;

}


/* =====================================================
   NORMALIZE TEXT
===================================================== */

function normalizeText(text){

    return text
        .toUpperCase()
        .replace(/0/g,"O")
        .replace(/1/g,"I")
        .replace(/5/g,"S")
        .replace(
            /[^A-Z0-9\s]/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =====================================================
   COMPACT TEXT
===================================================== */

function compactText(text){

    return normalizeText(text)
        .replace(/\s/g,"");

}


/* =====================================================
   LEVENSHTEIN
===================================================== */

function levenshtein(a,b){

    const matrix = [];

    for(
        let i=0;
        i<=b.length;
        i++
    ){

        matrix[i] = [i];

    }

    for(
        let j=0;
        j<=a.length;
        j++
    ){

        matrix[0][j] = j;

    }

    for(
        let i=1;
        i<=b.length;
        i++
    ){

        for(
            let j=1;
            j<=a.length;
            j++
        ){

            if(
                b.charAt(i-1) ===
                a.charAt(j-1)
            ){

                matrix[i][j] =
                    matrix[i-1][j-1];

            }
            else{

                matrix[i][j] =
                    Math.min(

                        matrix[i-1][j-1] + 1,

                        matrix[i][j-1] + 1,

                        matrix[i-1][j] + 1

                    );

            }

        }

    }

    return matrix[
        b.length
    ][
        a.length
    ];

}


/* =====================================================
   SIMILARITY
===================================================== */

function similarity(a,b){

    a =
        compactText(a);

    b =
        compactText(b);

    if(!a || !b){

        return 0;

    }

    const distance =
        levenshtein(a,b);

    return 1 -
        (
            distance /
            Math.max(
                a.length,
                b.length
            )
        );

}


/* =====================================================
   DRUG ALIASES
===================================================== */

function identifyDrug(text){

    const normalized =
        normalizeText(text);

    const compact =
        compactText(text);


    const aliases = {

        "Epinephrine":[
            "EPINE",
            "EPINEP",
            "EPINEPH",
            "ADREN",
            "ADRENA"
        ],

        "Norepinephrine":[
            "NOREP",
            "NOREPI",
            "NOREPIN",
            "NOREPINE",
            "NOREPH"
        ],

        "Dopamine":[
            "DOPA",
            "DOPAM",
            "DOPAMI",
            "DOPAMIN",
            "DOPAMINE"
        ],

        "Dobutamine":[
            "DOBUT",
            "DOBUTA",
            "DOBUTAM",
            "DOBUTAMINE"
        ],

        "Midazolam":[
            "MIDA",
            "MIDAZ",
            "MIDAZO",
            "MIDAZOL",
            "MIDAZOLA",
            "MIDAZOLAM"
        ],

        "Fentanyl":[
            "FENT",
            "FENTA",
            "FENTAN",
            "FENTANY",
            "FENTANYL"
        ],

        "Ketamine":[
            "KETA",
            "KETAM",
            "KETAMI",
            "KETAMIN",
            "KETAMINE"
        ],

        "Lidocaine":[
            "LIDO",
            "LIDOC",
            "LIDOCA",
            "LIDOCAI",
            "LIDOCAINE"
        ],

        "D40":[
            "D40",
            "DEX40",
            "DEXTRO40",
            "DEXTROSE40"
        ],

        "Meylon":[
            "MEYL",
            "MEYLO",
            "MEYLON"
        ],

        "Atropine sulfate":[
            "ATROP",
            "ATROPI",
            "ATROPIN",
            "ATROPINE",
            "SULFATE"
        ],

        "Amiodarone":[
            "AMIOD",
            "AMIODA",
            "AMIODAR",
            "AMIODARO",
            "AMIODARONE",
            "AMIDAR"
        ],

        "Dexamethasone":[
            "DEXA",
            "DEXAM",
            "DEXAME",
            "DEXAMET",
            "DEXAMETH",
            "DEXAMETHA",
            "DEXAMETHASONE"
        ],

        "Calcium gluconate":[
            "CALCIUM",
            "CALCI",
            "GLUCON",
            "GLUCONA",
            "GLUCONATE"
        ]

    };


    /* CEK ALIAS */

    for(
        const drug of drugs
    ){

        const list =
            aliases[drug] || [];

        for(
            const alias of list
        ){

            if(
                compact.includes(
                    alias
                )
            ){

                return {

                    drug:drug,

                    confidence:0.96

                };

            }

        }

    }


    /* FUZZY MATCH */

    const words =
        normalized.split(" ");

    let bestDrug = null;

    let bestScore = 0;


    for(
        const drug of drugs
    ){

        const drugWords =
            drug
                .toUpperCase()
                .split(" ");


        for(
            const word of words
        ){

            if(word.length < 4){

                continue;

            }


            for(
                const target of drugWords
            ){

                const score =
                    similarity(
                        word,
                        target
                    );


                if(
                    score > bestScore
                ){

                    bestScore =
                        score;

                    bestDrug =
                        drug;

                }

            }

        }

    }


    if(
        bestDrug &&
        bestScore >= 0.65
    ){

        return {

            drug:bestDrug,

            confidence:bestScore

        };

    }


    return null;

}


/* =====================================================
   OCR WORKER
===================================================== */

async function getOCRWorker(){

    if(ocrWorker){

        return ocrWorker;

    }

    ocrWorker =
        await Tesseract.createWorker(
            "eng"
        );

    return ocrWorker;

}


/* =====================================================
   OCR READ
===================================================== */

async function readOCR(canvas){

    const worker =
        await getOCRWorker();

    const result =
        await worker.recognize(
            canvas
        );

    return result.data.text || "";

}


/* =====================================================
   SCAN
===================================================== */

async function scanMedicine(){

    if(isScanning){

        return;

    }

    isScanning = true;

    detectedDrug = null;


    const card =
        document.getElementById(
            "scanResultCard"
        );

    const resultBox =
        document.getElementById(
            "scanResult"
        );

    const confidenceBox =
        document.getElementById(
            "confidenceText"
        );

    const status =
        document.getElementById(
            "scanStatus"
        );


    card.classList.remove(
        "hidden"
    );


    resultBox.innerText =
        "⏳ Membaca obat...";


    confidenceBox.innerText =
        "";


    status.innerHTML =
        '<span class="loading">OCR sedang membaca gambar...</span>';


    try{

        const baseCanvas =
            captureFrame();


        const candidates = [];


        candidates.push(
            baseCanvas
        );


        candidates.push(
            enhanceCanvas(
                baseCanvas,
                "normal",
                currentZoom
            )
        );


        candidates.push(
            enhanceCanvas(
                baseCanvas,
                "contrast",
                currentZoom
            )
        );


        candidates.push(
            enhanceCanvas(
                baseCanvas,
                "threshold",
                currentZoom
            )
        );


        let found = null;

        let allText = "";


        for(
            let i=0;
            i<candidates.length;
            i++
        ){

            status.innerText =
                "Membaca gambar " +
                (i+1) +
                " / " +
                candidates.length +
                "...";


            const text =
                await readOCR(
                    candidates[i]
                );


            allText +=
                " " + text;


            const result =
                identifyDrug(
                    text
                );


            if(result){

                found =
                    result;

                break;

            }

        }


        if(!found){

            found =
                identifyDrug(
                    allText
                );

        }


        if(found){

            detectedDrug =
                found.drug;


            resultBox.innerText =
                "💊 " +
                found.drug;


            confidenceBox.innerText =
                "Hasil pengenalan: " +
                Math.round(
                    found.confidence * 100
                ) +
                "%";


            status.innerText =
                "Silakan cek nama obat sebelum Approve.";

        }

        else{

            resultBox.innerText =
                "❌ Obat tidak dikenali";


            confidenceBox.innerText =
                "Coba arahkan kamera lebih dekat ke nama obat.";


            status.innerText =
                "Silakan Scan Ulang.";

        }

    }

    catch(error){

        console.error(error);


        resultBox.innerText =
            "❌ Gagal membaca gambar";


        confidenceBox.innerText =
            "Pastikan kamera aktif dan tulisan obat terlihat jelas.";


        status.innerText =
            "Terjadi kesalahan saat OCR.";

    }


    isScanning = false;

}


/* =====================================================
   APPROVE
===================================================== */

function approveMedicine(){

    if(!detectedDrug){

        alert(
            "Belum ada obat yang dikenali."
        );

        return;

    }


    /* HANYA APPROVE YANG MENAMBAH STOK */

    stock[detectedDrug] =
        (stock[detectedDrug] || 0) + 1;


    saveStock();

    renderStock();


    alert(
        detectedDrug +
        " berhasil ditambahkan ke stok."
    );


    resetScan();

}


/* =====================================================
   RESET SCAN
===================================================== */

function resetScan(){

    detectedDrug = null;


    document
        .getElementById(
            "scanResultCard"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "scanResult"
        )
        .innerText =
        "-";


    document
        .getElementById(
            "confidenceText"
        )
        .innerText =
        "";

}


/* =====================================================
   SAVE STOCK
===================================================== */

function saveStock(){

    localStorage.setItem(
        "smartTrolleyStock",
        JSON.stringify(stock)
    );

}


/* =====================================================
   CHANGE STOCK
===================================================== */

function changeStock(
    drug,
    amount
){

    stock[drug] =
        Number(
            stock[drug] || 0
        ) +
        amount;


    if(
        stock[drug] < 0
    ){

        stock[drug] = 0;

    }


    saveStock();

    renderStock();

}

/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(timestamp){

    const date =
        new Date(timestamp);


    const day =
        String(
            date.getDate()
        ).padStart(2,"0");


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");


    const year =
        date.getFullYear();


    return (
        day +
        "/" +
        month +
        "/" +
        year
    );

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(timestamp){

    const date =
        new Date(timestamp);


    const hours =
        String(
            date.getHours()
        ).padStart(2,"0");


    const minutes =
        String(
            date.getMinutes()
        ).padStart(2,"0");


    const seconds =
        String(
            date.getSeconds()
        ).padStart(2,"0");


    return (
        hours +
        ":" +
        minutes +
        ":" +
        seconds
    );

}


/* =====================================================
   ADD USAGE
===================================================== */

function addUsage(){

    const drug =
        document
            .getElementById(
                "usageDrug"
            )
            .value;


    const patient =
        document
            .getElementById(
                "patientName"
            )
            .value
            .trim();


    const dose =
        document
            .getElementById(
                "usageDose"
            )
            .value
            .trim();


    const qty =
        parseInt(
            document
                .getElementById(
                    "usageQty"
                )
                .value
        );


    if(!patient){

        alert(
            "Nama pasien harus diisi."
        );

        return;

    }


    if(!dose){

        alert(
            "Dosis harus diisi."
        );

        return;

    }


    if(
        !qty ||
        qty < 1
    ){

        alert(
            "Jumlah pemakaian tidak valid."
        );

        return;

    }


    if(
        (stock[drug] || 0) < qty
    ){

        alert(
            "Stok " +
            drug +
            " tidak mencukupi."
        );

        return;

    }


    /* =================================================
       TIMESTAMP OTOMATIS
    ================================================= */

    const timestamp =
        Date.now();


    const date =
        formatDate(
            timestamp
        );


    const time =
        formatTime(
            timestamp
        );


    /* =================================================
       KURANGI STOK
    ================================================= */

    stock[drug] -= qty;


    /* =================================================
       SIMPAN RIWAYAT LENGKAP
    ================================================= */

    usageHistory.unshift({

        id:
            timestamp,

        timestamp:
            timestamp,

        drug:
            drug,

        patient:
            patient,

        dose:
            dose,

        qty:
            qty,

        date:
            date,

        time:
            time

    });


    /* SIMPAN KE LOCAL STORAGE */

    saveStock();

    saveHistory();


    /* UPDATE TAMPILAN */

    renderStock();

    renderHistory();


    /* KOSONGKAN FORM */

    document
        .getElementById(
            "patientName"
        )
        .value = "";


    document
        .getElementById(
            "usageDose"
        )
        .value = "";


    document
        .getElementById(
            "usageQty"
        )
        .value = 1;


    alert(
        "Pemakaian berhasil dicatat!\n\n" +
        "Obat: " +
        drug +
        "\n" +
        "Dosis: " +
        dose +
        "\n" +
        "Pasien: " +
        patient +
        "\n" +
        "Jumlah: " +
        qty +
        "\n" +
        "Tanggal: " +
        date +
        "\n" +
        "Jam: " +
        time
    );

}


/* =====================================================
   SAVE HISTORY
===================================================== */

function saveHistory(){

        "smartTrolleyUsageHistory",

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

    const container =
        document.getElementById(
            "historyList"
        );


    container.innerHTML = "";


    if(
        usageHistory.length === 0
    ){

        container.innerHTML =
            '<div class="small">Belum ada riwayat pemakaian.</div>';

        return;

    }


    usageHistory.forEach(item => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "history-item";


        /* =================================================
           PASTIKAN DATA LAMA TETAP AMAN
        ================================================= */

        let timestamp =
            item.timestamp;


        if(
            !timestamp &&
            item.date
        ){

            timestamp =
                null;

        }


        let date =
            item.date || "-";


        let time =
            item.time || "-";


        /*
        Jika data baru punya timestamp,
        tanggal dan jam dibuat ulang dari timestamp.
        */

        if(timestamp){

            date =
                formatDate(
                    timestamp
                );

            time =
                formatTime(
                    timestamp
                );

        }


        div.innerHTML = `

            <div class="history-drug">
                💊 ${item.drug || "-"}
            </div>

            <div class="history-info">
                👤 <b>Pasien:</b>
                ${item.patient || "-"}
            </div>

            <div class="history-info">
                💉 <b>Dosis:</b>
                ${item.dose || "-"}
            </div>

            <div class="history-info">
                🔢 <b>Jumlah:</b>
                ${item.qty || "-"}
            </div>

            <div class="history-date">

                📅 Tanggal:
                <b>${date}</b>

                <br>

                🕐 Jam:
                <b>${time}</b>

            </div>

            <button
                class="delete-btn"
                onclick="deleteHistory(${item.id})">

                🗑️ Hapus

            </button>

        `;


        container.appendChild(
            div
        );

    });

}


/* =====================================================
   DELETE ONE HISTORY
   TIDAK MENGEMBALIKAN STOK
===================================================== */

function deleteHistory(id){

    const answer =
        confirm(
            "Hapus riwayat ini?\n\nStok tidak akan dikembalikan."
        );


    if(!answer){

        return;

    }


    usageHistory =
        usageHistory.filter(
            item =>
                item.id !== id
        );


    saveHistory();

    renderHistory();

}


/* =====================================================
   DELETE ALL HISTORY
   TIDAK MENGEMBALIKAN STOK
===================================================== */

function deleteAllHistory(){

    if(
        usageHistory.length === 0
    ){

        alert(
            "Belum ada riwayat."
        );

        return;

    }


    const answer =
        confirm(
            "Hapus SEMUA riwayat pemakaian?\n\nStok tidak akan dikembalikan."
        );


    if(!answer){

        return;

    }


    usageHistory = [];


    saveHistory();

    renderHistory();

}

/* =====================================================
   LOAD DATA PRINT TERAKHIR
===================================================== */

function loadLastPrint(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "smartTrolleyLastPrint"
                )
            );


        if(!saved){

            return;

        }


        if(saved.drug){

            document
                .getElementById(
                    "printDrug"
                )
                .value =
                saved.drug;

        }


        if(saved.dose){

            document
                .getElementById(
                    "printDose"
                )
                .value =
                saved.dose;

        }


        if(saved.patient){

            document
                .getElementById(
                    "printPatient"
                )
                .value =
                saved.patient;

        }

    }

    catch(error){

        console.error(error);

    }

}
