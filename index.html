/* =====================================================

/* =====================================================
   KAMERA
===================================================== */

async function startCamera(){

    try{

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1920
                    },

                    height:{

                    frameRate:{

                    }

            });

            cameraStream;

        document.getElementById("scanStatus").innerText =
            "Kamera siap digunakan";

    }catch(error){

        console.error(error);

        document.getElementById("scanStatus").innerText =
            "❌ Kamera tidak dapat dibuka. Cek izin kamera.";

    }

}


/* =====================================================
   ZOOM
===================================================== */

function setZoom(value){

    currentZoom = value;

    document
        .getElementById("zoom2")
        .classList.toggle(
            "active",
            value === 2
        );

    document
        .getElementById("zoom25")
        .classList.toggle(
            "active",
            value === 2.5
        );

    document.getElementById("scanStatus").innerText =
        "Zoom " + value + "× dipilih";

}


/* =====================================================
   AMBIL FOTO DARI KAMERA
===================================================== */

function captureFrame(zoom){

    const video =
        document.getElementById("video");

    const canvas =
        document.getElementById("canvas");

    const vw =
        video.videoWidth;

    const vh =
        video.videoHeight;

    if(!vw || !vh){
        return null;
    }

    const cropW =
        vw / zoom;

    const cropH =
        vh * 0.48;

    const sx =
        (vw - cropW) / 2;

    const sy =
        (vh - cropH) / 2;

    canvas.width =
        Math.floor(cropW * 2);

    canvas.height =
        Math.floor(cropH * 2);

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        video,
        sx,
        sy,
        cropW,
        cropH,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas;

}


/* =====================================================
   ENHANCE GAMBAR
===================================================== */

function enhanceCanvas(source,mode){

    const c =
        document.createElement("canvas");

    c.width =
        source.width;

    c.height =
        source.height;

    const ctx =
        c.getContext("2d");

    ctx.drawImage(
        source,
        0,
        0
    );

    const image =
        ctx.getImageData(
            0,
            0,
            c.width,
            c.height
        );

    const data =
        image.data;

    for(let i=0;i<data.length;i+=4){

        let r=data[i];
        let g=data[i+1];
        let b=data[i+2];

        let gray =
            0.299*r +
            0.587*g +
            0.114*b;

        if(mode === "contrast"){

            gray =
                (gray - 128) * 1.8 + 128;

        }

        if(mode === "threshold"){

            gray =
                gray > 150 ? 255 : 0;

        }

        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );

        data[i]=gray;
        data[i+1]=gray;
        data[i+2]=gray;

    }

    ctx.putImageData(
        image,
        0,
        0
    );

    return c;

}


/* =====================================================
   NORMALISASI OCR
===================================================== */

function normalizeText(text){

    return String(text || "")
        .toUpperCase()
        .replace(/[\r\n\t]+/g," ")
        .replace(/[^A-Z0-9% ]/g," ")
        .replace(/\s+/g," ")
        .trim();

}

function compactText(text){

    return normalizeText(text)
        .replace(/\s+/g,"");

}


/* =====================================================
   LEVENSHTEIN
===================================================== */

function levenshtein(a,b){

    const matrix=[];

    for(let i=0;i<=b.length;i++){
        matrix[i]=[i];
    }

    for(let j=0;j<=a.length;j++){
        matrix[0][j]=j;
    }

    for(let i=1;i<=b.length;i++){

        for(let j=1;j<=a.length;j++){

            if(
                b.charAt(i-1) ===
                a.charAt(j-1)
            ){

                matrix[i][j] =
                    matrix[i-1][j];

            }else{

                matrix[i][j] =
                    Math.min(

                        matrix[i-1][j-1]+1,

                        matrix[i][j-1]+1,

                        matrix[i-1][j]+1

                    );

            }

        }

    }

    return matrix[b.length][a.length];

}


/* =====================================================
   SIMILARITY
===================================================== */

function similarity(a,b){

    if(!a || !b){
        return 0;
    }

    return 1 -
        levenshtein(a,b) /
        Math.max(
            a.length,
            b.length
        );

}


/* =====================================================
   IDENTIFIKASI OBAT
===================================================== */

function identifyDrug(text){

    const normal =
        normalizeText(text);

    const compact =
        compactText(text);

    if(!compact){
        return null;
    }


    /* FRAGMENT CEPAT */

    const fragments = {

        "Norepinephrine":[
            "NOREP",
            "NOREPI",
            "NOREPINE"
        ],

        "Dopamine":[
            "DOPA",
            "DOPAM",
            "DOPAMIN"
        ],

        "Midazolam":[
            "MIDA",
            "MIDAZ",
            "MIDAZOL"
        ],

        "Fentanyl":[
            "FENT",
            "FENTA",
            "FENTANY"
        ],

        "Ketamine":[
            "KETA",
            "KETAM"
        ],

        "Lidocaine":[
            "LIDO",
            "LIDOCA"
        ],

        "D40":[
            "D40",
            "DEX40"
        ],

        "Meylon":[
            "MEYL",
            "MEYLO"
        ],

        "Atropine sulfate":[
            "ATROP",
            "ATROPI"
        ],

        "Amiodarone":[
            "AMIOD",
            "AMIDAR"
        ],

        "Dexamethasone":[
            "DEXA",
            "DEXAM",
            "DEXAMETH"
        ],

        "Calcium gluconate":[
            "CALCIUM",
            "GLUCON",
            "GLUCONATE"
        ],

        "Dobutamine":[
            "DOBUT",
            "DOBUTA"
        ],

        "Epinephrine":[
            "EPINE",
            "EPINEP",
            "ADRENA"
        ]

    };


    /* EXACT / ALIAS */

    for(const drug of drugs){

        const list =
            aliases[drug] || [];

        for(const alias of list){

            const a =
                compactText(alias);

            if(
                compact === a ||
                compact.includes(a) ||
                a.includes(compact)
            ){

                return drug;

            }

        }

    }


    /* FRAGMENT */

    for(const drug of drugs){

        const list =
            fragments[drug] || [];

        for(const fragment of list){

            if(
                compact.includes(fragment)
            ){

                return drug;

            }

        }

    }


    /* WORD-WISE */

    const words =
        normal.split(" ");

    for(const word of words){

        if(word.length < 4){
            continue;
        }

        for(const drug of drugs){

            const list =
                aliases[drug] || [];

            for(const alias of list){

                const a =
                    compactText(alias);

                if(a.length < 4){
                    continue;
                }

                const score =
                    similarity(
                        word,
                        a
                    );

                if(score >= 0.78){

                    return drug;

                }

            }

        }

    }


    return null;

}


/* =====================================================
   OCR WORKER
===================================================== */

async function getOCRWorker(){

    if(ocrWorker){
        return ocrWorker;
    }

    ocrWorker =
        await Tesseract.createWorker("eng");

    await ocrWorker.setParameters({

        tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_LINE,

        preserve_interword_spaces:
            "1"

    });

    return ocrWorker;

}


/* =====================================================
   BACA OCR
===================================================== */

async function readOCR(canvas){

    const worker =
        await getOCRWorker();

    const result =
        await worker.recognize(canvas);

    return result.data.text || "";

}


/* =====================================================
   SCAN OBAT
===================================================== */

async function scanMedicine(){

    if(isScanning){
        return;
    }

    isScanning=true;

    const status =
        document.getElementById(
            "scanStatus"
        );

    const result =
        document.getElementById(
            "resultText"
        );

    const approve =
        document.getElementById(
            "approveBtn"
        );

    const retry =
        document.getElementById(
            "retryBtn"
        );

    detectedDrug=null;

    approve.classList.add("hidden");
    retry.classList.add("hidden");

    result.innerText =
        "Scanning...";

    status.innerHTML =
        '<span class="loading">🔎 Membaca tulisan obat...</span>';

    try{

        /*
         * URUTAN CEPAT
         * Zoom yang dipilih user dipakai terlebih dahulu.
         */

        const zoomList =
            currentZoom === 2.5
            ? [2.5,2]
            : [2,2.5];

        let found=null;

        let combinedText="";


        for(const zoom of zoomList){

            const base =
                captureFrame(zoom);

            if(!base){
                continue;
            }


            /* NORMAL */

            let text =
                await readOCR(base);

            combinedText +=
                " " + text;

            found =
                identifyDrug(text);

            if(found){
                break;
            }


            /* CONTRAST */

            const contrast =
                enhanceCanvas(
                    base,
                    "contrast"
                );

            text =
                await readOCR(
                    contrast
                );

            combinedText +=
                " " + text;

            found =
                identifyDrug(text);

            if(found){
                break;
            }


            /* THRESHOLD */

            const threshold =
                enhanceCanvas(
                    base,
                    "threshold"
                );

            text =
                await readOCR(
                    threshold
                );

            combinedText +=
                " " + text;

            found =
                identifyDrug(text);

            if(found){
                break;
            }

        }


        if(!found){

            found =
                identifyDrug(
                    combinedText
                );

        }


        if(found){

            detectedDrug =
                found;

            result.innerText =
                found;

            approve.classList.remove(
                "hidden"
            );

            retry.classList.remove(
                "hidden"
            );

            status.innerText =
                "✓ Obat dikenali. Periksa lalu tekan APPROVE.";

        }else{

            result.innerText =
                "Obat belum dikenali";

            retry.classList.remove(
                "hidden"
            );

            status.innerText =
                "Tulisan belum terbaca. Posisikan nama obat di tengah kamera lalu scan ulang.";

        }

    }catch(error){

        console.error(error);

        result.innerText =
            "Scan gagal";

        retry.classList.remove(
            "hidden"
        );

        status.innerText =
            "❌ Terjadi kesalahan saat scanning.";

    }

    isScanning=false;

}


/* =====================================================
   APPROVE
===================================================== */

function approveMedicine(){

    if(!detectedDrug){
        return;
    }

    stock[detectedDrug] =
        (stock[detectedDrug] || 0) + 1;

    saveStock();

    renderStock();

    document.getElementById(
        "resultText"
    ).innerText =
        detectedDrug + " ✓";

    document.getElementById(
        "approveBtn"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "scanStatus"
    ).innerText =
        "✓ " +
        detectedDrug +
        " ditambahkan ke stok.";

    detectedDrug=null;

}


/* =====================================================
   RESET SCAN
===================================================== */

function resetScan(){

    detectedDrug=null;

    document.getElementById(
        "resultText"
    ).innerText =
        "Belum ada hasil scan";

    document.getElementById(
        "approveBtn"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "retryBtn"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "scanStatus"
    ).innerText =
        "Kamera siap digunakan";

}


/* =====================================================
   STORAGE STOK
===================================================== */

function saveStock(){

    localStorage.setItem(
        "smartTrolleyStock",
        JSON.stringify(stock)
    );

}


/* =====================================================
   UBAH STOK
===================================================== */

function changeStock(
    drug,
    amount
){

    stock[drug] =
        Math.max(
            0,
            (stock[drug] || 0) + amount
        );

    saveStock();

    renderStock();

}


/* =====================================================
   TAMPILKAN STOK
===================================================== */

function renderStock(){

    const container =
        document.getElementById(
            "stockList"
        );

    container.innerHTML="";

    drugs.forEach(drug=>{

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "stock-row";

        row.innerHTML = `

            <div class="drug-name">
                ${drug}
            </div>

            <div class="stock-control">

                <button
                    onclick="changeStock('${drug}',-1)">
                    −
                </button>

                <div class="stock-number">
                    ${stock[drug] || 0}
                </div>

                <button
                    onclick="changeStock('${drug}',1)">
                    +
                </button>

            </div>

        `;

        container.appendChild(row);

    });

}


/* =====================================================
   FORMULARIUM
===================================================== */

function renderFormulary(){

    const container =
        document.getElementById(
            "formularyList"
        );

    const usageSelect =
        document.getElementById(
            "usageDrug"
        );

    const printSelect =
        document.getElementById(
            "printDrug"
        );

    container.innerHTML="";

    usageSelect.innerHTML="";

    printSelect.innerHTML="";


    drugs.forEach(drug=>{

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "formulary-row";

        row.innerHTML = `

            <div class="formulary-name">
                ${drug}
            </div>

            <button
                class="formulary-btn"
                onclick="selectUsageDrug('${drug}')">

                Tambah Pemakaian

            </button>

        `;

        container.appendChild(row);


        usageSelect.innerHTML += `
            <option value="${drug}">
                ${drug}
            </option>
        `;


        printSelect.innerHTML += `
            <option value="${drug}">
                ${drug}
            </option>
        `;

    });

}


/* =====================================================
   PILIH OBAT DARI FORMULARIUM
===================================================== */

function selectUsageDrug(drug){

    document.getElementById(
        "usageDrug"
    ).value =
        drug;

    document.getElementById(
        "patientName"
    ).scrollIntoView({

        behavior:"smooth",

        block:"center"

    });

    setTimeout(()=>{

        document.getElementById(
            "patientName"
        ).focus();

    },400);

}


/* =====================================================
   TAMBAH PEMAKAIAN
===================================================== */

function addUsage(){

    const drug =
        document.getElementById(
            "usageDrug"
        ).value;

    const patient =
        document.getElementById(
            "patientName"
        ).value.trim();

    const qty =
        parseInt(
            document.getElementById(
                "usageQty"
            ).value
        );


    if(!patient){

        alert(
            "Nama pasien harus diisi."
        );

        return;

    }


    if(!qty || qty < 1){

        alert(
            "Jumlah pemakaian tidak valid."
        );

        return;

    }


    if(
        (stock[drug] || 0)
        < qty
    ){

        alert(
            "Stok " +
            drug +
            " tidak mencukupi."
        );

        return;

    }


    stock[drug] -= qty;


    const now =
        new Date();


    usageHistory.unshift({

        id:
            Date.now(),

        drug:
            drug,

        patient:
            patient,

        qty:
            qty,

        date:
            now.toLocaleDateString(
                "id-ID"
            ),

        time:
            now.toLocaleTimeString(
                "id-ID",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )

    });


    saveStock();

    saveHistory();

    renderStock();

    renderHistory();


    document.getElementById(
        "patientName"
    ).value="";

    document.getElementById(
        "usageQty"
    ).value=1;


    alert(
        "Pemakaian berhasil dicatat."
    );

}


/* =====================================================
   STORAGE RIWAYAT
===================================================== */

function saveHistory(){

    localStorage.setItem(
        "smartTrolleyUsageHistory",
        JSON.stringify(
            usageHistory
        )
    );

}


/* =====================================================
   TAMPILKAN RIWAYAT
===================================================== */

function renderHistory(){

    const container =
        document.getElementById(
            "historyList"
        );

    container.innerHTML="";


    if(
        usageHistory.length === 0
    ){

        container.innerHTML =
            '<div class="small">Belum ada riwayat pemakaian.</div>';

        return;

    }


    usageHistory.forEach(item=>{

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "history-item";


        div.innerHTML = `

            <div class="history-drug">
                ${item.drug}
            </div>

            <div class="small">
                Pasien: ${item.patient}
            </div>

            <div class="small">
                Jumlah: ${item.qty}
            </div>

            <div class="small">
                ${item.date} • ${item.time}
            </div>

            <button
                class="delete-btn"
                onclick="deleteHistory(${item.id})">

                Hapus

            </button>

        `;

        container.appendChild(div);

    });

}


/* =====================================================
   HAPUS SATU RIWAYAT
===================================================== */

function deleteHistory(id){

    usageHistory =
        usageHistory.filter(
            item =>
                item.id !== id
        );

    saveHistory();

    renderHistory();

}


/* =====================================================
   HAPUS SEMUA RIWAYAT
===================================================== */

function deleteAllHistory(){

    if(
        usageHistory.length === 0
    ){
        return;
    }


    if(
        confirm(
            "Hapus semua riwayat pemakaian?"
        )
    ){

        usageHistory=[];

        saveHistory();

        renderHistory();

    }

}
