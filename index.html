<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Nursing Trolley</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7f9;
    color: #222;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
    color: #123;
}

.subtitle {
    text-align: center;
    margin-bottom: 20px;
    color: #666;
}

.card {
    background: white;
    padding: 18px;
    margin-bottom: 18px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.camera-btn {
    background: #1976d2;
    color: white;
}

.stop-btn {
    background: #d32f2f;
    color: white;
}

.scan-btn {
    background: #388e3c;
    color: white;
}

.approve-btn {
    background: #00897b;
    color: white;
}

.cancel-btn {
    background: #777;
    color: white;
}

video {
    width: 100%;
    margin-top: 15px;
    border-radius: 12px;
    background: #000;
    display: block;
    min-height: 250px;
    object-fit: cover;
}

#status {
    margin-top: 12px;
    padding: 12px;
    background: #eef3f7;
    border-radius: 8px;
    text-align: center;
}

#ocrResult {
    white-space: pre-wrap;
    background: #f1f1f1;
    padding: 12px;
    border-radius: 8px;
    min-height: 50px;
}

.detected {
    background: #e8f5e9;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
}

.stock-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    padding: 12px 0;
}

.stock-name {
    font-weight: bold;
}

.stock-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.stock-controls button {
    width: 42px;
    padding: 8px;
    margin: 0;
}

.qty {
    min-width: 30px;
    text-align: center;
    font-weight: bold;
}

.low-stock {
    color: #d32f2f;
    font-weight: bold;
}

.hidden {
    display: none;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.print-label {
    display: none;
}

@media print {

    body * {
        visibility: hidden;
    }

    #printArea,
    #printArea * {
        visibility: visible;
    }

    #printArea {
        display: block;
        position: absolute;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: Arial, sans-serif;
        font-size: 12px;
    }

    @page {
        size: 58mm auto;
        margin: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>SMART NURSING TROLLEY SYSTEM</h1>

    <div class="subtitle">
        Emergency Drug Inventory System
    </div>


    <!-- CAMERA -->
    <div class="card">

        <h2>📷 Scan Obat</h2>

        <button
            class="camera-btn"
            onclick="startCamera()">
            📷 Buka Kamera
        </button>

        <button
            class="stop-btn"
            onclick="stopCamera()">
            ⏹️ Matikan Kamera
        </button>

        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>

        <div id="status">
            Kamera belum digunakan
        </div>

        <button
            class="scan-btn"
            onclick="scanMedicine()">
            🔍 Scan Obat
        </button>

    </div>


    <!-- OCR -->
    <div class="card">

        <h2>📝 Hasil Scan</h2>

        <div id="ocrResult">
            Belum ada hasil scan.
        </div>

    </div>


    <!-- DETECTED MEDICINE -->
    <div
        class="card hidden"
        id="detectedCard">

        <h2>💊 Obat Terdeteksi</h2>

        <div
            class="detected"
            id="detectedMedicine">
        </div>

        <button
            class="approve-btn"
            onclick="approveMedicine()">
            ✅ Approve & Tambahkan
        </button>

        <button
            class="cancel-btn"
            onclick="cancelScan()">
            ❌ Batal
        </button>

    </div>


    <!-- STOCK -->
    <div class="card">

        <h2>📦 Stok Obat</h2>

        <div id="stockList">
            Belum ada obat.
        </div>

    </div>


    <!-- PRINT -->
    <div class="card">

        <h2>🖨️ Print Label</h2>

        <label>
            Nama Pasien
        </label>

        <input
            id="patientName"
            type="text"
            placeholder="Nama pasien">

        <label>
            Nama Obat
        </label>

        <input
            id="printMedicine"
            type="text"
            placeholder="Nama obat">

        <label>
            Dosis
        </label>

        <input
            id="dose"
            type="text"
            placeholder="Contoh: 5 mg">

        <button
            class="print-btn"
            onclick="printLabel()">
            🖨️ Print Label 58 mm
        </button>

    </div>


    <!-- PRINT AREA -->
    <div id="printArea" class="print-label">

        <h3>SMART NURSING TROLLEY</h3>

        <p>
            <strong>Pasien:</strong>
            <span id="labelPatient"></span>
        </p>

        <p>
            <strong>Obat:</strong>
            <span id="labelMedicine"></span>
        </p>

        <p>
            <strong>Dosis:</strong>
            <span id="labelDose"></span>
        </p>

        <p>
            <strong>Waktu:</strong>
            <span id="labelTime"></span>
        </p>

    </div>

</div>


<script>

/* =====================================================
   CAMERA
===================================================== */

let stream = null;

let detectedMedicineName = "";

const video =
    document.getElementById("camera");

const status =
    document.getElementById("status");


async function startCamera() {

    console.log("BUTTON KAMERA DIKLIK");

    status.innerText =
        "⏳ Meminta izin kamera...";

    try {

        if (!navigator.mediaDevices) {

            status.innerText =
                "❌ Browser tidak mendukung kamera.";

            alert(
                "Browser ini tidak mendukung kamera. Gunakan Google Chrome."
            );

            return;
        }


        if (stream) {

            stream
                .getTracks()
                .forEach(function(track) {

                    track.stop();

                });

            stream = null;
        }


        /*
          SENGAJA menggunakan video:true
          agar kompatibilitas HP lebih tinggi.
        */

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: true,

                audio: false

            });


        console.log(
            "STREAM BERHASIL:",
            stream
        );


        video.srcObject =
            stream;


        video.muted =
            true;


        video.setAttribute(
            "playsinline",
            ""
        );


        await video.play();


        status.innerText =
            "📷 Kamera aktif! Arahkan kamera ke nama obat.";


    }

    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        status.innerText =
            "❌ Kamera gagal: " +
            error.name;


        if (
            error.name ===
            "NotAllowedError"
        ) {

            alert(
                "Izin kamera ditolak.\n\n" +
                "Tekan ikon 🔒 di address bar Chrome → Izin → Kamera → Izinkan."
            );

        }

        else if (
            error.name ===
            "NotFoundError"
        ) {

            alert(
                "Kamera tidak ditemukan di perangkat."
            );

        }

        else if (
            error.name ===
            "NotReadableError"
        ) {

            alert(
                "Kamera sedang digunakan aplikasi lain.\n\n" +
                "Tutup aplikasi Kamera/WhatsApp lalu coba lagi."
            );

        }

        else {

            alert(
                "Kamera gagal dibuka.\n\n" +
                "Error: " +
                error.name
            );

        }

    }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(function(track) {

                track.stop();

            });

        stream = null;

    }


    video.srcObject =
        null;


    status.innerText =
        "⏹️ Kamera dimatikan.";

}


/* =====================================================
   MEDICINE FORMULARY
===================================================== */

const formulary = [

    {
        name: "Epinephrine",
        keywords: [
            "EPINEPHRINE",
            "EPINEFRIN",
            "ADRENALINE",
            "ADRENALIN"
        ]
    },

    {
        name: "Norepinephrine",
        keywords: [
            "NOREPINEPHRINE",
            "NOREPINEFRIN",
            "NORADRENALINE",
            "NORADRENALIN"
        ]
    },

    {
        name: "Dopamine",
        keywords: [
            "DOPAMINE",
            "DOPAMINEHCL",
            "DOPAMIN",
            "DOPAMINEHYDROCHLORIDE",
            "DOPAMINEHYDROCHLORID"
        ]
    },

    {
        name: "Dobutamine",
        keywords: [
            "DOBUTAMINE",
            "DOBUTAMIN"
        ]
    },

    {
        name: "Midazolam",
        keywords: [
            "MIDAZOLAM",
            "MIDAZOLAMHCL",
            "MIDAZOLAN",
            "MIDAZOLAMHYDROCHLORIDE"
        ]
    },

    {
        name: "Fentanyl",
        keywords: [
            "FENTANYL",
            "FENTANYLCITRATE",
            "FENTANIL",
            "FENTANYLCITRAT",
            "FENTANYLUM"
        ]
    },

    {
        name: "Ketamine",
        keywords: [
            "KETAMINE",
            "KETAMIN",
            "KETAMINEHCL",
            "KETAMINEHYDROCHLORIDE"
        ]
    },

    {
        name: "Lidocaine",
        keywords: [
            "LIDOCAINE",
            "LIDOKAIN",
            "LIDOCAINEHCL"
        ]
    },

    {
        name: "D40",
        keywords: [
            "D40",
            "DEXTROSE40",
            "DEXTROSE"
        ]
    },

    {
        name: "Meylon",
        keywords: [
            "MEYLON",
            "SODIUMBICARBONATE",
            "BICARBONATE"
        ]
    },

    {
        name: "Dexamethasone",
        keywords: [
            "DEXAMETHASONE",
            "DEXAMETASON"
        ]
    },

    {
        name: "Alkohol 70%",
        keywords: [
            "ALKOHOL70",
            "ALCOHOL70",
            "ETHANOL70"
        ]
    }

];


/* =====================================================
   STOCK
===================================================== */

let stock = {};

try {

    const saved =
        localStorage.getItem(
            "smartNursingTrolleyStock"
        );

    if (saved) {

        stock =
            JSON.parse(saved);

    }

}
catch (error) {

    console.log(
        "Stock belum tersedia."
    );

}


function saveStock() {

    localStorage.setItem(

        "smartNursingTrolleyStock",

        JSON.stringify(stock)

    );

}


/* =====================================================
   OCR SCAN
===================================================== */

async function scanMedicine() {

    if (!stream) {

        alert(
            "📷 Buka kamera terlebih dahulu."
        );

        return;

    }


    status.innerText =
        "🔍 Sedang mengambil gambar...";


    try {

        const canvas =
            document.createElement("canvas");


        canvas.width =
            video.videoWidth;


        canvas.height =
            video.videoHeight;


        const ctx =
            canvas.getContext("2d");


        ctx.drawImage(

            video,

            0,

            0,

            canvas.width,

            canvas.height

        );


        status.innerText =
            "🔍 Membaca nama obat...";


        const result =
            await Tesseract.recognize(

                canvas,

                "eng",

                {

                    logger: function(info) {

                        if (
                            info.status ===
                            "recognizing text"
                        ) {

                            status.innerText =
                                "🔍 OCR " +
                                Math.round(
                                    info.progress * 100
                                ) +
                                "%";

                        }

                    }

                }

            );


        const text =
            result.data.text
            .toUpperCase();


        document.getElementById(
            "ocrResult"
        ).innerText =
            text || "Tulisan tidak terbaca.";


        console.log(
            "OCR:",
            text
        );


        const medicine =
            findMedicine(text);


        if (medicine) {

            detectedMedicineName =
                medicine.name;


            document.getElementById(
                "detectedCard"
            ).classList.remove(
                "hidden"
            );


            document.getElementById(
                "detectedMedicine"
            ).innerHTML =

                "<strong>" +
                medicine.name +
                "</strong><br><br>" +

                "Obat terdeteksi dari hasil OCR.";

            status.innerText =
                "✅ Obat berhasil dikenali.";

        }

        else {

            detectedMedicineName =
                "";


            document.getElementById(
                "detectedCard"
            ).classList.add(
                "hidden"
            );


            status.innerText =
                "⚠️ Nama obat belum dikenali.";

        }

    }

    catch (error) {

        console.error(
            error
        );

        status.innerText =
            "❌ OCR gagal.";

        alert(
            "Scan gagal. Pastikan tulisan obat terlihat jelas dan pencahayaan cukup."
        );

    }

}


/* =====================================================
   FIND MEDICINE
===================================================== */

function findMedicine(text) {

    const cleanText =
        text
        .toUpperCase()
        .replace(
            /[^A-Z0-9]/g,
            ""
        );


    for (
        let i = 0;
        i < formulary.length;
        i++
    ) {

        const medicine =
            formulary[i];


        for (
            let j = 0;
            j < medicine.keywords.length;
            j++
        ) {

            const keyword =
                medicine.keywords[j]
                .replace(
                    /[^A-Z0-9]/g,
                    ""
                );


            if (
                cleanText.includes(
                    keyword
                )
            ) {

                return medicine;

            }

        }

    }


    return null;

}


/* =====================================================
   APPROVE MEDICINE
===================================================== */

function approveMedicine() {

    if (!detectedMedicineName) {

        return;

    }


    if (
        !stock[
            detectedMedicineName
        ]
    ) {

        stock[
            detectedMedicineName
        ] = 0;

    }


    stock[
        detectedMedicineName
    ]++;


    saveStock();


    renderStock();


    document.getElementById(
        "detectedCard"
    ).classList.add(
        "hidden"
    );


    status.innerText =
        "✅ " +
        detectedMedicineName +
        " berhasil ditambahkan ke stok.";


    detectedMedicineName =
        "";

}


/* =====================================================
   CANCEL
===================================================== */

function cancelScan() {

    detectedMedicineName =
        "";

    document.getElementById(
        "detectedCard"
    ).classList.add(
        "hidden"
    );

}


/* =====================================================
   STOCK RENDER
===================================================== */

function renderStock() {

    const list =
        document.getElementById(
            "stockList"
        );


    const medicines =
        Object.keys(stock);


    if (
        medicines.length === 0
    ) {

        list.innerHTML =
            "Belum ada obat.";

        return;

    }


    list.innerHTML =
        "";


    medicines.forEach(
        function(name) {

            const qty =
                stock[name];


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "stock-item";


            const warning =
                qty <= 2
                ? '<div class="low-stock">⚠️ Stok rendah</div>'
                : "";


            item.innerHTML =

                '<div>' +

                '<div class="stock-name">' +
                escapeHtml(name) +
                '</div>' +

                warning +

                '</div>' +

                '<div class="stock-controls">' +

                '<button onclick="decreaseStock(\'' +
                escapeJs(name) +
                '\')">−</button>' +

                '<span class="qty">' +
                qty +
                '</span>' +

                '<button onclick="increaseStock(\'' +
                escapeJs(name) +
                '\')">+</button>' +

                '</div>';


            list.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   STOCK PLUS
===================================================== */

function increaseStock(name) {

    stock[name]++;

    saveStock();

    renderStock();

}


/* =====================================================
   STOCK MINUS
===================================================== */

function decreaseStock(name) {

    if (
        stock[name] > 0
    ) {

        stock[name]--;

    }


    saveStock();

    renderStock();

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJs(text) {

    return String(text)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/* =====================================================
   PRINT LABEL
===================================================== */

function printLabel() {

    const patient =
        document.getElementById(
            "patientName"
        ).value;


    const medicine =
        document.getElementById(
            "printMedicine"
        ).value;


    const dose =
        document.getElementById(
            "dose"
        ).value;


    document.getElementById(
        "labelPatient"
    ).innerText =
        patient;


    document.getElementById(
        "labelMedicine"
    ).innerText =
        medicine;


    document.getElementById(
        "labelDose"
    ).innerText =
        dose;


    document.getElementById(
        "labelTime"
    ).innerText =
        new Date().toLocaleString(
            "id-ID"
        );


    window.print();

}


/* =====================================================
   INITIAL LOAD
===================================================== */

renderStock();


/* =====================================================
   STOP CAMERA WHEN
