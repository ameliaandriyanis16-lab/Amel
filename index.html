<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Nursing Trolley System</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    font-family: Arial, sans-serif;
    background: #f4f7f9;
    color: #222;
}

.container {
    max-width: 700px;
    margin: auto;
}

.header {
    background: white;
    padding: 20px;
    text-align: center;
    border-radius: 16px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    color: #666;
    margin-bottom: 0;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 16px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 14px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
}

.btn-camera {
    background: #1976d2;
    color: white;
}

.btn-stop {
    background: #d32f2f;
    color: white;
}

.btn-scan {
    background: #388e3c;
    color: white;
}

.btn-approve {
    background: #00897b;
    color: white;
}

.btn-cancel {
    background: #777;
    color: white;
}

.btn-print {
    background: #333;
    color: white;
}

video {
    width: 100%;
    min-height: 260px;
    margin-top: 12px;
    background: black;
    border-radius: 12px;
    object-fit: cover;
    display: block;
}

#status {
    margin-top: 10px;
    padding: 12px;
    text-align: center;
    border-radius: 8px;
    background: #eef2f5;
}

#ocrResult {
    background: #f1f1f1;
    padding: 12px;
    min-height: 60px;
    border-radius: 8px;
    white-space: pre-wrap;
}

.hidden {
    display: none;
}

.detected {
    background: #e8f5e9;
    padding: 15px;
    border-radius: 10px;
}

.stock-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid #ddd;
}

.stock-name {
    font-weight: bold;
}

.low {
    color: #d32f2f;
    font-size: 13px;
    margin-top: 4px;
}

.stock-control {
    display: flex;
    align-items: center;
    gap: 7px;
}

.stock-control button {
    width: 42px;
    margin: 0;
    padding: 8px;
}

.qty {
    min-width: 30px;
    text-align: center;
    font-weight: bold;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-top: 5px;
}

#printArea {
    display: none;
}

@media print {

    body * {
        visibility: hidden;
    }

    #printArea,
    #printArea * {
        visibility: visible;
    }

    #printArea {
        display: block;
        position: absolute;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: Arial, sans-serif;
        font-size: 12px;
    }

    @page {
        size: 58mm auto;
        margin: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>SMART NURSING TROLLEY SYSTEM</h1>
        <p>Emergency Drug Inventory System</p>
    </div>


    <!-- CAMERA -->

    <div class="card">

        <h2>📷 Scan Obat</h2>

        <button
            class="btn-camera"
            id="openCamera">
            📷 Buka Kamera Belakang
        </button>

        <button
            class="btn-stop"
            id="stopCamera">
            ⏹️ Matikan Kamera
        </button>

        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>

        <div id="status">
            Kamera belum digunakan
        </div>

        <button
            class="btn-scan"
            id="scanButton">
            🔍 Scan Obat
        </button>

    </div>


    <!-- OCR -->

    <div class="card">

        <h2>📝 Hasil Scan</h2>

        <div id="ocrResult">
            Belum ada hasil scan.
        </div>

    </div>


    <!-- OBAT TERDETEKSI -->

    <div
        class="card hidden"
        id="detectedCard">

        <h2>💊 Obat Terdeteksi</h2>

        <div
            class="detected"
            id="detectedMedicine">
        </div>

        <button
            class="btn-approve"
            id="approveButton">
            ✅ Approve & Tambahkan ke Stok
        </button>

        <button
            class="btn-cancel"
            id="cancelButton">
            ❌ Batal
        </button>

    </div>


    <!-- STOCK -->

    <div class="card">

        <h2>📦 Stok Obat</h2>

        <div id="stockList">
            Belum ada obat.
        </div>

    </div>


    <!-- PRINT -->

    <div class="card">

        <h2>🖨️ Print Label</h2>

        <label>Nama Pasien</label>

        <input
            id="patientName"
            type="text"
            placeholder="Nama pasien">

        <label>Nama
