<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Nursing Trolley</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f9;
    color:#222;
}
header{
    background:#1976d2;
    color:white;
    padding:18px;
    text-align:center;
}
header h1{margin:0;font-size:23px}
header p{margin:6px 0 0;font-size:13px}

.container{
    max-width:700px;
    margin:auto;
    padding:12px;
}

.card{
    background:white;
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h2{
    margin:0 0 14px;
    font-size:18px;
}

video{
    width:100%;
    border-radius:12px;
    background:#111;
    display:block;
}

.camera-controls{
    display:flex;
    gap:8px;
    margin-top:10px;
}

button{
    border:0;
    border-radius:9px;
    padding:10px 14px;
    font-size:14px;
    cursor:pointer;
}

.zoom-btn{
    background:#e3f2fd;
    color:#1565c0;
    font-weight:bold;
    flex:1;
}

.zoom-btn.active{
    background:#1976d2;
    color:white;
}

.scan-btn{
    width:100%;
    margin-top:10px;
    background:#1976d2;
    color:white;
    font-weight:bold;
    font-size:16px;
}

.approve{
    background:#2e7d32;
    color:white;
    width:100%;
    margin-top:10px;
    font-weight:bold;
}

.cancel{
    background:#ddd;
    width:100%;
    margin-top:8px;
}

.result{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    padding:14px;
    background:#eef7ee;
    border-radius:10px;
}

.status{
    font-size:13px;
    margin-top:10px;
    text-align:center;
    color:#666;
}

.stock-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:1px solid #eee;
}

.stock-row:last-child{border-bottom:0}

.drug-name{
    font-weight:bold;
    flex:1;
}

.stock-control{
    display:flex;
    align-items:center;
    gap:10px;
}

.stock-control button{
    width:38px;
    height:38px;
    padding:0;
    font-size:22px;
    background:#e8eef3;
}

.stock-number{
    min-width:28px;
    text-align:center;
    font-weight:bold;
    font-size:17px;
}

.form-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

select,input{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

.primary{
    background:#1976d2;
    color:white;
    width:100%;
}

.history-item{
    border-bottom:1px solid #eee;
    padding:12px 0;
}

.history-item:last-child{border-bottom:0}

.history-drug{
    font-weight:bold;
}

.small{
    font-size:12px;
    color:#666;
    margin-top:4px;
}

.delete-btn{
    background:#e53935;
    color:white;
    font-size:12px;
    padding:7px 10px;
    margin-top:7px;
}

.danger{
    background:#c62828;
    color:white;
    width:100%;
    margin-top:10px;
}

.print-box{
    background:#f8f8f8;
    padding:12px;
    border-radius:10px;
}

#canvas{
    display:none;
}

.hidden{display:none}

.loading{
    font-weight:bold;
    color:#1976d2;
}
</style>
</head>

<body>

<header>
    <h1>🚑 Smart Nursing Trolley</h1>
    <p>Emergency Medication Management System</p>
</header>

<div class="container">

<!-- ================= CAMERA ================= -->
<div class="card">
    <h2>📷 Kamera & Scan Obat</h2>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="camera-controls">
        <button class="zoom-btn active" id="zoom2" onclick="setZoom(2)">
            Zoom 2×
        </button>

        <button class="zoom-btn" id="zoom25" onclick="setZoom(2.5)">
            Zoom 2.5×
        </button>
    </div>

    <button class="scan-btn" onclick="scanMedicine()">
        📷 FOTO & SCAN
    </button>

    <div id="scanStatus" class="status">
        Kamera siap digunakan
    </div>
</div>

<!-- ================= RESULT ================= -->
<div class="card" id="resultCard">
    <h2>🔎 Hasil Scan</h2>

    <div id="resultText" class="result">
        Belum ada hasil scan
    </div>

    <button id="approveBtn" class="approve hidden" onclick="approveMedicine()">
        ✓ APPROVE
    </button>

    <button id="retryBtn" class="cancel hidden" onclick="resetScan()">
        ↻ Scan Ulang
    </button>
</div>

<!-- ================= STOCK ================= -->
<div class="card">
    <h2>💊 Stok Obat</h2>
    <div id="stockList"></div>
</div>

<!-- ================= FORMULARY ================= -->
<div class="card">
    <h2>📋 Formularium</h2>

    <div id="formularyList"></div>
</div>

<!-- ================= MANUAL USAGE ================= -->
<div class="card">
    <h2>📝 Pemakaian Obat Manual</h2>

    <div class="form-row">
        <select id="usageDrug"></select>
    </div>

    <div class="form-row">
        <input
            type="text"
            id="patientName"
            placeholder="Nama pasien"
        >
    </div>

    <div class="form-row">
        <input
            type="number"
            id="usageQty"
            min="1"
            value="1"
            placeholder="Jumlah"
        >
    </div>

    <button class="primary" onclick="addUsage()">
        ➕ Tambah Pemakaian
    </button>
</div>

<!-- ================= HISTORY ================= -->
<div class="card">
    <h2>📜 Riwayat Pemakaian</h2>

    <div id="historyList"></div>

    <button class="danger" onclick="deleteAllHistory()">
        🗑 Hapus Semua Riwayat
    </button>
</div>

<!-- ================= PRINT ================= -->
<div class="card">
    <h2>🖨️ Print Label</h2>

    <div class="print-box">

        <div class="form-row">
            <select id="printDrug"></select>
        </div>

        <div class="form-row">
            <input
                type="text"
                id="printPatient"
                placeholder="Nama pasien"
            >
        </div>

        <button class="primary" onclick="printLabel()">
            🖨️ PRINT LABEL
        </button>

    </div>
</div>

</div>
