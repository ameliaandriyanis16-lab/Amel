<script>

/* =====================================================
   FORMULARIUM INTERNAL
===================================================== */

const formulary = {

    "Epinephrine": [
        "EPINEPHRINE",
        "EPINEPHRIN",
        "ADRENALINE",
        "ADRENALIN"
    ],

    "Norepinephrine": [
        "NOREPINEPHRINE",
        "NOREPINEPHRIN",
        "NORADRENALINE",
        "NORADRENALIN"
    ],

    "Dopamine": [
        "DOPAMINE",
        "DOPAMIN",
        "DOPAMINE HCL",
        "DOPAMINE HCI",
        "DOPAMINEHCL",
        "DOPAMINEHCI",
        "DOPAMINE HYDROCHLORIDE",
        "DOPAMINEHYDROCHLORIDE",
        "DOPAMINEHYDROCHLORID",
        "DOPAMINHCL"
    ],

    "Dobutamine": [
        "DOBUTAMINE",
        "DOBUTAMIN"
    ],

    "Midazolam": [
        "MIDAZOLAM",
        "MIDAZOLAN",
        "MIDAZOLAM HCL",
        "MIDAZOLAM HCI",
        "MIDAZOLAMHCL",
        "MIDAZOLAMHCI",
        "MIDAZOLAM HYDROCHLORIDE",
        "MIDAZOLAMHYDROCHLORIDE"
    ],

    "Fentanyl": [
        "FENTANYL",
        "FENTANIL",
        "FENTANYL CITRATE",
        "FENTANYL CITRAT",
        "FENTANYLUM",
        "FENTANYLCITRATE"
    ],

    "Ketamine": [
        "KETAMINE",
        "KETAMIN",
        "KETAMINE HCL",
        "KETAMINE HCI",
        "KETAMINEHCL",
        "KETAMINEHCI",
        "KETAMINE HYDROCHLORIDE",
        "KETAMINEHYDROCHLORIDE"
    ],

    "Lidocaine": [
        "LIDOCAINE",
        "LIDOCAIN",
        "LIGNOCAINE"
    ],

    "D40": [
        "D40",
        "D 40",
        "DEXTROSE 40",
        "DEXTROSE40"
    ],

    "Meylon": [
        "MEYLON",
        "SODIUM BICARBONATE",
        "SODIUMBICARBONATE",
        "BICARBONATE"
    ],

    "Dexamethasone": [
        "DEXAMETHASONE",
        "DEXAMETASON",
        "DEXAMETHASON"
    ],

    "Alkohol 70%": [
        "ALKOHOL 70",
        "ALCOHOL 70",
        "ETHANOL 70",
        "ALKOHOL70",
        "ALCOHOL70",
        "ETHANOL70"
    ]

};


/* =====================================================
   VARIABLE
===================================================== */

let cameraStream = null;
let detectedDrug = null;
let ocrWorker = null;
let ocrReady = false;


/* =====================================================
   STOCK
===================================================== */

let stock =
    JSON.parse(
        localStorage.getItem(
            "smartTrolleyStock"
        )
    ) || {};


Object.keys(formulary).forEach(drug => {

    if (stock[drug] === undefined) {
        stock[drug] = 0;
    }

});

saveStock();
renderStock();


function saveStock() {

    localStorage.setItem(
        "smartTrolleyStock",
        JSON.stringify(stock)
    );

}


function renderStock() {

    const list =
        document.getElementById(
            "stockList"
        );

    list.innerHTML = "";

    Object.keys(formulary).forEach(drug => {

        const qty =
            stock[drug] || 0;

        const item =
            document.createElement("div");

        item.className =
            "stock-item";

        item.innerHTML = `

            <div>

                <strong>${drug}</strong>

                <br>

                <span class="${
                    qty <= 2
                    ? "low-stock"
                    : ""
                }">

                    Stok: ${qty}

                    ${
                        qty <= 2
                        ? " ⚠️"
                        : ""
                    }

                </span>

            </div>

            <div class="stock-buttons">

                <button
                    onclick="changeStock('${drug}', -1)">
                    −
                </button>

                <span class="stock-number">
                    ${qty}
                </span>

                <button
                    onclick="changeStock('${drug}', 1)">
                    +
                </button>

            </div>
        `;

        list.appendChild(item);

    });

}


function changeStock(drug, amount) {

    stock[drug] =
        Math.max(
            0,
            (stock[drug] || 0) + amount
        );

    saveStock();
    renderStock();

}


/* =====================================================
   KAMERA BELAKANG
===================================================== */

async function openBackCamera() {

    stopCamera();

    const status =
        document.getElementById(
            "cameraStatus"
        );

    status.innerText =
        "⏳ Membuka kamera belakang...";


    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Browser tidak mendukung kamera."
            );

        }


        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        },

                        frameRate: {
                            ideal: 30
                        }

                    },

                    audio: false

                });


        const video =
            document.getElementById(
                "video"
            );


        video.srcObject =
            cameraStream;


        await video.play();


        /* COBA AUTOFOCUS */

        const track =
            cameraStream
                .getVideoTracks()[0];


        if (
            track &&
            track.applyConstraints
        ) {

            try {

                await track.applyConstraints({

                    advanced: [
                        {
                            focusMode:
                                "continuous"
                        }
                    ]

                });

            }

            catch(e) {

                console.log(
                    "Continuous autofocus tidak tersedia."
                );

            }

        }


        status.innerText =
            "✅ Kamera aktif. Jangan terlalu dekat. Tempatkan nama obat di kotak hijau.";

    }

    catch(error) {

        console.error(error);

        status.innerText =
            "❌ Kamera gagal dibuka. Izinkan akses kamera dan gunakan HTTPS/GitHub Pages.";

    }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        cameraStream = null;

    }


    const video =
        document.getElementById(
            "video"
        );

    video.srcObject = null;

}


/* =====================================================
   NORMALISASI OCR
===================================================== */

function normalizeText(text) {

    return text
        .toUpperCase()
        .replace(/\n/g, " ")
        .replace(/\r/g, " ")
        .replace(/[|]/g, "I")
        .replace(/[^A-Z0-9% ]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


/* =====================================================
   NORMALISASI KHUSUS OCR
===================================================== */

function normalizeOCRWord(text) {

    return text
        .toUpperCase()
        .replace(/0/g, "O")
        .replace(/1/g, "I")
        .replace(/5/g, "S")
        .replace(/8/g, "B")
        .replace(/[^A-Z0-9]/g, "");

}


/* =====================================================
   LEVENSHTEIN
===================================================== */

function levenshtein(a, b) {

    const matrix = [];

    for (
        let i = 0;
        i <= b.length;
        i++
    ) {

        matrix[i] = [i];

    }


    for (
        let j = 0;
        j <= a.length;
        j++
    ) {

        matrix[0][j] = j;

    }


    for (
        let i = 1;
        i <= b.length;
        i++
    ) {

        for (
            let j = 1;
            j <= a.length;
            j++
        ) {

            if (
                b.charAt(i - 1) ===
                a.charAt(j - 1)
            ) {

                matrix[i][j] =
                    matrix[i - 1][j - 1];

            }

            else {

                matrix[i][j] =
                    Math.min(

                        matrix[i - 1][j - 1] + 1,

                        matrix[i][j - 1] + 1,

                        matrix[i - 1][j] + 1

                    );

            }

        }

    }

    return matrix[b.length][a.length];

}


/* =====================================================
   FUZZY MATCH
===================================================== */

function fuzzyMatch(text, keyword) {

    const normalizedText =
        normalizeText(text);

    const normalizedKeyword =
        normalizeText(keyword);


    const cleanText =
        normalizeOCRWord(
            normalizedText
        );


    const cleanKeyword =
        normalizeOCRWord(
            normalizedKeyword
        );


    if (!cleanKeyword) {
        return false;
    }


    /* EXACT */

    if (
        cleanText.includes(
            cleanKeyword
        )
    ) {

        return true;

    }


    /* WORD BY WORD */

    const words =
        normalizedText
            .split(" ")
            .filter(
                word => word.length >= 4
            );


    for (const word of words) {

        const cleanWord =
            normalizeOCRWord(
                word
            );


        if (
            cleanWord.length < 4
        ) {

            continue;

        }


        const distance =
            levenshtein(
                cleanWord,
                cleanKeyword
            );


        let allowed = 1;


        if (
            cleanKeyword.length >= 8
        ) {

            allowed = 2;

        }


        if (
            cleanKeyword.length >= 12
        ) {

            allowed = 3;

        }


        if (
            distance <= allowed
        ) {

            return true;

        }

    }


    return false;

}


/* =====================================================
   CARI OBAT
===================================================== */

function findMedicine(text) {

    const priority = [

        "Dopamine",
        "Midazolam",
        "Fentanyl",
        "Ketamine"

    ];


    /* PRIORITAS */

    for (
        const medicine of priority
    ) {

        for (
            const keyword
            of formulary[medicine]
        ) {

            if (
                fuzzyMatch(
                    text,
                    keyword
                )
            ) {

                return medicine;

            }

        }

    }


    /* SEMUA OBAT */

    for (
        const medicine in formulary
    ) {

        for (
            const keyword
            of formulary[medicine]
        ) {

            if (
                fuzzyMatch(
                    text,
                    keyword
                )
            ) {

                return medicine;

            }

        }

    }


    return null;

}


/* =====================================================
   SIAPKAN OCR
===================================================== */

async function prepareOCR() {

    if (ocrReady) {
        return;
    }


    document.getElementById(
        "cameraStatus"
    ).innerText =
        "⏳ Menyiapkan mesin OCR...";


    ocrWorker =
        await Tesseract.createWorker(
            "eng",
            1,
            {

                logger: info => {

                    console.log(info);

                }

            }
        );


    await ocrWorker.setParameters({

        preserve_interword_spaces:
            "1",

        user_defined_dpi:
            "300"

    });


    ocrReady = true;

}


/* =====================================================
   CREATE DIGITAL ZOOM
===================================================== */

function createZoomCanvas(
    source,
    zoom
) {

    const canvas =
        document.createElement(
            "canvas"
        );

    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
       SEMAKIN BESAR ZOOM,
       SEMAKIN KECIL AREA
       YANG DIAMBIL.
    */

    const cropWidth =
        source.width / zoom;

    const cropHeight =
        source.height / zoom;


    const sx =
        (source.width -
        cropWidth) / 2;


    const sy =
        (source.height -
        cropHeight) / 2;


    /*
       PERBESAR HASIL
    */

    const outputWidth =
        1800;


    const ratio =
        outputWidth /
        cropWidth;


    const outputHeight =
        Math.round(
            cropHeight * ratio
        );


    canvas.width =
        outputWidth;

    canvas.height =
        outputHeight;


    /*
       MATIKAN SMOOTHING
       AGAR TEKS KECIL TIDAK
       TERLALU BLUR
    */

    ctx.imageSmoothingEnabled =
        false;


    ctx.drawImage(

        source,

        sx,
        sy,
        cropWidth,
        cropHeight,

        0,
        0,
        outputWidth,
        outputHeight

    );


    return canvas;

}


/* =====================================================
   ENHANCE GAMBAR
===================================================== */

function enhanceCanvas(source) {

    const canvas =
        document.createElement(
            "canvas"
        );

    const ctx =
        canvas.getContext(
            "2d"
        );


    canvas.width =
        source.width;

    canvas.height =
        source.height;


    ctx.drawImage(
        source,
        0,
        0
    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const data =
        imageData.data;


    /*
       GRAYSCALE
       + CONTRAST
    */

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];


        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        gray =
            (gray - 128) * 1.8 + 128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/* =====================================================
   THRESHOLD
===================================================== */

function thresholdCanvas(source) {

    const canvas =
        document.createElement(
            "canvas"
        );

    const ctx =
        canvas.getContext(
            "2d"
        );


    canvas.width =
        source.width;

    canvas.height =
        source.height;


    ctx.drawImage(
        source,
        0,
        0
    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const data =
        imageData.data;


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const value =
            data[i] > 150
            ? 255
            : 0;


        data[i] =
            value;

        data[i + 1] =
            value;

        data[i + 2] =
            value;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/* =====================================================
   OCR IMAGE
===================================================== */

async function recognizeImage(
    image,
    mode
) {

    await ocrWorker.setParameters({

        tessedit_pageseg_mode:
            mode

    });


    const result =
        await ocrWorker.recognize(
            image
        );


    return result.data.text || "";

}


/* =====================================================
   SCAN OBAT
===================================================== */

async function scanMedicine() {

    if (!cameraStream) {

        alert(
            "Buka kamera belakang terlebih dahulu."
        );

        return;

    }


    const video =
        document.getElementById(
            "video"
        );


    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        alert(
            "Kamera belum siap."
        );

        return;

    }


    const button =
        document.getElementById(
            "scanButton"
        );


    button.disabled =
        true;


    detectedDrug =
        null;


    document.getElementById(
        "approveBtn"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "cancelBtn"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "ocrText"
    ).innerText = "";


    document.getElementById(
        "detectedMedicine"
    ).innerHTML =
        "📸 Mengambil gambar kamera...";


    try {

        /*
           TUNGGU SEDIKIT AGAR AUTOFOCUS
           PUNYA WAKTU MENYESUAIKAN
        */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    500
                )
        );


        /* ==========================
           AMBIL FRAME ASLI
        ========================== */

        const original =
            document.getElementById(
                "canvas"
            );


        original.width =
            video.videoWidth;

        original.height =
            video.videoHeight;


        const ctx =
            original.getContext(
                "2d"
            );


        ctx.drawImage(
            video,
            0,
            0,
            original.width,
            original.height
        );


        /* ==========================
           OCR READY
        ========================== */

        await prepareOCR();


        let allText = "";

        let medicine = null;


        /* ==========================
           ZOOM 2X
        ========================== */

        document.getElementById(
            "detectedMedicine"
        ).innerHTML =
            "🔎 Membaca tulisan... Zoom 2×";


        const zoom2 =
            createZoomCanvas(
                original,
                2
            );


        const enhanced2 =
            enhanceCanvas(
                zoom2
            );


        const text2 =
            await recognizeImage(
                enhanced2,
                Tesseract.PSM.SINGLE_BLOCK
            );


        allText +=
            "\n[Zoom 2×]\n" +
            text2;


        medicine =
            findMedicine(
                text2
            );


        /* ==========================
           ZOOM 3X
        ========================== */

        if (!medicine) {

            document.getElementById(
                "detectedMedicine"
            ).innerHTML =
                "🔎 Membaca tulisan... Zoom 3×";


            const zoom3 =
                createZoomCanvas(
                    original,
                    3
                );


            const enhanced3 =
                enhanceCanvas(
                    zoom3
                );


            const text3 =
                await recognizeImage(
                    enhanced3,
                    Tesseract.PSM.SPARSE_TEXT
                );


            allText +=
                "\n[Zoom 3×]\n" +
                text3;


            medicine =
                findMedicine(
                    text2 + " " + text3
                );

        }


        /* ==========================
           ZOOM 4X
        ========================== */

        if (!medicine) {

            document.getElementById(
                "detectedMedicine"
            ).innerHTML =
                "🔎 Membaca tulisan... Zoom 4×";


            const zoom4 =
                createZoomCanvas(
                    original,
                    4
                );


            const enhanced4 =
                enhanceCanvas(
                    zoom4
                );


            const threshold4 =
                thresholdCanvas(
                    enhanced4
                );


            const text4 =
                await recognizeImage(
                    threshold4,
                    Tesseract.PSM.SPARSE_TEXT
                );


            allText +=
                "\n[Zoom 4×]\n" +
                text4;


            medicine =
                findMedicine(
                    allText
                );

        }


        /* ==========================
           TAMPILKAN OCR
        ========================== */

        document.getElementById(
            "ocrText"
        ).innerText =
            allText.trim()
            ? "Hasil OCR:\n" +
              allText.trim()
            : "Tidak ada tulisan yang terbaca.";


        /* ==========================
           OBAT DITEMUKAN
        ========================== */

        if (medicine) {

            detectedDrug =
                medicine;


            document.getElementById(
                "detectedMedicine"
            ).innerHTML = `

                <strong style="
                    font-size:22px;
                    color:#0b7285;
                ">
                    💊 ${medicine}
                </strong>

                <br><br>

                ✅ Nama obat berhasil dikenali.

                <br><br>

                <small>
                    Periksa hasil sebelum menekan Approve.
                </small>

            `;


            /*
               OTOMATIS MASUK KE
               FORM LABEL
            */

            document.getElementById(
                "labelMedicine"
            ).value =
                medicine;


            document.getElementById(
                "approveBtn"
            ).classList.remove(
                "hidden"
            );


            document.getElementById(
                "cancelBtn"
            ).classList.remove(
                "hidden"
            );


            document.getElementById(
                "scanResultCard"
            ).scrollIntoView({

                behavior: "smooth",

                block: "center"

            });

        }


        /* ==========================
           OBAT TIDAK DITEMUKAN
        ========================== */

        else {

            detectedDrug =
                null;


            document.getElementById(
                "detectedMedicine"
            ).innerHTML = `

                ❌ <strong>
                Obat belum dikenali.
                </strong>

                <br><br>

                Coba lagi:

                <br>
                • Jarak sekitar 15–30 cm
                <br>
                • Nama obat di dalam kotak hijau
                <br>
                • Jangan terlalu dekat
                <br>
                • Cahaya cukup
                <br>
                • Hindari pantulan cahaya
                <br>
                • Kamera jangan digerakkan

                <br><br>

                🔄 Tekan
                <strong>Scan Obat</strong>
                lagi.

            `;

        }

    }

    catch(error) {

        console.error(error);

        document.getElementById(
            "detectedMedicine"
        ).innerHTML =
            "❌ Terjadi kesalahan saat membaca obat.";

        document.getElementById(
            "ocrText"
        ).innerText =
            error.message || "";

    }

    finally {

        button.disabled =
            false;

    }

}


/* =====================================================
   APPROVE
===================================================== */

function approveMedicine() {

    if (!detectedDrug) {

        alert(
            "Belum ada obat yang dikenali."
        );

        return;

    }


    stock[detectedDrug] =
        (stock[detectedDrug] || 0) + 1;


    saveStock();
    renderStock();


    document.getElementById(
        "detectedMedicine"
    ).innerHTML = `

        ✅ <strong>
        ${detectedDrug}
        </strong>

        berhasil ditambahkan ke stok.

        <br><br>

        Stok sekarang:
        <strong>
        ${stock[detectedDrug]}
        </strong>

    `;


    document.getElementById(
        "approveBtn"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "cancelBtn"
    ).classList.add(
        "hidden"
    );


    detectedDrug =
        null;

}


/* =====================================================
   BATAL
===================================================== */

function cancelScan() {

    detectedDrug =
        null;


    document.getElementById(
        "detectedMedicine"
    ).innerHTML =
        "Scan dibatalkan.";


    document.getElementById(
        "approveBtn"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "cancelBtn"
    ).classList.add(
        "hidden"
    );

}


/* =====================================================
   PRINT LABEL
===================================================== */

function printLabel() {

    const patient =
        document.getElementById(
            "patientName"
        ).value;


    const medicine =
        document.getElementById(
            "labelMedicine"
        ).value;


    const dose =
        document.getElementById(
            "labelDose"
        ).value;


    if (!medicine) {

        alert(
            "Nama obat belum diisi."
        );

        return;

    }


    document.getElementById(
        "printPatient"
    ).innerText =
        patient || "-";


    document.getElementById(
        "printMedicine"
    ).innerText =
        medicine;


    document.getElementById(
        "printDose"
    ).innerText =
        dose || "-";


    document.getElementById(
        "printTime"
    ).innerText =
        new Date()
            .toLocaleString(
                "id-ID"
            );


    window.print();

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    async () => {

        if (ocrWorker) {

            try {

                await ocrWorker.terminate();

            }

            catch(e) {}

        }

    }
);

</script>
