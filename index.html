<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Trolley Nursing System</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #263238;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 6px 0 0;
    font-size: 13px;
}

.container {
    padding: 15px;
    max-width: 700px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h2 {
    font-size: 18px;
    margin-top: 0;
}

video {
    width: 100%;
    border-radius: 10px;
    background: black;
    min-height: 220px;
    object-fit: cover;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 15px;
    cursor: pointer;
    margin: 4px;
}

.btn-camera {
    background: #37474f;
    color: white;
}

.btn-scan {
    background: #1565c0;
    color: white;
}

.btn-approve {
    background: #2e7d32;
    color: white;
}

.btn-cancel {
    background: #757575;
    color: white;
}

.btn-print {
    background: #6a1b9a;
    color: white;
}

.btn-plus {
    background: #2e7d32;
    color: white;
    min-width: 42px;
}

.btn-minus {
    background: #c62828;
    color: white;
    min-width: 42px;
}

.btn-close {
    background: #757575;
    color: white;
}

.status {
    margin-top: 10px;
    padding: 10px;
    background: #eceff1;
    border-radius: 8px;
    font-size: 14px;
}

.scan-result {
    display: none;
    margin-top: 15px;
    padding: 15px;
    border: 2px solid #2e7d32;
    border-radius: 10px;
    background: #e8f5e9;
}

.scan-result h3 {
    margin-top: 0;
    color: #1b5e20;
}

.medicine-name {
    font-size: 22px;
    font-weight: bold;
    margin: 10px 0;
}

.stock-item {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 10px;
    background: white;
}

.stock-name {
    font-size: 18px;
    font-weight: bold;
}

.stock-number {
    font-size: 25px;
    font-weight: bold;
    margin: 8px 0;
}

.low-stock {
    color: #c62828;
    font-weight: bold;
}

.normal-stock {
    color: #2e7d32;
    font-weight: bold;
}

.empty {
    text-align: center;
    color: #777;
    padding: 20px;
}

/* =========================
   FORM PRINT
========================= */

.print-form {
    display: none;
    margin-top: 15px;
    padding: 15px;
    border: 2px solid #6a1b9a;
    border-radius: 10px;
    background: #f3e5f5;
}

.print-form h3 {
    margin-top: 0;
    color: #4a148c;
}

.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

.form-group input {
    width: 100%;
    padding: 11px;
    border: 1px solid #bbb;
    border-radius: 8px;
    font-size: 15px;
}

.auto-medicine {
    background: #eeeeee;
    padding: 11px;
    border-radius: 8px;
    font-weight: bold;
}

/* =========================
   PRINT AREA
========================= */

#printArea {
    display: none;
}

/*
   FORMAT THERMAL PRINTER 58 MM
*/

@media print {

    @page {
        size: 58mm auto;
        margin: 0;
    }

    html,
    body {
        width: 58mm;
        margin: 0;
        padding: 0;
        background: white;
    }

    body * {
        visibility: hidden;
    }

    #printArea,
    #printArea * {
        visibility: visible;
    }

    #printArea {
        display: block;
        position: absolute;
        left: 0;
        top: 0;
        width: 58mm;
        margin: 0;
        padding: 0;
    }

    .label {
        width: 58mm;
        min-height: 38mm;

        padding: 4mm 3mm;

        border: 1px solid black;

        text-align: center;

        font-family: Arial, sans-serif;

        page-break-after: always;
    }

    .label-title {
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 4px;
    }

    .label-line {
        border-top: 1px solid black;
        margin: 3px 0;
    }

    .label-patient {
        font-size: 12px;
        font-weight: bold;
        margin: 4px 0;
    }

    .label-medicine {
        font-size: 15px;
        font-weight: bold;
        margin: 5px 0;
    }

    .label-dose {
        font-size: 13px;
        font-weight: bold;
        margin: 4px 0;
    }

    .label-date {
        font-size: 9px;
        margin-top: 5px;
    }
}
</style>
</head>

<body>

<header>
    <h1>SMART NURSING TROLLEY SYSTEM</h1>
    <p>Emergency Drug Inventory System</p>
</header>

<div class="container">

    <!-- CAMERA -->

    <div class="card">

        <h2>📷 Scan Obat</h2>

        <video id="camera" autoplay playsinline></video>

        <button class="btn-camera" onclick="startCamera()">
            Buka Kamera
        </button>

        <button class="btn-scan" onclick="scanMedicine()">
            🔍 Scan Obat
        </button>

        <canvas id="canvas"></canvas>

        <div id="status" class="status">
            Kamera belum digunakan.
        </div>

        <!-- HASIL SCAN -->

        <div id="scanResult" class="scan-result">

            <h3>Obat/Bahan Terdeteksi</h3>

            <div id="medicineName" class="medicine-name">
                -
            </div>

            <p>
                Pastikan nama sudah benar sebelum di-Approve.
            </p>

            <button
                class="btn-approve"
                onclick="approveMedicine()">
                ✅ Approve
            </button>

            <button
                class="btn-cancel"
                onclick="cancelScan()">
                ❌ Batal
            </button>

        </div>

    </div>


    <!-- STOCK -->

    <div class="card">

        <h2>📦 Stok</h2>

        <div id="stockList">

            <div class="empty">
                Belum ada item yang di-approve.
            </div>

        </div>

    </div>

</div>


<!-- AREA PRINT -->

<div id="printArea"></div>


<script>

/* =====================================================
   FORMULARIUM INTERNAL
===================================================== */

const formulary = [

    {
        name: "Epinephrine",
        keywords: [
            "EPINEPHRINE",
            "EPINEPHRIN",
            "ADRENALINE",
            "EPINEPHRINE HCL"
        ]
    },

    {
        name: "Norepinephrine",
        keywords: [
            "NOREPINEPHRINE",
            "NOREPINEPHRIN",
            "NORADRENALINE",
            "NOREPI",
            "NOREPI HCL"
        ]
    },

    {
        name: "Dopamine",
        keywords: [
            "DOPAMINE",
            "DOPAMINE HCL",
            "DOPAMIN"
        ]
    },

    {
        name: "Dobutamine",
        keywords: [
            "DOBUTAMINE",
            "DOBUTAMINE HCL",
            "DOBUTAMIN"
        ]
    },

    {
        name: "Midazolam",
        keywords: [
            "MIDAZOLAM",
            "MIDAZOLAM HCL"
        ]
    },

    {
        name: "Fentanyl",
        keywords: [
            "FENTANYL",
            "FENTANYL CITRATE",
            "FENTANIL"
        ]
    },

    {
        name: "Ketamine",
        keywords: [
            "KETAMINE",
            "KETAMINE HCL",
            "KETAMIN"
        ]
    },

    {
        name: "Lidocaine",
        keywords: [
            "LIDOCAINE",
            "LIDOCAIN",
            "LIDOCAINE HCL",
            "XYLOCAINE"
        ]
    },

    {
        name: "D40",
        keywords: [
            "D40",
            "D 40",
            "D-40",
            "DEXTROSE 40",
            "DEXTROSE 40%"
        ]
    },

    {
        name: "Meylon",
        keywords: [
            "MEYLON",
            "SODIUM BICARBONATE",
            "SODIUM BICARBONATE INJECTION"
        ]
    },

    {
        name: "Dexamethasone",
        keywords: [
            "DEXAMETHASONE",
            "DEXAMETHASON",
            "DEXAMETHASONE SODIUM PHOSPHATE"
        ]
    },

    {
        name: "Alkohol 70%",
        keywords: [
            "ALKOHOL 70",
            "ALCOHOL 70",
            "ETHANOL 70",
            "ALKOHOL",
            "ALCOHOL",
            "ETHANOL",
            "70%"
        ]
    }

];


/* =====================================================
   VARIABEL
===================================================== */

let stream = null;

let detectedMedicine = null;

let selectedPrintMedicine = null;


/* =====================================================
   LOAD STOCK
===================================================== */

let stock =
    JSON.parse(
        localStorage.getItem(
            "smartNursingTrolleyStock"
        )
    ) || {};


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

    const video =
        document.getElementById("camera");

    const status =
        document.getElementById("status");

    try {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }

        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        }

                    },

                    audio: false

                });


        video.srcObject = stream;

        status.innerText =
            "📷 Kamera aktif. Arahkan kamera ke tulisan nama obat.";

    }

    catch (error) {

        console.error(error);

        status.innerText =
            "❌ Kamera tidak dapat dibuka. Cek izin kamera.";

    }

}


/* =====================================================
   SCAN OBAT
===================================================== */

async function scanMedicine() {

    const video =
        document.getElementById("camera");

    const canvas =
        document.getElementById("canvas");

    const status =
        document.getElementById("status");


    if (!stream) {

        status.innerText =
            "⚠️ Buka kamera terlebih dahulu.";

        return;

    }


    status.innerText =
        "⏳ Mengambil gambar...";


    const width =
        video.videoWidth;

    const height =
        video.videoHeight;


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext("2d");


    ctx.filter =
        "grayscale(100%) contrast(200%) brightness(110%)";


    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );


    status.innerText =
        "🔎 OCR sedang membaca tulisan...";


    try {

        const result =
            await Tesseract.recognize(

                canvas,

                "eng",

                {

                    logger:
                    function(info) {

                        if (
                            info.status ===
                            "recognizing text"
                        ) {

                            const percent =
                                Math.round(
                                    info.progress * 100
                                );

                            status.innerText =
                                "🔎 Membaca tulisan... " +
                                percent +
                                "%";

                        }

                    }

                }

            );


        let text =
            result.data.text
                .toUpperCase()
                .replace(/\n/g, " ")
                .replace(/\s+/g, " ")
                .trim();


        console.log(
            "HASIL OCR:",
            text
        );


        const medicine =
            findMedicine(text);


        if (medicine) {

            detectedMedicine =
                medicine.name;


            document.getElementById(
                "medicineName"
            ).innerText =
                medicine.name;


            document.getElementById(
                "scanResult"
            ).style.display =
                "block";


            status.innerText =
                "✅ Obat berhasil dikenali. Silakan Approve.";

        }

        else {

            detectedMedicine =
                null;


            document.getElementById(
                "scanResult"
            ).style.display =
                "none";


            status.innerText =
                "❌ Nama belum dikenali. Coba dekatkan kamera dan pastikan tulisan jelas.";

        }

    }

    catch (error) {

        console.error(error);

        status.innerText =
            "❌ OCR gagal membaca gambar.";

    }

}


/* =====================================================
   FIND MEDICINE
===================================================== */

function findMedicine(text) {

    if (
        (
            text.includes("ALKOHOL") ||
            text.includes("ALCOHOL") ||
            text.includes("ETHANOL")
        )
        &&
        (
            text.includes("70") ||
            text.includes("7O")
        )
    ) {

        return {
            name: "Alkohol 70%"
        };

    }


    for (
        const medicine of formulary
    ) {

        for (
            const keyword of medicine.keywords
        ) {

            if (
                text.includes(keyword)
            ) {

                return medicine;

            }

        }

    }


    return null;

}


/* =====================================================
   APPROVE
===================================================== */

function approveMedicine() {

    if (!detectedMedicine) {

        alert(
            "Belum ada obat yang terdeteksi."
        );

        return;

    }


    if (
        !stock[detectedMedicine]
    ) {

        stock[detectedMedicine] =
            0;

    }


    stock[detectedMedicine] += 1;


    saveStock();

    renderStock();


    alert(
        detectedMedicine +
        " berhasil di-Approve dan masuk stok."
    );


    document.getElementById(
        "scanResult"
    ).style.display =
        "none";


    detectedMedicine =
        null;

}


/* =====================================================
   BATAL
===================================================== */

function cancelScan() {

    detectedMedicine =
        null;


    document.getElementById(
        "scanResult"
    ).style.display =
        "none";


    document.getElementById(
        "status"
    ).innerText =
        "Scan dibatalkan.";

}


/* =====================================================
   SAVE STOCK
===================================================== */

function saveStock() {

    localStorage.setItem(

        "smartNursingTrolleyStock",

        JSON.stringify(stock)

    );

}


/* =====================================================
   RENDER STOCK
===================================================== */

function renderStock() {

    const stockList =
        document.getElementById(
            "stockList"
        );


    const medicines =
        Object.keys(stock);


    if (
        medicines.length === 0
    ) {

        stockList.innerHTML =
            `
            <div class="empty">
                Belum ada item yang di-approve.
            </div>
            `;

        return;

    }


    stockList.innerHTML = "";


    medicines.forEach(
        function(name) {

            const quantity =
                stock[name];


            let warning;


            if (
                quantity < 2
            ) {

                warning =
                    `
                    <div class="low-stock">
                        ⚠️ Stok rendah
                    </div>
                    `;

            }

            else {

                warning =
                    `
                    <div class="normal-stock">
                        ✓ Stok aman
                    </div>
                    `;

            }


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "stock-item";


            item.innerHTML = `

                <div class="stock-name">
                    ${name}
                </div>

                <div class="stock-number">
                    ${quantity}
                </div>

                ${warning}

                <div>

                    <button
                        class="btn-minus"
                        onclick="decreaseStock('${name}')">
                        −
                    </button>

                    <button
                        class="btn-plus"
                        onclick="increaseStock('${name}')">
                        +
                    </button>

                    <button
                        class="btn-print"
                        onclick="openPrintForm('${name}')">
                        🖨️ Print Label
                    </button>

                </div>

            `;


            stockList.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   TAMBAH STOK
===================================================== */

function increaseStock(name) {

    stock[name] =
        (stock[name] || 0) + 1;


    saveStock();

    renderStock();

}


/* =====================================================
   KURANG STOK
===================================================== */

function decreaseStock(name) {

    if (!stock[name]) {

        return;

    }


    stock[name] -= 1;


    if (
        stock[name] <= 0
    ) {

        delete stock[name];

    }


    saveStock();

    renderStock();

}


/* =====================================================
   FORM PRINT
===================================================== */

function openPrintForm(name) {

    if (!stock[name]) {

        alert(
            "Obat belum masuk stok."
        );

        return;

    }


    selectedPrintMedicine =
        name;


    const stockList =
        document.getElementById(
            "stockList"
        );


    const existingForm =
        document.getElementById(
            "printForm"
        );


    if (existingForm) {

        existingForm.remove();

    }


    const form =
        document.createElement(
            "div"
        );


    form.id =
        "printForm";

    form.className =
        "print-form";


    form.innerHTML = `

        <h3>🏷️ Data Label Obat</h3>

        <div class="form-group">

            <label>
                Nama Pasien
            </label>

            <input
                type="text"
                id="patientName"
                placeholder="Ketik nama pasien"
            >

        </div>


        <div class="form-group">

            <label>
                Nama Obat
            </label>

            <div class="auto-medicine">
                ${name}
            </div>

        </div>


        <div class="form-group">

            <label>
                Dosis
            </label>

            <input
                type="text"
                id="dose"
                placeholder="Contoh: 5 mg / 10 mcg"
            >

        </div>


        <button
            class="btn-print"
            onclick="printPatientLabel()">
            🖨️ Print Label 58 mm
        </button>

        <button
            class="btn-close"
            onclick="closePrintForm()">
            Tutup
        </button>

    `;


    stockList.parentNode.appendChild(
        form
    );


    form.style.display =
        "block";


    form.scrollIntoView({
        behavior: "smooth"
    });

}


/* =====================================================
   TUTUP FORM PRINT
===================================================== */

function closePrintForm() {

    const form =
        document.getElementById(
            "printForm"
        );


    if (form) {

        form.remove();

    }


    selectedPrintMedicine =
        null;

}


/* =====================================================
   PRINT LABEL
===================================================== */

function printPatientLabel() {

    const patientName =
        document.getElementById(
            "patientName"
        ).value.trim();


    const dose =
        document.getElementById(
            "dose"
        ).value.trim();


    if (!patientName) {

        alert(
            "Nama pasien harus diisi."
        );

        return;

    }


    if (!dose) {

        alert(
            "Dosis harus diisi."
        );

        return;

    }


    if (!selectedPrintMedicine) {

        alert(
            "Obat belum dipilih."
        );

        return;

    }


    const printArea =
        document.getElementById(
            "printArea"
        );


    printArea.innerHTML =
        "";


    const now =
        new Date();


    const date =
        now.toLocaleDateString(
            "id-ID"
        );


    const time =
        now.toLocaleTimeString(
            "id-ID",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    const label =
        document.createElement(
            "div"
        );


    label.className =
        "label";


    label.innerHTML = `

        <div class="label-title">
            SMART NURSING TROLLEY
        </div>

        <div class="label-line"></div>

        <div class="label-patient">
            PASIEN: ${escapeHtml(patientName)}
        </div>

        <div class="label-medicine">
            ${escapeHtml(selectedPrintMedicine)}
        </div>

        <div class="label-dose">
            DOSIS: ${escapeHtml(dose)}
        </div>

        <div class="label-line"></div>

        <div class="label-date">
            ${date} ${time}
        </div>

    `;


    printArea.appendChild(
        label
    );


    window.print();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   LOAD DATA
