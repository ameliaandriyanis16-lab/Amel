<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Nursing Trolley</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f9;
    color: #222;
}

header {
    background: #0b7285;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    font-size: 14px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
    font-size: 19px;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    margin-top: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.btn-camera {
    background: #0b7285;
    color: white;
}

.btn-stop {
    background: #495057;
    color: white;
}

.btn-scan {
    background: #1971c2;
    color: white;
}

.btn-approve {
    background: #2b8a3e;
    color: white;
}

.btn-cancel {
    background: #c92a2a;
    color: white;
}

.btn-print {
    background: #7048e8;
    color: white;
}

video {
    width: 100%;
    border-radius: 10px;
    background: black;
    margin-top: 10px;
}

.status {
    background: #e7f5ff;
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 14px;
}

.result {
    background: #f8f9fa;
    border: 1px solid #dee2e6;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
}

input {
    width: 100%;
    padding: 11px;
    border: 1px solid #ced4da;
    border-radius: 7px;
    margin-top: 5px;
    margin-bottom: 12px;
    font-size: 15px;
}

label {
    font-weight: bold;
    font-size: 14px;
}

.stock-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.stock-buttons button {
    width: 38px;
    padding: 7px;
    margin: 0 2px;
}

.stock-number {
    display: inline-block;
    min-width: 35px;
    text-align: center;
    font-weight: bold;
}

.low-stock {
    color: #c92a2a;
    font-weight: bold;
}

.hidden {
    display: none;
}

#ocrText {
    white-space: pre-wrap;
    font-size: 13px;
    background: #f1f3f5;
    padding: 10px;
    border-radius: 7px;
    margin-top: 10px;
}

/* PRINT */
#printArea {
    display: none;
}

@media print {

    body * {
        visibility: hidden;
    }

    #printArea,
    #printArea * {
        visibility: visible;
    }

    #printArea {
        display: block;
        position: absolute;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 3mm;
        font-family: Arial, sans-serif;
        font-size: 12px;
    }

    @page {
        size: 58mm auto;
        margin: 0;
    }
}
</style>
</head>

<body>

<header>
    <h1>SMART NURSING TROLLEY SYSTEM</h1>
    <p>Emergency Drug Inventory System</p>
</header>

<div class="container">

    <!-- CAMERA -->
    <div class="card">

        <h2>📷 Kamera & Scan Obat</h2>

        <button
            class="btn-camera"
            onclick="openBackCamera()">
            📷 Buka Kamera Belakang
        </button>

        <button
            class="btn-stop"
            onclick="stopCamera()">
            ⏹️ Matikan Kamera
        </button>

        <video
            id="video"
            autoplay
            playsinline>
        </video>

        <div
            id="cameraStatus"
            class="status">
            Kamera belum digunakan
        </div>

        <button
            class="btn-scan"
            onclick="scanMedicine()">
            🔍 Scan Obat
        </button>

        <canvas
            id="canvas"
            class="hidden">
        </canvas>

    </div>


    <!-- HASIL SCAN -->
    <div
        class="card"
        id="scanResultCard">

        <h2>🔎 Hasil Scan</h2>

        <div
            id="detectedMedicine"
            class="result">
            Belum ada hasil scan.
        </div>

        <div id="ocrText"></div>

        <button
            id="approveBtn"
            class="btn-approve hidden"
            onclick="approveMedicine()">
            ✅ Approve & Masukkan Stok
        </button>

        <button
            id="cancelBtn"
            class="btn-cancel hidden"
            onclick="cancelScan()">
            ❌ Batal
        </button>

    </div>


    <!-- STOK -->
    <div class="card">

        <h2>💊 Stok Obat</h2>

        <div id="stockList"></div>

    </div>


    <!-- PRINT LABEL -->
    <div class="card">

        <h2>🖨️ Print Label</h2>

        <label>
            Nama Pasien
        </label>

        <input
            type="text"
            id="patientName"
            placeholder="Nama pasien">


        <label>
            Nama Obat
        </label>

        <input
            type="text"
            id="labelMedicine"
            placeholder="Nama obat">


        <!-- TAMBAHAN DOSIS -->
        <label>
            Dosis / Konsentrasi
        </label>

        <input
            type="text"
            id="labelDose"
            placeholder="Tulis dosis / konsentrasi">


        <button
            class="btn-print"
            onclick="printLabel()">
            🖨️ Print Label 58 mm
        </button>

    </div>

</div>


<!-- AREA YANG DICETAK -->
<div id="printArea">

    <div style="text-align:center;">
        <strong>SMART NURSING TROLLEY</strong>
    </div>

    <hr>

    <div>
        <strong>Nama Pasien:</strong>
        <span id="printPatient"></span>
    </div>

    <br>

    <div>
        <strong>Nama Obat:</strong>
        <span id="printMedicine"></span>
    </div>

    <br>

    <div>
        <strong>Dosis:</strong>
        <span id="printDose"></span>
    </div>

    <br>

    <div>
        <strong>Waktu:</strong>
        <span id="printTime"></span>
    </div>

    <hr>

    <div style="text-align:center;">
        Emergency Drug
    </div>

</div>


<script>

/* =====================================================
   FORMULARIUM INTERNAL
   ===================================================== */

const formulary = {

    "Epinephrine": [
        "EPINEPHRINE",
        "EPINEPHRIN",
        "ADRENALINE",
        "ADRENALIN"
    ],

    "Norepinephrine": [
        "NOREPINEPHRINE",
        "NOREPINEPHRIN",
        "NORADRENALINE",
        "NORADRENALIN"
    ],

    "Dopamine": [
        "DOPAMINE",
        "DOPAMIN",
        "DOPAMINE HCL",
        "DOPAMINEHYDROCHLORIDE",
        "DOPAMINEHYDROCHLORID"
    ],

    "Dobutamine": [
        "DOBUTAMINE",
        "DOBUTAMIN"
    ],

    "Midazolam": [
        "MIDAZOLAM",
        "MIDAZOLAN",
        "MIDAZOLAM HCL",
        "MIDAZOLAMHYDROCHLORIDE"
    ],

    "Fentanyl": [
        "FENTANYL",
        "FENTANIL",
        "FENTANYL CITRATE",
        "FENTANYL CITRAT",
        "FENTANYLUM"
    ],

    "Ketamine": [
        "KETAMINE",
        "KETAMIN",
        "KETAMINE HCL",
        "KETAMINEHYDROCHLORIDE"
    ],

    "Lidocaine": [
        "LIDOCAINE",
        "LIDOCAIN",
        "LIGNOCAINE"
    ],

    "D40": [
        "D40",
        "D 40",
        "DEXTROSE 40",
        "DEXTROSE40"
    ],

    "Meylon": [
        "MEYLON",
        "SODIUM BICARBONATE",
        "BICARBONATE"
    ],

    "Dexamethasone": [
        "DEXAMETHASONE",
        "DEXAMETASON",
        "DEXAMETHASON"
    ],

    "Alkohol 70%": [
        "ALKOHOL",
        "ALCOHOL",
        "ETHANOL",
        "70%",
        "70",
        "7O"
    ]
};


/* =====================================================
   VARIABLES
   ===================================================== */

let cameraStream = null;
let detectedDrug = null;

const video =
    document.getElementById("video");


/* =====================================================
   STOCK
   ===================================================== */

let stock =
    JSON.parse(
        localStorage.getItem("smartTrolleyStock")
    ) || {};


Object.keys(formulary).forEach(drug => {

    if (stock[drug] === undefined) {
        stock[drug] = 0;
    }

});

saveStock();
renderStock();


function saveStock() {

    localStorage.setItem(
        "smartTrolleyStock",
        JSON.stringify(stock)
    );

}


function renderStock() {

    const list =
        document.getElementById("stockList");

    list.innerHTML = "";

    Object.keys(formulary).forEach(drug => {

        const qty = stock[drug] || 0;

        const item =
            document.createElement("div");

        item.className = "stock-item";

        item.innerHTML = `

            <div>

                <strong>${drug}</strong>

                <br>

                <span
                    class="${qty <= 2 ? "low-stock" : ""}">
                    Stok: ${qty}
                    ${qty <= 2 ? " ⚠️" : ""}
                </span>

            </div>

            <div class="stock-buttons">

                <button
                    onclick="changeStock('${drug}', -1)">
                    −
                </button>

                <span class="stock-number">
                    ${qty}
                </span>

                <button
                    onclick="changeStock('${drug}', 1)">
                    +
                </button>

            </div>

        `;

        list.appendChild(item);

    });

}


function changeStock(drug, amount) {

    stock[drug] =
        Math.max(
            0,
            (stock[drug] || 0) + amount
        );

    saveStock();
    renderStock();

}


/* =====================================================
   KAMERA BELAKANG
   ===================================================== */

async function openBackCamera() {

    try {

        stopCamera();

        document.getElementById(
            "cameraStatus"
        ).innerText =
            "Meminta akses kamera belakang...";


        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        exact: "environment"
                    }
                },

                audio: false

            });


        video.srcObject =
            cameraStream;


        document.getElementById(
            "cameraStatus"
        ).innerText =
            "✅ Kamera belakang aktif";

    }

    catch (error) {

        console.log(error);

        try {

            cameraStream =
                await navigator.mediaDevices.getUserMedia({

                    video: {
                        facingMode: "environment"
                    },

                    audio: false

                });


            video.srcObject =
                cameraStream;


            document.getElementById(
                "cameraStatus"
            ).innerText =
                "✅ Kamera belakang aktif";

        }

        catch (error2) {

            document.getElementById(
                "cameraStatus"
            ).innerText =
                "❌ Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.";

        }

    }

}


/* =====================================================
   MATIKAN KAMERA
   ===================================================== */

function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(track => track.stop());

        cameraStream = null;

    }

    video.srcObject = null;

}


/* =====================================================
   CARI OBAT
   ===================================================== */

function findMedicine(text) {

    const upperText =
        text.toUpperCase();

    for (
        const medicine in formulary
    ) {

        const keywords =
            formulary[medicine];

        for (
            const keyword of keywords
        ) {

            if (
                upperText.includes(
                    keyword.toUpperCase()
                )
            ) {

                return medicine;

            }

        }

    }

    return null;

}


/* =====================================================
   SCAN OBAT
   ===================================================== */

async function scanMedicine() {

    if (!cameraStream) {

        alert(
            "Buka kamera belakang terlebih dahulu."
        );

        return;

    }


    const canvas =
        document.getElementById("canvas");

    const ctx =
        canvas.getContext("2d");


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    document.getElementById(
        "detectedMedicine"
    ).innerHTML =
        "⏳ Sedang membaca tulisan obat...";


    document.getElementById(
        "ocrText"
    ).innerText =
        "";


    document.getElementById(
        "approveBtn"
    ).classList.add("hidden");


    document.getElementById(
        "cancelBtn"
    ).classList.add("hidden");


    try {

        const result =
            await Tesseract.recognize(
                canvas,
                "eng",
                {

                    logger: info => {

                        if (
                            info.status ===
                            "recognizing text"
                        ) {

                            document.getElementById(
                                "detectedMedicine"
                            ).innerHTML =
                                `⏳ Membaca... ${Math.round(
                                    info.progress * 100
                                )}%`;

                        }

                    }

                }
            );


        const text =
            result.data.text;


        document.getElementById(
            "ocrText"
        ).innerText =
            "Hasil OCR:\n" + text;


        const medicine =
            findMedicine(text);


        if (medicine) {

            detectedDrug =
                medicine;


            document.getElementById(
                "detectedMedicine"
            ).innerHTML = `

                <strong>
                    💊 ${medicine}
                </strong>

                <br><br>

                Obat berhasil dikenali.

            `;


            /* OTOMATIS MASUK KE PRINT LABEL */

            document.getElementById(
                "labelMedicine"
            ).value =
                medicine;


            document.getElementById(
                "approveBtn"
            ).classList.remove("hidden");


            document.getElementById(
                "cancelBtn"
            ).classList.remove("hidden");


            document
                .querySelector(
                    ".card:last-child"
                );


            setTimeout(() => {

                document.getElementById(
                    "labelMedicine"
                ).scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            }, 300);


        }

        else {

            detectedDrug = null;


            document.getElementById(
                "detectedMedicine"
            ).innerHTML = `

                ❌ Obat tidak dikenali.

                <br><br>

                Coba dekatkan kamera
                ke tulisan nama obat.

            `;

        }

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "detectedMedicine"
        ).innerHTML =
            "❌ OCR gagal. Silakan coba scan lagi.";

    }

}


/* =====================================================
   APPROVE
   ===================================================== */

function approveMedicine() {

    if (!detectedDrug) {

        return;

    }


    stock[detectedDrug] =
        (stock[detectedDrug] || 0) + 1;


    saveStock();
    renderStock();


    document.getElementById(
        "detectedMedicine"
    ).innerHTML = `

        ✅ <strong>
        ${detectedDrug}
        </strong>

        berhasil ditambahkan ke stok.

    `;


    document.getElementById(
        "approveBtn"
    ).classList.add("hidden");


    document.getElementById(
        "cancelBtn"
    ).classList.add("hidden");

}


/* =====================================================
   BATAL
   ===================================================== */

function cancelScan() {

    detectedDrug = null;


    document.getElementById(
        "detectedMedicine"
    ).innerHTML =
        "Scan dibatalkan.";


    document.getElementById(
        "approveBtn"
    ).classList.add("hidden");


    document.getElementById(
        "cancelBtn"
    ).classList.add("hidden");

}


/* =====================================================
   PRINT LABEL
   ===================================================== */

function printLabel() {

    const patient =
        document.getElementById(
            "patientName"
        ).value;


    const medicine =
        document.getElementById(
            "labelMedicine"
        ).value;


    /* DOSIS DIISI MANUAL */

    const dose =
        document.getElementById(
            "labelDose"
        ).value;


    if (!medicine) {

        alert(
            "Nama obat belum diisi."
        );

        return;

    }


    document.getElementById(
        "printPatient"
    ).innerText =
        patient || "-";


    document.getElementById(
        "printMedicine"
    ).innerText =
        medicine;


    document.getElementById(
        "printDose"
    ).innerText =
        dose || "-";


    const now =
        new Date();


    document.getElementById(
        "printTime"
    ).innerText =
        now.toLocaleString("id-ID");


    window.print();

}

</script>

</body>
</html>
