<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Nursing Trolley</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f9;
    color: #222;
}

header {
    background: #0b7285;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    font-size: 14px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
    font-size: 19px;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    margin-top: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.btn-camera {
    background: #0b7285;
    color: white;
}

.btn-stop {
    background: #495057;
    color: white;
}

.btn-scan {
    background: #1971c2;
    color: white;
}

.btn-approve {
    background: #2b8a3e;
    color: white;
}

.btn-cancel {
    background: #c92a2a;
    color: white;
}

.btn-print {
    background: #7048e8;
    color: white;
}

video {
    width: 100%;
    max-height: 450px;
    object-fit: cover;
    border-radius: 10px;
    background: black;
    margin-top: 10px;
}

.status {
    background: #e7f5ff;
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 14px;
}

.result {
    background: #f8f9fa;
    border: 1px solid #dee2e6;

    border-radius: 10px;

}

input {
    width: 100%;
    padding: 11px;

    margin-top: 5px;
    margin-bottom: 12px;

}

label {

}

    align-items: center;

}

    width: 38px;

}

    display: inline-block;

    text-align: center;
    font-weight: bold;
}

.low-stock {

}

.hidden {

}

#ocrText {
    white-space: pre-wrap;

    background: #f1f3f5;

}

/* AREA SCAN */
#scanPreview {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
    display: none;
}

/* PRINT */
#printArea {
    display: none;
}

@media print {

    body * {
        visibility: hidden;
    }

    #printArea,
    #printArea * {
        visibility: visible;
    }

    #printArea {
        display: block;
        position: absolute;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 3mm;
        font-family: Arial, sans-serif;
        font-size: 12px;
    }

    @page {
        size: 58mm auto;
        margin: 0;
    }
}
</style>
</head>

<header>
    <h1>SMART NURSING TROLLEY SYSTEM</h1>
    <p>Emergency Drug Inventory System</p>
</header>

<div class="container">

    <!-- CAMERA -->

        </video>

            class="hidden">

            Nama Obat
        </label>

        </label>

</div>


<!-- AREA YANG DICETAK -->

        <strong>SMART NURSING TROLLEY</strong>
    </div>

    </div>

    <div>

    </div>

    <div>
        <strong>Dosis:</strong>

    <div style="text-align:center;">
        Emergency Drug
    </div>

<script>

/* =====================================================
   FORMULARIUM INTERNAL
   ===================================================== */

const formulary = {

    "Epinephrine": [
        "EPINEPHRINE",
        "EPINEPHRIN",
        "ADRENALINE",
        "ADRENALIN"
    ],

    "Norepinephrine": [
        "NOREPINEPHRINE",
        "NOREPINEPHRIN",
        "NORADRENALINE",
        "NORADRENALIN"
    ],

    "Dopamine": [
        "DOPAMINE",
        "DOPAMIN",
        "DOPAMINE HCL",
        "DOPAMINE HCI",
        "DOPAMINEHCL",
        "DOPAMINEHCI",
        "DOPAMINE HYDROCHLORIDE",
        "DOPAMINEHYDROCHLORIDE",
        "DOPAMINEHYDROCHLORID",
        "DOPAMINHCL"
    ],

    "Dobutamine": [
        "DOBUTAMINE",
        "DOBUTAMIN"
    ],

    "Midazolam": [
        "MIDAZOLAM",
        "MIDAZOLAN",
        "MIDAZOLAM HCL",
        "MIDAZOLAM HCI",
        "MIDAZOLAMHCL",
        "MIDAZOLAMHCI",
        "MIDAZOLAM HYDROCHLORIDE",
        "MIDAZOLAMHYDROCHLORIDE"
    ],

    "Fentanyl": [
        "FENTANYL",
        "FENTANIL",
        "FENTANYL CITRATE",
        "FENTANYL CITRAT",
        "FENTANYLUM",
        "FENTANYLCITRATE"
    ],

    "Ketamine": [
        "KETAMINE",
        "KETAMIN",
        "KETAMINE HCL",
        "KETAMINE HCI",
        "KETAMINEHCL",
        "KETAMINEHCI",
        "KETAMINE HYDROCHLORIDE",
        "KETAMINEHYDROCHLORIDE"
    ],

    "Lidocaine": [
        "LIDOCAINE",
        "LIDOCAIN",
        "LIGNOCAINE"
    ],

    "D40": [
        "D40",
        "D 40",
        "DEXTROSE 40",
        "DEXTROSE40"
    ],

    "Meylon": [
        "MEYLON",
        "SODIUM BICARBONATE",
        "SODIUMBICARBONATE",
        "BICARBONATE"
    ],

    "Dexamethasone": [
        "DEXAMETHASONE",
        "DEXAMETASON",
        "DEXAMETHASON"
    ],

    "Alkohol 70%": [
        "ALKOHOL 70",
        "ALCOHOL 70",
        "ETHANOL 70",
        "ALKOHOL70",
        "ALCOHOL70",
        "ETHANOL70"
    ]
};


/* =====================================================
   VARIABEL
   ===================================================== */

let cameraStream = null;
let detectedDrug = null;
let ocrWorker = null;
let ocrReady = false;

const video = document.getElementById("video");


/* =====================================================
   STOCK
   ===================================================== */

let stock =
    JSON.parse(
        localStorage.getItem("smartTrolleyStock")
    ) || {};


Object.keys(formulary).forEach(drug => {

    if (stock[drug] === undefined) {
        stock[drug] = 0;
    }

});

saveStock();
renderStock();


function saveStock() {

    localStorage.setItem(
        "smartTrolleyStock",
        JSON.stringify(stock)
    );

}


function renderStock() {

    const list =
        document.getElementById("stockList");

    list.innerHTML = "";

    Object.keys(formulary).forEach(drug => {

        const qty = stock[drug] || 0;

        const item =
            document.createElement("div");

        item.className = "stock-item";

        item.innerHTML = `

            <div>

                <strong>${drug}</strong>

                <br>

                <span
                    class="${qty <= 2 ? "low-stock" : ""}">
                    Stok: ${qty}
                    ${qty <= 2 ? " ⚠️" : ""}
                </span>

            </div>

            <div class="stock-buttons">

                <button
                    onclick="changeStock('${drug}', -1)">
                    −
                </button>

                <span class="stock-number">
                    ${qty}
                </span>

                <button
                    onclick="changeStock('${drug}', 1)">
                    +
                </button>

            </div>

        `;

        list.appendChild(item);

    });

}


function changeStock(drug, amount) {

    stock[drug] =
        Math.max(
            0,
            (stock[drug] || 0) + amount
        );

    saveStock();
    renderStock();

}


/* =====================================================
   KAMERA BELAKANG
   ===================================================== */

async function openBackCamera() {

    try {

        stopCamera();

        document.getElementById(
            "cameraStatus"
        ).innerText =
            "⏳ Meminta akses kamera belakang...";

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            throw new Error(
                "Browser tidak mendukung kamera."
            );

        }


        /* COBA RESOLUSI TINGGI */

        try {

            cameraStream =
                await navigator.mediaDevices.getUserMedia({

                    video: {
                        facingMode: {
                            ideal: "environment"
                        },
                        width: {
                            ideal: 1920
                        },
                        height: {
                            ideal: 1080
                        },
                        frameRate: {
                            ideal: 30
                        }
                    },

                    audio: false

                });

        }

        catch (e) {

            /* FALLBACK */

            cameraStream =
                await navigator.mediaDevices.getUserMedia({

                    video: {
                        facingMode: "environment"
                    },

                    audio: false

                });

        }


        video.srcObject =
            cameraStream;

        await video.play();


        document.getElementById(
            "cameraStatus"
        ).innerText =
            "✅ Kamera belakang aktif — dekatkan tulisan obat dan pastikan fokus.";


        /* COBA AKTIFKAN AUTOFOCUS JIKA DIDUKUNG */

        const track =
            cameraStream.getVideoTracks()[0];

        if (track && track.applyConstraints) {

            try {

                await track.applyConstraints({
                    advanced: [
                        {
                            focusMode: "continuous"
                        }
                    ]
                });

            }

            catch (e) {
                console.log(
                    "Continuous focus tidak tersedia."
                );
            }

        }

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "cameraStatus"
        ).innerText =
            "❌ Kamera tidak dapat dibuka. Izinkan akses kamera dan gunakan HTTPS/GitHub Pages.";

    }

}


/* =====================================================
   STOP CAMERA
   ===================================================== */

function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(track => track.stop());

        cameraStream = null;

    }

    video.srcObject = null;

}


/* =====================================================
   NORMALISASI OCR
   ===================================================== */

function normalizeText(text) {

    return text
        .toUpperCase()
        .replace(/\n/g, " ")
        .replace(/\r/g, " ")
        .replace(/[|]/g, "I")
        .replace(/[{}[\]()]/g, " ")
        .replace(/[^A-Z0-9% ]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


/* =====================================================
   LEVENSHTEIN DISTANCE
   UNTUK MENANGANI TYPO OCR
   ===================================================== */

function levenshtein(a, b) {

    const matrix = [];

    for (let i = 0; i <= b.length; i++) {
        matrix[i] = [i];
    }

    for (let j = 0; j <= a.length; j++) {
        matrix[0][j] = j;
    }

    for (let i = 1; i <= b.length; i++) {

        for (let j = 1; j <= a.length; j++) {

            if (b.charAt(i - 1) ===
                a.charAt(j - 1)) {

                matrix[i][j] =
                    matrix[i - 1][j - 1];

            }

            else {

                matrix[i][j] =
                    Math.min(
                        matrix[i - 1][j - 1] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j] + 1
                    );

            }

        }

    }

    return matrix[b.length][a.length];

}


/* =====================================================
   FUZZY MATCH
   ===================================================== */

function fuzzyMatch(text, keyword) {

    const cleanText =
        text.replace(/\s/g, "");

    const cleanKeyword =
        keyword
            .toUpperCase()
            .replace(/\s/g, "");

    if (!cleanKeyword) {
        return false;
    }


    /* EXACT */

    if (cleanText.includes(cleanKeyword)) {
        return true;
    }


    /*
       Cek potongan kata.
       Misalnya OCR:
       DOPAMlNE
       DOPAMIN
       MIDAZ0LAM
    */

    const words =
        text.split(" ")
            .filter(word => word.length >= 4);


    for (const word of words) {

        const cleanWord =
            word.replace(/\s/g, "");

        if (cleanWord.length < 4) {
            continue;
        }

        const distance =
            levenshtein(
                cleanWord,
                cleanKeyword
            );

        const allowed =
            cleanKeyword.length >= 8
                ? 2
                : 1;

        if (distance <= allowed) {
            return true;
        }

    }

    return false;

}


/* =====================================================
   CARI OBAT
   ===================================================== */

function findMedicine(text) {

    const normalized =
        normalizeText(text);


    /* PRIORITAS OBAT YANG SERING GAGAL */

    const priority =
        [
            "Dopamine",
            "Midazolam",
            "Fentanyl",
            "Ketamine"
        ];


    /* CEK PRIORITAS */

    for (const medicine of priority) {

        for (const keyword of formulary[medicine]) {

            if (fuzzyMatch(
                normalized,
                keyword
            )) {

                return medicine;

            }

        }

    }


    /* CEK SEMUA OBAT */

    for (
        const medicine in formulary
    ) {

        for (
            const keyword of formulary[medicine]
        ) {

            if (
                fuzzyMatch(
                    normalized,
                    keyword
                )
            ) {

                return medicine;

            }

        }

    }

    return null;

}


/* =====================================================
   PREPROCESS IMAGE
   ===================================================== */

function preprocessImage(sourceCanvas) {

    const canvas =
        document.getElementById(
            "processingCanvas"
        );

    const ctx =
        canvas.getContext("2d");


    const maxWidth = 1600;

    let width =
        sourceCanvas.width;

    let height =
        sourceCanvas.height;


    /* UPSCALE */

    if (width < maxWidth) {

        const ratio =
            maxWidth / width;

        width =
            maxWidth;

        height =
            Math.round(
                height * ratio
            );

    }


    canvas.width =
        width;

    canvas.height =
        height;


    ctx.drawImage(
        sourceCanvas,
        0,
        0,
        width,
        height
    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const data =
        imageData.data;


    /*
       GRAYSCALE + CONTRAST
    */

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];


        let gray =
            (0.299 * r) +
            (0.587 * g) +
            (0.114 * b);


        /*
           CONTRAST
        */

        gray =
            ((gray - 128) * 1.55) + 128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/* =====================================================
   THRESHOLD IMAGE
   ===================================================== */

function createThresholdImage(sourceCanvas) {

    const canvas =
        document.createElement("canvas");

    const ctx =
        canvas.getContext("2d");


    canvas.width =
        sourceCanvas.width;

    canvas.height =
        sourceCanvas.height;


    ctx.drawImage(
        sourceCanvas,
        0,
        0
    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const data =
        imageData.data;


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const gray =
            data[i];


        /*
           THRESHOLD
        */

        const value =
            gray > 155
                ? 255
                : 0;


        data[i] =
            value;

        data[i + 1] =
            value;

        data[i + 2] =
            value;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/* =====================================================
   OCR WORKER
   ===================================================== */

async function prepareOCR() {

    if (ocrReady) {
        return;
    }


    document.getElementById(
        "cameraStatus"
    ).innerText =
        "⏳ Menyiapkan mesin pembaca tulisan...";


    ocrWorker =
        await Tesseract.createWorker(
            "eng",
            1,
            {
                logger: info => {

                    console.log(info);

                }
            }
        );


    await ocrWorker.setParameters({

        tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_BLOCK,

        preserve_interword_spaces:
            "1",

        user_defined_dpi:
            "300"

    });


    ocrReady = true;


    document.getElementById(
        "cameraStatus"
    ).innerText =
        "✅ Mesin OCR siap.";

}


/* =====================================================
   OCR SATU GAMBAR
   ===================================================== */

async function recognizeImage(image) {

    const result =
        await ocrWorker.recognize(
            image
        );

    return result.data.text || "";

}


/* =====================================================
   SCAN OBAT
   ===================================================== */

async function scanMedicine() {

    if (!cameraStream) {

        alert(
            "Buka kamera belakang terlebih dahulu."
        );

        return;

    }


    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        alert(
            "Kamera belum siap. Tunggu beberapa detik lalu coba lagi."
        );

        return;

    }


    const scanButton =
        document.getElementById(
            "scanButton"
        );


    scanButton.disabled =
        true;


    detectedDrug =
        null;


    document.getElementById(
        "detectedMedicine"
    ).innerHTML =
        "⏳ Mengambil gambar kamera...";


    document.getElementById(
        "ocrText"
    ).innerText =
        "";


    document.getElementById(
        "approveBtn"
    ).classList.add("hidden");


    document.getElementById(
        "cancelBtn"
    ).classList.add("hidden");


    try {

        /* =================================================
           AMBIL FRAME KAMERA
           ================================================= */

        const canvas =
            document.getElementById(
                "canvas"
            );

        const ctx =
            canvas.getContext("2d");


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* =================================================
           SIAPKAN OCR
           ================================================= */

        await prepareOCR();


        document.getElementById(
            "detectedMedicine"
        ).innerHTML =
            "⏳ Memproses gambar dan mempertajam tulisan...";


        /* =================================================
           PREPROCESS
           ================================================= */

        const processed =
            preprocessImage(
                canvas
            );


        /* =================================================
           THRESHOLD
           ================================================= */

        const threshold =
            createThresholdImage(
                processed
            );


        /* =================================================
           OCR MODE 1
           ================================================= */

        document.getElementById(
            "detectedMedicine"
        ).innerHTML =
            "⏳ Membaca tulisan obat... 1/2";


        await ocrWorker.setParameters({

            tessedit_pageseg_mode:
                Tesseract.PSM.SINGLE_BLOCK

        });


        const text1 =
            await recognizeImage(
                processed
            );


        let medicine =
            findMedicine(
                text1
            );


        /* =================================================
           OCR MODE 2 JIKA BELUM KETEMU
           ================================================= */

        let text2 = "";


        if (!medicine) {

            document.getElementById(
                "detectedMedicine"
            ).innerHTML =
                "⏳ Mencoba pembacaan kedua... 2/2";


            await ocrWorker.setParameters({

                tessedit_pageseg_mode:
                    Tesseract.PSM.SPARSE_TEXT

            });


            text2 =
                await recognizeImage(
                    threshold
                );


            medicine =
                findMedicine(
                    text1 + " " + text2
                );

        }


        const combinedText =
            (
                text1 +
                "\n" +
                text2
            ).trim();


        document.getElementById(
            "ocrText"
        ).innerText =
            combinedText
                ? "Hasil OCR:\n" +
                  combinedText
                : "OCR tidak menemukan tulisan.";


        /* =================================================
           JIKA OBAT DITEMUKAN
           ================================================= */

        if (medicine) {

            detectedDrug =
                medicine;


            document.getElementById(
                "detectedMedicine"
            ).innerHTML = `

                <strong style="font-size:20px;">
                    💊 ${medicine}
                </strong>

                <br><br>

                ✅ Obat berhasil dikenali.

                <br><br>

                Silakan tekan
                <strong>Approve</strong>
                untuk memasukkan 1 unit ke stok.

            `;


            /* OTOMATIS MASUK LABEL */

            document.getElementById(
                "labelMedicine"
            ).value =
                medicine;


            document.getElementById(
                "approveBtn"
            ).classList.remove("hidden");


            document.getElementById(
                "cancelBtn"
            ).classList.remove("hidden");


            document.getElementById(
                "scanResultCard"
            ).scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }


        /* =================================================
           JIKA TIDAK DITEMUKAN
           ================================================= */

        else {

            detectedDrug =
                null;


            document.getElementById(
                "detectedMedicine"
            ).innerHTML = `

                ❌ <strong>Obat belum dikenali.</strong>

                <br><br>

                Pastikan:

                <br>
                • Tulisan nama obat terlihat jelas
                <br>
                • Kamera fokus
                <br>
                • Jarak sekitar 15–30 cm
                <br>
                • Cahaya cukup
                <br>
                • Nama obat berada di tengah kamera

                <br><br>

                🔄 Silakan tekan
                <strong>Scan Obat</strong>
                lagi.

            `;

        }

    }

    catch (error) {

        console.error(error);


        document.getElementById(
            "detectedMedicine"
        ).innerHTML =
            "❌ Terjadi kesalahan saat membaca obat. Coba scan ulang.";


        document.getElementById(
            "ocrText"
        ).innerText =
            error.message || "";

    }

    finally {

        scanButton.disabled =
            false;

    }

}


/* =====================================================
   APPROVE
   ===================================================== */

function approveMedicine() {

    if (!detectedDrug) {

        alert(
            "Belum ada obat yang dikenali."
        );

        return;

    }


    stock[detectedDrug] =
        (stock[detectedDrug] || 0) + 1;


    saveStock();
    renderStock();


    document.getElementById(
        "detectedMedicine"
    ).innerHTML = `

        ✅ <strong>
        ${detectedDrug}
        </strong>

        <br><br>

        Berhasil ditambahkan ke stok.

        <br>

        Jumlah stok sekarang:
        <strong>
        ${stock[detectedDrug]}
        </strong>

    `;


    document.getElementById(
        "approveBtn"
    ).classList.add("hidden");


    document.getElementById(
        "cancelBtn"
    ).classList.add("hidden");


    detectedDrug =
        null;


    /* TAMPILKAN STOK TERBARU */

    document.getElementById(
        "stockList"
    ).scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}


/* =====================================================
   BATAL
   ===================================================== */

function cancelScan() {

    detectedDrug =
        null;


    document.getElementById(
        "detectedMedicine"
    ).innerHTML =
        "Scan dibatalkan.";


    document.getElementById(
        "approveBtn"
    ).classList.add("hidden");


    document.getElementById(
        "cancelBtn"
    ).classList.add("hidden");

}


/* =====================================================
   PRINT LABEL
   ===================================================== */

function printLabel() {

    const patient =
        document.getElementById(
            "patientName"
        ).value;


    const medicine =
        document.getElementById(
            "labelMedicine"
        ).value;


    const dose =
        document.getElementById(
            "labelDose"
        ).value;


    if (!medicine) {

        alert(
            "Nama obat belum diisi."
        );

        return;

    }


    document.getElementById(
        "printPatient"
    ).innerText =
        patient || "-";


    document.getElementById(
        "printMedicine"
    ).innerText =
        medicine;


    document.getElementById(
        "printDose"
    ).innerText =
        dose || "-";


    const now =
        new Date();


    document.getElementById(
        "printTime"
    ).innerText =
        now.toLocaleString(
            "id-ID"
        );


    window.print();

}


/* =====================================================
   BERSIHKAN WORKER SAAT HALAMAN DITUTUP
   ===================================================== */

window.addEventListener(
    "beforeunload",
    async () => {

        if (ocrWorker) {

            try {

                await ocrWorker.terminate();

            }

            catch (e) {}

        }

    }
);

</script>
