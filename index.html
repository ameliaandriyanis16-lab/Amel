}

    background:#eaf5ff;

}

}

    border:1px dashed #aaa;

@media(max-width:600px){
    .stock-item,
    .formulary-item{
        align-items:center;
    }

    }

<body>

<header>
    <h1>💊 Smart Nursing Trolley</h1>
    <p>Emergency Drug Inventory System</p>
</header>

<div class="container">

<!-- 1. CAMERA -->
<div class="card">
    <h2>📷 Kamera & Scan Obat</h2>

    <video id="camera" autoplay playsinline></video>

    <div style="margin-top:10px;">
        <button class="primary" onclick="openBackCamera()">
            📷 Buka Kamera
        </button>

        <button class="danger" onclick="stopCamera()">
            ⛔ Tutup Kamera
        </button>

        <button class="success" onclick="scanMedicine()">
            🔎 Scan Obat
        </button>
    </div>

    <p id="cameraStatus"></p>
</div>


<!-- 2. HASIL SCAN -->
<div class="card">
    <h2>🔎 Hasil Scan</h2>

    <div id="scanResult" class="scan-result">
        Belum ada hasil scan.
    </div>

    <div id="ocrText" class="ocr-text" style="display:none;"></div>

    <div id="scanButtons" style="display:none;margin-top:10px;">
        <button class="success" onclick="approveMedicine()">
            ✅ APPROVE +1 STOK
        </button>

        <button class="danger" onclick="cancelScan()">
            ❌ BATAL
        </button>
    </div>
</div>


<!-- 3. STOK OBAT -->

</div>


<!-- 4. FORMULARIUM -->
<div class="card">
    <h2>📋 Formularium</h2>

    <p style="font-size:13px;color:#666;">
        Pilih obat secara manual untuk mencatat pemakaian.
    </p>

    <div id="formularyList"></div>
</div>


<!-- 5. PEMAKAIAN MANUAL -->
<div class="card">
    <h2>📝 Pemakaian Obat Manual</h2>

    <div id="usageForm">

        <div class="selected-drug" id="selectedDrug">
            Belum memilih obat
        </div>

        <label>Jumlah yang digunakan</label>
        <input type="number" id="usageQuantity" min="1" value="1">

        <label>Tanggal</label>
        <input type="date" id="usageDate">

        <label>Jam</label>
        <input type="time" id="usageTime">

        <label>Nama Pasien</label>
        <input type="text" id="patientName" placeholder="Nama pasien">

        <label>No. RM / ID Pasien</label>
        <input type="text" id="patientId" placeholder="Nomor rekam medis / ID">

        <label>Ruangan / Bed</label>
        <input type="text" id="patientRoom" placeholder="Contoh: Melati 5 / Bed 3">

        <label>Keterangan</label>
        <textarea id="usageNote" placeholder="Keterangan tambahan (opsional)"></textarea>

        <div style="margin-top:10px;">
            <button class="success" onclick="saveUsage()">

</div>

<script>

const formulary = {

        "LIGNOCAINE",

    ],

    "D40":[
        "D40",

        "DEXTROSE 40",

    ],

    "Meylon":[
        "MEYLON",

        "MEYL0",
        "SODIUM BICARBONATE",
        "SODIUMBICARBONATE",
        "BICARBONATE"
    ],

    "Atropine sulfate":[
        "ATROPINE",
        "ATROPIN",
        "ATROPINE SULFATE",
        "ATROPINESULFATE",
        "ATROPINESULPHATE",
        "ATROPINESULFAT"
    ],

    "Amiodarone":[
        "AMIODARONE",
        "AMIODARON",
        "AMIDARONE",
        "AMIDARON",
        "AMIODARONE HCL",
        "AMIODARONEHCL",
        "AMIDARONE HCL",
        "AMIDARONEHCL"
    ],

    "Dexamethasone":[
        "DEXAMETHASONE",
        "DEXAMETASON",
        "DEXAMETHASON",
        "DEXAMETHAS0NE",
        "DEXAMETHAS0N"
    ],

    "Calcium gluconate":[
        "CALCIUM GLUCONATE",
        "CALCIUMGLUCONATE",
        "CALCIUM GLUCONAT",
        "CALCIUMGLUCONAT",
        "CALCIUMGLUC0NATE",
        "CALCIUM GLUKONAT",
        "CALCIUMGLUKONAT",
        "CALCIUM GLUKONATE",
        "CALCIUMGLUKONATE"
    ]
};


let stock = JSON.parse(
    localStorage.getItem("smartTrolleyStock") || "{}"
);

let usageHistory = JSON.parse(
    localStorage.getItem("smartTrolleyUsageHistory") || "[]"
);

let cameraStream = null;
let detectedDrug = null;
let selectedUsageDrug = null;
let ocrWorker = null;
let ocrReady = false;


/* =========================
   STOCK
========================= */

Object.keys(formulary).forEach(drug=>{
    if(typeof stock[drug] !== "number"){
        stock[drug] = 0;
    }
});

delete stock["Alkohol 70%"];

saveStock();
renderStock();
renderFormulary();
renderHistory();


function saveStock(){
    localStorage.setItem(
        "smartTrolleyStock",
        JSON.stringify(stock)
    );
}


function renderStock(){

    const container = document.getElementById("stockList");

    container.innerHTML = "";

    Object.keys(formulary).forEach(drug=>{

        const row = document.createElement("div");
        row.className = "stock-item";

        row.innerHTML = `
            <div class="stock-name">${drug}</div>

            <button class="danger small-btn"
                onclick="changeStock('${drug}',-1)">
                −
            </button>

            <div class="stock-number">
                ${stock[drug] || 0}
            </div>

            <button class="success small-btn"
                onclick="changeStock('${drug}',1)">
                +
            </button>
        `;

        container.appendChild(row);
    });
}


function changeStock(drug, amount){

    stock[drug] = Math.max(
        0,
        (stock[drug] || 0) + amount
    );

    saveStock();
    renderStock();
    renderFormulary();
}


/* =========================
   FORMULARIUM
========================= */

function renderFormulary(){

    const container =
        document.getElementById("formularyList");

    container.innerHTML = "";

    Object.keys(formulary).forEach(drug=>{

        const row =
            document.createElement("div");

        row.className = "formulary-item";

        row.innerHTML = `
            <div class="formulary-name">
                ${drug}
                <div class="formulary-stock">
                    Stok: ${stock[drug] || 0}
                </div>
            </div>

            <button class="primary"
                onclick="selectMedicineForUsage('${drug}')">
                Pakai
            </button>
        `;

        container.appendChild(row);
    });
}


function selectMedicineForUsage(drug){

    selectedUsageDrug = drug;

    document.getElementById("selectedDrug").innerHTML =
        "💊 Obat dipilih: " + drug;

    document.getElementById("usageQuantity").value = 1;

    document.querySelector(
        '[id="patientName"]'
    ).focus();
}


/* =========================
   DATE TIME
========================= */

function setCurrentDateTime(){

    const now = new Date();

    const date =
        now.toISOString().split("T")[0];

    const time =
        now.toTimeString().slice(0,5);

    document.getElementById("usageDate").value = date;
    document.getElementById("usageTime").value = time;

    document.getElementById("labelDate").value = date;
}

setCurrentDateTime();


/* =========================
   PEMAKAIAN
========================= */

function saveUsage(){

    if(!selectedUsageDrug){
        alert("Pilih obat terlebih dahulu dari Formularium.");
        return;
    }

    const quantity =
        parseInt(
            document.getElementById("usageQuantity").value
        );

    const date =
        document.getElementById("usageDate").value;

    const time =
        document.getElementById("usageTime").value;

    const patient =
        document.getElementById("patientName").value.trim();

    const patientId =
        document.getElementById("patientId").value.trim();

    const room =
        document.getElementById("patientRoom").value.trim();

    const note =
        document.getElementById("usageNote").value.trim();

    if(!quantity || quantity < 1){
        alert("Jumlah pemakaian tidak valid.");
        return;
    }

    if(!date || !time){
        alert("Tanggal dan jam harus diisi.");
        return;
    }

    if(!patient){
        alert("Nama pasien harus diisi.");
        return;
    }

    if(quantity > (stock[selectedUsageDrug] || 0)){
        alert(
            "Stok " +
            selectedUsageDrug +
            " tidak mencukupi."
        );
        return;
    }

    stock[selectedUsageDrug] -= quantity;

    const record = {

        id: Date.now(),

        date: date,

        time: time,

        medicine: selectedUsageDrug,

        quantity: quantity,

        patient: patient,

        patientId: patientId,

        room: room,

        note: note
    };

    usageHistory.unshift(record);

    saveStock();

    localStorage.setItem(
        "smartTrolleyUsageHistory",
        JSON.stringify(usageHistory)
    );

    renderStock();
    renderFormulary();
    renderHistory();

    alert(
        "Pemakaian " +
        selectedUsageDrug +
        " berhasil disimpan."
    );

    cancelUsage();
}


function cancelUsage(){

    selectedUsageDrug = null;

    document.getElementById("selectedDrug").innerHTML =
        "Belum memilih obat";

    document.getElementById("usageQuantity").value = 1;
    document.getElementById("patientName").value = "";
    document.getElementById("patientId").value = "";
    document.getElementById("patientRoom").value = "";
    document.getElementById("usageNote").value = "";

    setCurrentDateTime();
}


/* =========================
   RIWAYAT
========================= */

function renderHistory(){

    const container =
        document.getElementById("historyList");

    const filter =
        document.getElementById("historyFilter").value;

    container.innerHTML = "";

    let data = [...usageHistory];

    if(filter){
        data = data.filter(
            item => item.date === filter
        );
    }

    if(data.length === 0){

        container.innerHTML =
            `<div class="empty">
                Belum ada riwayat pemakaian.
             </div>`;

        return;
    }

    data.forEach(item=>{

        const div =
            document.createElement("div");

        div.className = "history-item";

        div.innerHTML = `
            <strong>${escapeHTML(item.medicine)}</strong>

            <br>
            Jumlah: ${item.quantity}

            <br>
            Tanggal: ${formatDate(item.date)}
            ${item.time}

            <br>
            Pasien: ${escapeHTML(item.patient)}

            ${item.patientId
                ? `<br>No. RM/ID: ${escapeHTML(item.patientId)}`
                : ""}

            ${item.room
                ? `<br>Ruangan/Bed: ${escapeHTML(item.room)}`
                : ""}

            ${item.note
                ? `<br>Keterangan: ${escapeHTML(item.note)}`
                : ""}

            <div class="history-actions">
                <button class="danger small-btn"
                    onclick="deleteHistory(${item.id})">
                    🗑️ Hapus
                </button>
            </div>
        `;

        container.appendChild(div);
    });
}


function deleteHistory(id){

    const confirmDelete =
        confirm(
            "Hapus riwayat ini?\n\n" +
            "Stok TIDAK akan dikembalikan."
        );

    if(!confirmDelete) return;

    usageHistory =
        usageHistory.filter(
            item => item.id !== id
        );

    localStorage.setItem(
        "smartTrolleyUsageHistory",
        JSON.stringify(usageHistory)
    );

    renderHistory();
}


function deleteAllHistory(){

    if(usageHistory.length === 0){
        alert("Tidak ada riwayat untuk dihapus.");
        return;
    }

    const confirmDelete =
        confirm(
            "Hapus SEMUA riwayat pemakaian?\n\n" +
            "Stok TIDAK akan dikembalikan."
        );

    if(!confirmDelete) return;

    usageHistory = [];

    localStorage.setItem(
        "smartTrolleyUsageHistory",
        JSON.stringify(usageHistory)
    );

    renderHistory();
}


function clearHistoryFilter(){

    document.getElementById(
        "historyFilter"
    ).value = "";

    renderHistory();
}


function formatDate(dateString){

    if(!dateString) return "";

    const parts =
        dateString.split("-");

    return `${parts[2]}-${parts[1]}-${parts[0]}`;
}


function escapeHTML(text){

    if(!text) return "";

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   CAMERA
========================= */

async function openBackCamera(){

    try{

        stopCamera();

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    },

                    frameRate:{
                        ideal:30
                    }
                },

                audio:false
            });

        const video =
            document.getElementById("camera");

        video.srcObject =
            cameraStream;

        document.getElementById(
            "cameraStatus"
        ).innerText =
            "✅ Kamera belakang aktif.";

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "cameraStatus"
        ).innerText =
            "❌ Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.";
    }
}


function stopCamera(){

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(track => track.stop());

        cameraStream = null;
    }

    document.getElementById(
        "camera"
    ).srcObject = null;

    document.getElementById(
        "cameraStatus"
    ).innerText =
        "Kamera dimatikan.";
}


/* =========================
   OCR NORMALIZATION
========================= */

function normalizeText(text){

    return text
        .toUpperCase()
        .replace(/[^A-Z0-9\s]/g," ")
        .replace(/\s+/g," ")
        .trim();
}


function normalizeOCRWord(text){

    return normalizeText(text)
        .replace(/0/g,"O")
        .replace(/1/g,"I");
}


function levenshtein(a,b){

    const matrix = [];

    for(let i=0;i<=b.length;i++){
        matrix[i] = [i];
    }

    for(let j=0;j<=a.length;j++){
        matrix[0][j] = j;
    }

    for(let i=1;i<=b.length;i++){

        for(let j=1;j<=a.length;j++){

            if(b.charAt(i-1) === a.charAt(j-1)){

                matrix[i][j] =
                    matrix[i-1][j-1];

            }else{

                matrix[i][j] =
                    Math.min(
                        matrix[i-1][j-1] + 1,
                        matrix[i][j-1] + 1,
                        matrix[i-1][j] + 1
                    );
            }
        }
    }

    return matrix[b.length][a.length];
}


function fuzzyMatch(text, alias){

    const a = normalizeOCRWord(text);
    const b = normalizeOCRWord(alias);

    if(!a || !b) return false;

    if(a.includes(b) || b.includes(a)){
        return true;
    }

    const distance =
        levenshtein(a,b);

    const maxLength =
        Math.max(a.length,b.length);

    return (
        distance <=
        Math.max(2,Math.floor(maxLength * .25))
    );
}


/* =========================
   SPECIAL MATCH
========================= */

function specialMedicineMatch(text){

    const t =
        normalizeOCRWord(text);

    if(
        t.includes("MEYLON") ||
        t.includes("MEYL0N") ||
        t.includes("BICARBONATE")
    ){
        return "Meylon";
    }

    if(
        t.includes("ATROPINE")
    ){
        return "Atropine sulfate";
    }

    if(
        t.includes("AMIODARONE") ||
        t.includes("AMIDARONE")
    ){
        return "Amiodarone";
    }

    if(
        t.includes("DEXAMETHASONE") ||
        t.includes("DEXAMETASON")
    ){
        return "Dexamethasone";
    }

    if(
        t.includes("KETAMINE") ||
        t.includes("KETAMIN")
    ){
        return "Ketamine";
    }

    if(
        t.includes("LIDOCAINE") ||
        t.includes("LIGNOCAINE") ||
        t.includes("LIDOKAIN")
    ){
        return "Lidocaine";
    }

    if(
        t.includes("CALCIUMGLUCONATE") ||
        t.includes("CALCIUMGLUCONAT") ||
        t.includes("CALCIUMGLUKONAT")
    ){
        return "Calcium gluconate";
    }

    return null;
}

   FIND MEDICINE
========================= */

function findMedicine(text){

    const normalized =
        normalizeText(text);

    const special =
        specialMedicineMatch(normalized);

    if(special){
        return special;
    }

    const priority = [
        "Dopamine",
        "Midazolam",
        "Fentanyl",
        "Ketamine",
        "Lidocaine",
        "Meylon",
        "Atropine sulfate",
        "Amiodarone",
        "Dexamethasone",
        "Calcium gluconate"
    ];

    for(const drug of priority){

        for(const alias of formulary[drug]){

            if(
                fuzzyMatch(normalized,alias)
            ){
                return drug;
            }
        }
    }

    for(const drug of Object.keys(formulary)){

        for(const alias of formulary[drug]){

            if(
                fuzzyMatch(normalized,alias)
            ){
                return drug;
            }
        }
    }

    return null;
}


/* =========================
   OCR
========================= */

async function prepareOCR(){

    if(ocrReady) return;

    try{

        ocrWorker =
            await Tesseract.createWorker(
                "eng"
            );

        await ocrWorker.setParameters({

            preserve_interword_spaces:"1",

            user_defined_dpi:"300"
        });

        ocrReady = true;

    }
    catch(error){

        console.error(error);

        alert(
            "OCR gagal disiapkan."
        );
    }
}


function createZoomCanvas(
    sourceCanvas,
    scale
){

    const canvas =
        document.createElement("canvas");

    canvas.width =
        sourceCanvas.width * scale;

    canvas.height =
        sourceCanvas.height * scale;

    const ctx =
        canvas.getContext("2d");

    ctx.imageSmoothingEnabled = true;

    ctx.imageSmoothingQuality = "high";

    ctx.drawImage(
        sourceCanvas,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas;
}


function enhanceCanvas(canvas){

    const ctx =
        canvas.getContext("2d");

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data =
        image.data;

    for(let i=0;i<data.length;i+=4){

        let r = data[i];
        let g = data[i+1];
        let b = data[i+2];

        let gray =
            0.299*r +
            0.587*g +
            0.114*b;

        gray =
            ((gray - 128) * 1.7) + 128;

        gray =
            Math.max(
                0,
                Math.min(255,gray)
            );

        data[i] = gray;
        data[i+1] = gray;
        data[i+2] = gray;
    }

    ctx.putImageData(
        image,
        0,
        0
    );

    return canvas;
}


function thresholdCanvas(canvas){

    const ctx =
        canvas.getContext("2d");

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data =
        image.data;

    for(let i=0;i<data.length;i+=4){

        const gray =
            (
                0.299*data[i] +
                0.587*data[i+1] +
                0.114*data[i+2]
            );

        const value =
            gray > 150 ? 255 : 0;

        data[i] = value;
        data[i+1] = value;
        data[i+2] = value;
    }

    ctx.putImageData(
        image,
        0,
        0
    );

    return canvas;
}


async function recognizeImage(canvas){

    await prepareOCR();

    const result =
        await ocrWorker.recognize(
            canvas
        );

    return result.data.text || "";
}


/* =========================
   SCAN
========================= */

async function scanMedicine(){

    if(!cameraStream){

        alert(
            "Buka kamera terlebih dahulu."
        );

        return;
    }

    const video =
        document.getElementById("camera");

    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        alert(
            "Kamera belum siap."
        );

        return;
    }

    document.getElementById(
        "scanResult"
    ).innerHTML =
        "⏳ Sedang membaca nama obat...";

    document.getElementById(
        "scanButtons"
    ).style.display = "none";

    detectedDrug = null;

    const canvas =
        document.createElement("canvas");

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    let text = "";

    try{

        const zoom2 =
            enhanceCanvas(
                createZoomCanvas(canvas,2)
            );

        text =
            await recognizeImage(zoom2);

        let drug =
            findMedicine(text);

        if(!drug){

            const zoom3 =
                enhanceCanvas(
                    createZoomCanvas(canvas,3)
                );

            text +=
                "\n" +
                await recognizeImage(zoom3);

            drug =
                findMedicine(text);
        }

        if(!drug){

            const zoom4 =
                thresholdCanvas(
                    createZoomCanvas(canvas,4)
                );

            text +=
                "\n" +
                await recognizeImage(zoom4);

            drug =
                findMedicine(text);
        }

        document.getElementById(
            "ocrText"
        ).style.display = "block";

        document.getElementById(
            "ocrText"
        ).innerText =
            "Hasil OCR:\n" + text.trim();

        if(drug){

            detectedDrug = drug;

            document.getElementById(
                "scanResult"
            ).innerHTML = `
                <div>Obat terdeteksi:</div>
                <div class="detected">
                    ${drug}
                </div>
            `;

            document.getElementById(
                "scanButtons"
            ).style.display = "block";

            document.getElementById(
                "labelMedicine"
            ).value = drug;

        }else{

            document.getElementById(
                "scanResult"
            ).innerHTML = `
                ❌ Nama obat belum dikenali.
                <br><br>
                Coba dekatkan kamera,
                pastikan tulisan jelas,
                dan pencahayaan cukup.
            `;
        }

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "scanResult"
        ).innerHTML =
            "❌ Terjadi kesalahan saat OCR.";
    }
}


/* =========================
   APPROVE
========================= */

function approveMedicine(){

    if(!detectedDrug){
        return;
    }

    stock[detectedDrug] =
        (stock[detectedDrug] || 0) + 1;

    saveStock();

    renderStock();
    renderFormulary();

    document.getElementById(
        "scanResult"
    ).innerHTML = `
        <div>✅ Berhasil ditambahkan:</div>
        <div class="detected">
            ${detectedDrug}
        </div>
        <div style="margin-top:5px;">
            Stok sekarang:
            <strong>${stock[detectedDrug]}</strong>
        </div>
    `;

    document.getElementById(
        "scanButtons"
    ).style.display = "none";

    detectedDrug = null;
}


function cancelScan(){

    detectedDrug = null;

    document.getElementById(
        "scanResult"
    ).innerHTML =
        "Scan dibatalkan.";

    document.getElementById(
        "scanButtons"
    ).style.display = "none";
}
